<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b12">
<title>Pocket Spatial · Buffered PCM Check</title>
<style>
:root{--bg:#080b12;--panel:#111722;--line:#293347;--text:#edf2fb;--dim:#94a1b5;--good:#5ddbc7;--warn:#e0bb65}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
body{padding:22px 14px 36px;max-width:720px;margin:auto}
h1{font-size:27px;line-height:1.05;margin:3px 0 7px}.sub{color:var(--dim);font-size:12px;line-height:1.5;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0}.hero{text-align:center}
button{display:block;width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:#171f2d;color:var(--text);padding:13px;font-size:16px;font-weight:650;text-align:center;margin:8px 0}
.status{font-size:12px;color:var(--dim);line-height:1.5;margin-top:8px}.good{color:var(--good)}.warn{color:var(--warn)}.legal{font-size:10.5px;color:var(--dim);line-height:1.55}a{color:inherit}
</style>
</head>
<body>
<h1>POCKET SPATIAL</h1>
<div class="sub">iPhone 6 diagnostic · remote bytes → decodeAudioData → AudioBufferSourceNode → analyser</div>
<div class="card hero">

</div>
