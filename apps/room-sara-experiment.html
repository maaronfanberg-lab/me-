<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Room — Sara experiment</title><style>:root{color-scheme:dark}body{margin:0;background:#090b12;color:#eef2f8;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:28px 18px 80px}h1{margin:6px 0;font-size:38px}.sub,.status{color:#9aa7bb}.status{font:12px ui-monospace,monospace;margin:18px 0}.msg{border:1px solid #263248;background:#101620;border-radius:16px;padding:14px 16px;margin:10px 0}.who{font-weight:750;margin-bottom:7px}.sara{border-color:#8f7b47}.sara .who{color:#ead58e}.empty{padding:28px 0;color:#9aa7bb}</style></head><body><main><div class="sub">isolated experiment · live Room untouched</div><h1>The Room + Sara</h1><p class="sub">Sarah · Mara · Owen · Jules · Sara</p><div id="status" class="status">Loading experiment…</div><div id="feed"></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const st=document.querySelector('#status'),feed=document.querySelector('#feed');try{const r=await fetch('../experiments/room-sara/session.json?x='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Experiment has not started yet');const d=await r.json();st.textContent='source cycle '+d.source_cycle+' · '+(d.turns?.length||0)+' experimental turns';const seed=(d.seed_messages||[]).slice(-12).map(m=>({message:m,seed:true})), turns=d.turns||[], all=[...seed,...turns];feed.innerHTML=all.length?all.map(x=>{const m=x.message||x,n=String(m.display_name||m.speaker||'').toLowerCase(),name=m.display_name||m.speaker||'Unknown';return `<div class="msg ${n==='sara'?'sara':''}"><div class="who">${esc(name)}</div><div>${esc(m.text||m.content||'')}</div></div>`}).join(''):'<div class="empty">Waiting for the first turn.</div>'}catch(e){st.textContent=e.message;feed.innerHTML='<div class="empty">The experiment branch exists, but the first session snapshot has not been committed yet.</div>'}}load();setInterval(load,8000)</script></body></html>
