.gui-head b{font-size:13px;letter-spacing:.12em}

.gui.closed .gui-body{display:none}
button{font:inherit;border:0;border-radius:4px;padding:7px 8px;background:#333;color:#fff;cursor:pointer;touch-action:manipulation}
button.on{background:var(--accent);color:#000;font-weight:700}
.gui-head button{padding:5px 9px;background:#2a2a2e}
details.group{border-top:1px solid var(--line)}details.group summary{padding:8px 10px;font-weight:700;cursor:pointer;list-style:none;color:#ddd}details.group summary::-webkit-details-marker{display:none}
details.group summary:before{content:'▸ ';color:var(--muted)}details.group[open] summary:before{content:'▾ '}
details.group>div{padding:0 8px 6px}.gh{color:var(--muted);font-size:11px;margin:0 2px 4px}
.row{display:grid;grid-template-columns:96px 1fr 46px;gap:5px;align-items:center;margin:3px 0;padding:2px;background:var(--row);border-radius:4px}
.row label{color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row.moved label{color:#fff}
.value{color:var(--num);text-align:right;font-size:11px;font-variant-numeric:tabular-nums;padding-right:2px}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.ctl{display:flex;align-items:center;gap:3px;min-width:0}.ctl .trk{flex:1;min-width:0;display:flex;align-items:center;min-height:30px;touch-action:pan-y}.ctl .trk input{touch-action:pan-y}
.stepb{width:26px;min-width:26px;height:26px;padding:0;border-radius:4px;background:#2c2c30;font-size:15px;line-height:1}
@media(pointer:coarse){.ctl .trk input{pointer-events:none}.stepb{width:32px;min-width:32px;height:32px}}
.pick,.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pick button,.chips button{padding:7px 2px;font-size:11px}
.chiprow{margin:6px 2px 4px}.chiprow .lab{color:var(--muted);font-size:11px;margin:0 0 3px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.hud{position:fixed;left:12px;top:12px;color:#fff;font:12px Menlo,Consolas,monospace;background:rgba(0,0,0,.55);padding:5px 8px;border-radius:6px;pointer-events:none;z-index:11;display:none}
#exitfs{position:fixed;right:12px;top:12px;z-index:12;display:none;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.35);padding:9px 14px}
body.immersive .gui{display:none}body.immersive.showui .hud:not(:empty){display:block}body.immersive.showui #exitfs{display:block}body.immersive.nocursor,body.immersive.nocursor *{cursor:none!important}
@media(max-width:719px){.gui{top:auto;left:0;right:0;bottom:0;width:auto;max-height:56vh;max-height:56dvh;border-left:0;border-top:1px solid var(--line);border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom)}
 .row{grid-template-columns:84px 1fr 44px}.pick{grid-template-columns:repeat(4,1fr)}}
