<style>
:root{--verdigris:#3E7A70;--shell:#1B1E24;--shell-2:#22262E;--shell-line:#333A45;--shell-text:#D8D4CA;--shell-dim:#8B8E97;--serif:"Cormorant Garamond",Georgia,serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden;background:var(--shell)}body{font-family:var(--mono);color:var(--shell-text);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}#plate{flex:1;position:relative;min-height:0}#sheet,#nibLayer{position:absolute;inset:0;width:100%;height:100%;display:block}#nibLayer{pointer-events:none}#masthead{position:absolute;top:14px;left:16px;right:16px;display:flex;align-items:baseline;gap:10px;pointer-events:none}#title{font-family:var(--serif);font-size:26px;font-weight:300;letter-spacing:.12em;opacity:.55}#ratioTag{font-family:var(--mono);font-size:10px;letter-spacing:.16em;opacity:.42}#progress{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--verdigris);opacity:.75}#transport{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center}.tbtn{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--shell-text);background:rgba(27,30,36,.88);border:1px solid var(--shell-line);border-radius:999px;padding:11px 18px;min-height:44px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.tbtn:active{background:var(--verdigris)}.tbtn:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}#drawer{background:var(--shell);border-top:1px solid var(--shell-line);max-height:62vh;display:flex;flex-direction:column;transition:max-height .32s cubic-bezier(.4,0,.2,1);padding-bottom:env(safe-area-inset-bottom)}#drawer.shut{max-height:60px}#handle{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;cursor:pointer;background:none;border:0;width:100%;color:inherit;font:inherit}#handle:focus-visible{outline:2px solid var(--verdigris);outline-offset:-3px}#handleLabel{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--shell-dim)}#chev{margin-left:auto;color:var(--shell-dim);font-size:13px;transition:transform .32s}#drawer.shut #chev{transform:rotate(180deg)}#panel{overflow-y:auto;overscroll-behavior:contain;padding:0 18px 24px;-webkit-overflow-scrolling:touch}.group{margin-top:18px}.glabel{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--verdigris);padding-bottom:10px;border-bottom:1px solid var(--shell-line);margin-bottom:6px}.ctl{padding:9px 0}.crow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.cname{font-size:13px;letter-spacing:.03em}.cval{font-size:12px;color:var(--verdigris);font-variant-numeric:tabular-nums}.chint{font-size:10px;color:var(--shell-dim);margin-top:5px;line-height:1.45}input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:40px;background:transparent;margin:0;display:block}input[type=range]:focus-visible{outline:2px solid var(--verdigris);outline-offset:4px;border-radius:6px}input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--shell-2);border:1px solid var(--shell-line)}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--shell-text);border:3px solid var(--shell);box-shadow:0 0 0 1px var(--shell-line);margin-top:-13px;cursor:grab}input[type=range]:active::-webkit-slider-thumb{background:var(--verdigris)}input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--shell-2);border:1px solid var(--shell-line)}input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--shell-text);border:3px solid var(--shell);cursor:grab}.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0 2px}.sw{width:44px;height:44px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}.sw[aria-pressed="true"]{border-color:var(--shell-text)}.sw:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 0 2px}.chip{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--shell-dim);background:var(--shell-2);border:1px solid var(--shell-line);border-radius:999px;padding:0 15px;min-height:40px;cursor:pointer}.chip[aria-pressed="true"]{color:var(--shell);background:var(--shell-text);border-color:var(--shell-text)}.chip:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}body.saver #drawer{display:none}body.saver #transport,body.saver #masthead,body.saver #progress{opacity:0;pointer-events:none;transition:opacity .6s}#saverHint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.28em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity 1.2s}body.saver #saverHint.show{opacity:.45}#saverBtn{width:100%;min-height:52px;margin-top:20px;font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--shell);background:var(--shell-text);border:0;border-radius:8px;cursor:pointer}#saverBtn:active{background:var(--verdigris);color:var(--shell-text)}#saverBtn:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px}@media (prefers-reduced-motion:reduce){#drawer,#chev{transition:none}}
</style>

<body>
<div id="plate"><canvas id="sheet"></canvas><canvas id="nibLayer"></canvas><div id="masthead"><span id="title">Harmonograph</span><span id="ratioTag"></span></div><div id="progress"></div><div id="saverHint">Tap to wake</div><div id="transport"><button class="tbtn" id="btnDraw">Draw</button><button class="tbtn" id="btnSheet">New sheet</button><button class="tbtn" id="btnShuffle">Shuffle</button></div></div>
<div id="drawer" class="shut"><button id="handle" aria-expanded="false" aria-controls="panel"><span id="handleLabel">Controls</span><span id="chev">&#9650;</span></button><div id="panel"></div></div>
<script>
"use strict";const TAU=Math.PI*2;const P={ratio:2.0,detune:0.009,comp:1.004,depth:0.42,twist:0.55,phase:1.2,fadeTo:0.28,length:56,flat:0.80,tilt:0.30,weight:0.16,strength:1.0,speed:0.55,hold:14,inkIdx:1,plateIdx:0};function pointAt(t,p,out){const det=Math.max(p.detune,0.002);const r=p.ratio+det;let c=p.comp;if(Math.abs(c-1)<0.006)c=1+(c>=1?0.006:-0.006);const k=-Math.log(Math.max(p.fadeTo,1e-4))/p.length;const e1=Math.exp(-k*t),e2=Math.exp(-k*1.35*t);const d=p.depth,q=p.twist,ph=p.phase;const x=(1-d)*Math.sin(TAU*t)*e1+d*Math.sin(TAU*c*t+ph)*e2;let y=(1-d)*Math.sin(TAU*r*t+q+0.35*ph)*e1+d*Math.sin(TAU*r*c*t+ph-q)*e2;y*=p.flat;out[0]=x+p.tilt*y;out[1]=y}const INKS=[{name:'Prussian',paper:'#16264A',plate:'#8FB4E8'},{name:'Graphite',paper:'#23232A',plate:'#D6D2C6'},{name:'Violet',paper:'#4A3B7A',plate:'#B49BE8'},{name:'Verdigris',paper:'#1B5A52',plate:'#63C9B8'},{name:'Oxblood',paper:'#6E1B33',plate:'#E27B9C'},{name:'Duotone',paper:'#4A3B7A',plate:'#B49BE8',pairP:'#8A6A1E',pairD:'#E8DBA6'}];const PLATES=[{name:'Rag paper',bg:'#EFEAE0',dark:false},{name:'Cool white',bg:'#F5F6F8',dark:false},{name:'Slate',bg:'#12151C',dark:true},{name:'Ink black',bg:'#07080B',dark:true}];const isDark=()=>PLATES[P.plateIdx].dark;const inkA=()=>isDark()?INKS[P.inkIdx].plate:INKS[P.inkIdx].paper;const inkB=()=>{const k=INKS[P.inkIdx];return k.pairP?(isDark()?k.pairD:k.pairP):inkA()};const isDuo=()=>!!INKS[P.inkIdx].pairP;function mix(a,b,u){const A=[1,3,5].map(i=>parseInt(a.substr(i,2),16));const B=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*u)).join(',')+')'}const cv=document.getElementById('sheet'),cx=cv.getContext('2d');const nv=document.getElementById('nibLayer'),nx=nv.getContext('2d');const bar=document.getElementById('progress');let W=0,H=0,DPR=1,scale=1,ox=0,oy=0;let XS=null,YS=null,N=0;let drawn=0,running=false,raf=null,t0=0,tOffset=0;const drawSeconds=()=>5*Math.pow(120,P.speed);function timeLabel(s){s=Math.round(s);return s<60?s+'s':Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'}function sampleCount(len){let c=P.comp;if(Math.abs(c-1)<0.006)c=1.006;const fMax=Math.max(1,P.ratio*c,c,P.ratio);return Math.min(240000,Math.round(len*Math.min(900,Math.max(190,fMax*46))))}function build(len,cap){const n=Math.max(2,Math.min(cap||1e9,sampleCount(len)));const xs=new Float32Array(n),ys=new Float32Array(n),o=[0,0];let m=1e-9;for(let i=0;i<n;i++){pointAt((i/(n-1))*len,P,o);xs[i]=o[0];ys[i]=o[1];const a=Math.max(Math.abs(o[0]),Math.abs(o[1]));if(a>m)m=a}return{xs,ys,n,m}}function compute(){const b=build(P.length);XS=b.xs;YS=b.ys;N=b.n;scale=Math.min(W,H)*0.42/b.m;ox=W/2;oy=H/2;drawn=0}const px=i=>ox+XS[i]*scale;const py=i=>oy-YS[i]*scale;function clearNib(){nx.clearRect(0,0,W,H)}function clearPlate(){const pl=PLATES[P.plateIdx];cx.fillStyle=pl.bg;cx.fillRect(0,0,W,H);clearNib();drawn=0;bar.style.width='0px';const c=pl.dark?'#EFEAE0':'#16264A';document.getElementById('title').style.color=c;document.getElementById('ratioTag').style.color=c;document.getElementById('saverHint').style.color=c}const lineW=()=>0.10+P.weight*1.55;function inkAlpha(){const a=0.34*Math.pow(6000/Math.max(N,1),0.42)*P.strength;return Math.max(0.015,Math.min(0.85,a))}function paint(upTo){if(N<2||upTo<=drawn)return;const duo=isDuo(),c1=inkA(),c2=inkB();cx.lineWidth=lineW();cx.lineCap='round';cx.lineJoin='round';cx.globalAlpha=inkAlpha();let i=Math.max(1,drawn);cx.strokeStyle=duo?mix(c1,c2,i/N):c1;cx.beginPath();cx.moveTo(px(i-1),py(i-1));const seg=Math.max(200,Math.round(N/90));for(;i<upTo;i++){cx.lineTo(px(i),py(i));if(duo&&i%seg===0){cx.stroke();cx.beginPath();cx.strokeStyle=mix(c1,c2,i/N);cx.moveTo(px(i),py(i))}}cx.stroke();cx.globalAlpha=1;drawn=upTo}function paintNib(upTo){clearNib();if(upTo<8||upTo>=N)return;const c1=isDuo()?mix(inkA(),inkB(),upTo/N):inkA();const a=inkAlpha();const tail=Math.min(upTo-1,Math.max(40,Math.round(N*2/drawSeconds())));nx.lineCap='round';nx.lineJoin='round';nx.strokeStyle=c1;nx.lineWidth=lineW()*1.25;for(let s=0;s<3;s++){const from=upTo-Math.round(tail*(3-s)/3),to=upTo-Math.round(tail*(2-s)/3);if(to<=from)continue;nx.globalAlpha=Math.min(0.65,a*(2.2+s*2.6));nx.beginPath();nx.moveTo(px(from),py(from));for(let j=from+1;j<=to;j++)nx.lineTo(px(j),py(j));nx.stroke()}const gx=px(upTo-1),gy=py(upTo-1);nx.globalAlpha=0.4;nx.lineWidth=1;nx.beginPath();nx.arc(gx,gy,9,0,TAU);nx.stroke();nx.globalAlpha=1;nx.fillStyle=c1;nx.beginPath();nx.arc(gx,gy,3,0,TAU);nx.fill();nx.globalAlpha=1}function tick(){if(!running)return;const frac=Math.min(1,((performance.now()-t0)/1000+tOffset)/drawSeconds());const next=Math.min(N,Math.max(drawn+1,Math.round(frac*N)));paint(next);paintNib(next);bar.style.width=(frac*100).toFixed(2)+'%';if(frac>=1){running=false;clearNib();setLabel();if(saver)saverTimer=setTimeout(saverFade,holdMs());return}raf=requestAnimationFrame(tick)}function startDraw(){cancelAnimationFrame(raf);compute();clearPlate();running=true;t0=performance.now();tOffset=0;setLabel();tagline();raf=requestAnimationFrame(tick)}function pauseDraw(){if(running)tOffset+=(performance.now()-t0)/1000;running=false;cancelAnimationFrame(raf);setLabel()}function resumeDraw(){running=true;t0=performance.now();setLabel();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}function newSheet(){pauseDraw();tOffset=0;compute();clearPlate();tagline()}function setLabel(){document.getElementById('btnDraw').textContent=running?'Pause':'Draw'}function ghost(){pauseDraw();tOffset=0;const g=build(P.length,9000);scale=Math.min(W,H)*0.42/g.m;ox=W/2;oy=H/2;clearPlate();cx.lineWidth=Math.max(0.4,lineW());cx.lineCap='round';cx.lineJoin='round';cx.globalAlpha=Math.max(0.05,Math.min(0.4,0.34*Math.pow(6000/g.n,0.42)*3));cx.strokeStyle=inkA();cx.beginPath();cx.moveTo(ox+g.xs[0]*scale,oy-g.ys[0]*scale);for(let i=1;i<g.n;i++)cx.lineTo(ox+g.xs[i]*scale,oy-g.ys[i]*scale);cx.stroke();cx.globalAlpha=1;XS=g.xs;YS=g.ys;N=g.n;drawn=0;tagline()}function repaint(){const d=drawn;clearPlate();if(d>1)paint(d)}function passSpacing(){if(!N||N<200)return 0;let lo=1e9,hi=-1e9;for(let i=0;i<N;i+=7){if(YS[i]<lo)lo=YS[i];if(YS[i]>hi)hi=YS[i]}const cut=lo+(hi-lo)*0.35,xs=[];for(let i=1;i<N;i++){if((YS[i-1]-cut)*(YS[i]-cut)<0)xs.push(XS[i]*scale);if(xs.length>4000)break}if(xs.length<4)return 0;xs.sort((a,b)=>a-b);const g=[];for(let i=1;i<xs.length;i++){const d=xs[i]-xs[i-1];if(d>1e-4)g.push(d)}if(!g.length)return 0;g.sort((a,b)=>a-b);return g[g.length>>1]}function tagline(){const sp=passSpacing();let note='';if(sp>0)note='   ·   '+sp.toFixed(1)+'px apart'+(sp<0.7?' (merging)':(sp>6?' (open)':''));document.getElementById('ratioTag').textContent=(P.ratio+Math.max(P.detune,0.002)).toFixed(3)+' : 1   ·   '+P.length+' turns'+note}function fit(){const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;DPR=Math.min(window.devicePixelRatio||1,2.5);W=Math.round(r.width);H=Math.round(r.height);[cv,nv].forEach(c=>{c.width=W*DPR;c.height=H*DPR});cx.setTransform(DPR,0,0,DPR,0,0);nx.setTransform(DPR,0,0,DPR,0,0);const was=drawn;compute();clearPlate();if(was>1)paint(Math.min(was,N))}const CONTROLS=[{g:'Figure'},{k:'ratio',n:'Ratio',min:0.25,max:4,step:0.001,fmt:v=>v.toFixed(3)+' : 1',hint:'Speed of the vertical pendulum against the horizontal. Whole numbers close the figure; the space between opens it.'},{k:'detune',n:'Detune',min:0,max:0.04,step:0.0002,fmt:v=>v.toFixed(4),hint:'How far out of tune the pair sits. Small values give the slow drift that lays the passes side by side.'},{k:'comp',n:'Companion',min:0.5,max:3.5,step:0.002,fmt:v=>v.toFixed(3),hint:'Speed of the second pendulum. Near 1 gives flowing ribbons; near 2 or 3 folds points and cusps into the middle.'},{k:'depth',n:'Depth',min:0.05,max:0.70,step:0.005,fmt:v=>v.toFixed(2),hint:'How much of the swing the companion contributes.'},{g:'Swing'},{k:'twist',n:'Twist',min:0,max:1.5707,step:0.005,fmt:v=>(v*57.2958).toFixed(0)+'°',hint:'Quarter turn between the axes. At 0° the pen swings flat; at 90° it swings in a circle.'},{k:'phase',n:'Phase',min:0,max:6.2831,step:0.01,fmt:v=>(v*57.2958).toFixed(0)+'°',hint:'Where the companion starts. Rolls the figure through its whole family of shapes.'},{k:'fadeTo',n:'Fade',min:0.02,max:0.85,step:0.005,fmt:v=>(v*100).toFixed(0)+'% left',hint:'Swing remaining when the pen lifts. Low spirals inward and dies; high holds its size.'},{k:'length',n:'Turns',min:30,max:240,step:2,fmt:v=>v.toFixed(0),hint:'How many passes the pen lays down. Watch the spacing readout at the top: the shimmer lives between about 1 and 4px apart.'},{g:'Table'},{k:'flat',n:'Flatten',min:0.2,max:1,step:0.005,fmt:v=>v.toFixed(2),hint:'Squashes the figure vertically, the way a plate seen edge-on flattens.'},{k:'tilt',n:'Tilt',min:-1,max:1,step:0.005,fmt:v=>v.toFixed(2),hint:'Leans the whole drawing.'},{g:'Pen'},{k:'speed',n:'Time to draw',min:0,max:1,step:0.005,fmt:()=>timeLabel(drawSeconds()),light:true,hint:'Five seconds at the left, ten minutes at the right. The slow end is the point.'},{k:'weight',n:'Nib weight',min:0,max:1,step:0.005,fmt:()=>lineW().toFixed(2)+'px',light:true,hint:'Hairline at the left. Fine lines are what make the moiré read.'},{k:'strength',n:'Ink strength',min:0.3,max:2.5,step:0.01,fmt:v=>v.toFixed(2)+'×',light:true,hint:'Darkness of each pass. Lower for dense figures, higher for sparse ones.'},{g:'Screensaver'},{k:'hold',n:'Hold each figure',min:2,max:90,step:1,fmt:v=>timeLabel(v),light:true,hint:'How long a finished figure stays up before it fades and a new one begins. Pen speed sets how long the drawing itself takes.'}];const panel=document.getElementById('panel'),refs={};CONTROLS.forEach(c=>{if(c.g){const g=document.createElement('div');g.className='group';g.innerHTML='<div class="glabel">'+c.g+'</div>';panel.appendChild(g);return}const w=document.createElement('div');w.className='ctl';w.innerHTML='<div class="crow"><label class="cname" for="s_'+c.k+'">'+c.n+'</label><span class="cval"></span></div><input type="range" id="s_'+c.k+'" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+P[c.k]+'">'+(c.hint?'<div class="chint">'+c.hint+'</div>':'');panel.appendChild(w);const s=w.querySelector('input'),v=w.querySelector('.cval');refs[c.k]={s,v,c};v.textContent=c.fmt(P[c.k]);s.addEventListener('input',()=>{P[c.k]=parseFloat(s.value);v.textContent=c.fmt(P[c.k]);if(c.k==='speed'||c.k==='hold')return;if(c.light)repaint();else ghost()});s.addEventListener('change',()=>{if(!c.light)startDraw()})});const gInk=document.createElement('div');gInk.className='group';gInk.innerHTML='<div class="glabel">Ink</div><div class="swatches"></div>';panel.appendChild(gInk);INKS.forEach((ink,i)=>{const b=document.createElement('button');b.className='sw';b.title=ink.name;b.setAttribute('aria-label','Ink: '+ink.name);b.setAttribute('aria-pressed',String(i===P.inkIdx));b.style.background=ink.pairP?'linear-gradient(135deg,'+ink.paper+','+ink.pairP+')':ink.paper;b.onclick=()=>{P.inkIdx=i;gInk.querySelectorAll('.sw').forEach((e,j)=>e.setAttribute('aria-pressed',String(j===i)));repaint()};gInk.querySelector('.swatches').appendChild(b)});const gPl=document.createElement('div');gPl.className='group';gPl.innerHTML='<div class="glabel">Plate</div><div class="chips"></div>';panel.appendChild(gPl);PLATES.forEach((pl,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=pl.name;b.setAttribute('aria-pressed',String(i===P.plateIdx));b.onclick=()=>{P.plateIdx=i;gPl.querySelectorAll('.chip').forEach((e,j)=>e.setAttribute('aria-pressed',String(j===i)));repaint()};gPl.querySelector('.chips').appendChild(b)});const saverBtn=document.createElement('button');saverBtn.id='saverBtn';saverBtn.textContent='Start screensaver';saverBtn.onclick=()=>enterSaver();panel.appendChild(saverBtn);function syncAll(){Object.keys(refs).forEach(k=>{refs[k].s.value=P[k];refs[k].v.textContent=refs[k].c.fmt(P[k])});tagline()}document.getElementById('btnDraw').onclick=()=>{if(running)pauseDraw();else if(drawn>1&&drawn<N)resumeDraw();else startDraw()};document.getElementById('btnSheet').onclick=newSheet;function randomise(){const R=(a,b)=>a+Math.random()*(b-a),nice=[1,1.25,1.5,2,2.5,3];P.ratio=nice[(Math.random()*nice.length)|0]+R(-0.02,0.02);P.detune=R(0.003,0.018);P.comp=Math.random()<0.65?R(0.988,1.016):R(1.9,3.1);P.depth=R(0.15,0.55);P.twist=Math.random()<0.4?1.5707:R(0,1.5707);P.phase=R(0,6.2831);P.fadeTo=R(0.08,0.6);P.length=Math.round(R(90,180)/P.ratio/2)*2;P.flat=R(0.35,1);P.tilt=R(-0.5,0.5)}document.getElementById('btnShuffle').onclick=()=>{randomise();syncAll();startDraw()};let saver=false,saverTimer=null,wakeLock=null;const holdMs=()=>P.hold*1000;async function grabWakeLock(){try{if('wakeLock'in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}function dropWakeLock(){try{if(wakeLock)wakeLock.release()}catch(e){}wakeLock=null}document.addEventListener('visibilitychange',()=>{if(saver&&document.visibilityState==='visible')grabWakeLock()});function saverNext(){if(!saver)return;randomise();P.inkIdx=(Math.random()*5)|0;syncAll();startDraw()}function saverFade(){if(!saver)return;const bg=PLATES[P.plateIdx].bg;let f=0;const step=()=>{if(!saver)return;f++;cx.globalAlpha=0.022;cx.fillStyle=bg;cx.fillRect(0,0,W,H);cx.globalAlpha=1;if(f<130)requestAnimationFrame(step);else{clearPlate();saverNext()}};requestAnimationFrame(step)}function enterSaver(){if(saver)return;saver=true;drawer.classList.add('shut');document.body.classList.add('saver');grabWakeLock();try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()}catch(e){}const hint=document.getElementById('saverHint');hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),3200);setTimeout(()=>{fit();saverNext()},120);setTimeout(()=>{window.addEventListener('pointerdown',exitSaver);window.addEventListener('keydown',exitSaver)},700)}function exitSaver(){if(!saver)return;saver=false;clearTimeout(saverTimer);window.removeEventListener('point
