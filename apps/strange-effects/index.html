<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Strange Effects</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;600&display=swap">
<style>
/* Layout: the picture is the whole window. A slim tabbed strip opens only when asked. */
:root{--ground:#0e1019;--plate:#191c2c;--line:#363a56;--bone:#e9e6dc;--dim:#a3a4b8;--mono:"Martian Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--ground);color:var(--bone);font:400 .72rem/1.3 var(--mono);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top,#zm{position:fixed;display:flex;gap:6px;transition:opacity .6s;right:calc(10px + env(safe-area-inset-right,0px))}
#top{top:calc(10px + env(safe-area-inset-top,0px))}
#zm{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
body.idle #top,body.idle #zm{opacity:.28}
body.idle{cursor:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:46%;overflow-y:auto;overscroll-behavior:contain;background:var(--ground);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding:12px max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
@media (min-width:760px){#sheet{left:auto;top:0;bottom:0;width:360px;max-height:none;border-top:0;border-left:1px solid var(--line);padding-top:calc(14px + env(safe-area-inset-top,0px))}}
.ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pn{display:flex;flex-direction:column;gap:7px}
.lab{font-size:.62rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.head{display:flex;justify-content:flex-end}
.nm{font-size:.66rem;color:var(--dim);min-width:100%}
.pgrp{display:flex;align-items:center;gap:3px}
.pl{min-width:1.1em;padding:0 3px;text-align:center}
button{font:400 .72rem/1.15 var(--mono);color:var(--bone);background:var(--plate);border:1px solid var(--line);border-radius:3px;padding:9px 10px;min-height:40px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button[aria-pressed="true"]{background:var(--bone);color:var(--ground);border-color:var(--bone)}
button:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.st{min-width:40px}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.routes button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;min-width:0}
.ctl textarea,.ctl input{font:400 .72rem/1.3 var(--mono);color:var(--bone);background:var(--plate);border:1px solid var(--line);border-radius:3px;padding:8px;width:100%;box-sizing:border-box}
.routes em{font-style:normal;font-size:.64rem;color:var(--dim)}
