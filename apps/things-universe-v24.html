<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071018">
<title>Things Universe v24</title>
<link rel="stylesheet" href="things-universe-v20.css?v=20260817a">
<style>
.selectbar{position:absolute;left:6px;right:6px;bottom:38px;z-index:18;display:none;align-items:center;gap:5px;padding:5px;background:#0b1624ee;border:1px solid #334862;border-radius:12px;box-shadow:0 6px 24px #0007}.selectbar.showbar{display:flex}.selectbar .btn{height:28px;font-size:9px}.selectbar .btn:disabled{opacity:.38}.seltext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;color:#dce7f7}.selmarks{position:absolute;inset:0;z-index:9;pointer-events:none;overflow:hidden}.selmark{position:absolute;left:0;top:0;width:26px;height:26px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;background:#071018aa;color:#fff;font:900 10px ui-monospace,SFMono-Regular,Menlo,monospace;box-shadow:0 0 0 2px #07101888,0 0 16px #fff6;will-change:transform}.src{color:#8192aa;font-size:10px}.reader .box strong{color:#f1f5ff}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="row"><div class="brand"><b>Things Universe</b><span class="ver">v24</span></div><button class="btn" id="fit">Fit</button><button class="btn" id="reset">Reset</button></div>
  <div class="search"><input id="q" autocomplete="off" placeholder="Type the first idea"><button class="btn" id="add">Add thing</button></div>
  <div class="tools"><button class="btn" id="auto">Auto-grow: off</button><button class="btn" id="connect">Connect mode</button><button class="btn" id="bridge">Find bridge</button></div>
</header>
<main class="stage" id="stage">
  <canvas id="canvas" aria-label="floating concept universe"></canvas>
  <div class="selmarks" id="selmarks"></div>
  <div class="empty" id="empty"><div><b>Give me some ideas.</b>Add as many starting ideas as you like. Turn on Connect mode, then tap 2–4 nodes to examine how they are conceptually connected.</div></div>
  <div class="bar"><div class="pill pair" id="pair">No starting ideas</div><div class="pill stat" id="status">Ready</div></div>
  <div class="zoomBtns"><button class="btn" id="zm">−</button><button class="btn" id="zp">+</button></div>
  <div class="selectbar" id="selectbar"><div class="seltext" id="seltext">Tap 2–4 nodes</div><button class="btn" id="selExplain" disabled>Explain selected</button><button class="btn" id="selClear">Clear</button></div>
  <div class="hud"><div class="pill" id="count">0 nodes</div><div class="pill" id="bc">0 shared</div><div class="pill" id="zoomPct">100%</div></div>
  <div class="hint" id="hint">Drag a node to move it</div>
  <div class="think" id="think">Thinking…</div><div class="toast" id="toast"></div>
  <div class="reader" id="reader"><div class="rh"><strong>Connection examination</strong><button class="btn" id="rx">Close</button></div><div class="rb" id="rb"></div></div>
</main>
</div>
<script src="things-universe-v16-data.js?v=20260817a"></script>
<script src="things-universe-v23-state.js?v=20260817a"></script>
<script src="things-universe-v22-sources.js?v=20260903c"></script>
<script src="things-universe-v20-core.js?v=20260817a"></script>
<script src="things-universe-v21-growth.js?v=20260817a"></script>
<script src="things-universe-v24-progressive.js?v=20260903c"></script>
<script src="things-universe-v24-selection.js?v=20260817a"></script>
<script src="things-universe-v24-family.js?v=20260903i"></script>
<script src="things-universe-v24-surname-compat.js?v=20260903a"></script>
<script src="things-universe-v24-controls.js?v=20260817a"></script>
<script src="things-universe-v24-gestures.js?v=20260817a"></script>
<script src="things-universe-v24-init.js?v=20260817a"></script>
</body>
</html>
