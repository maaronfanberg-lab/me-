<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1B1E24"><title>Harmonograph · Alex + Sarah Lab</title><style>html,body{margin:0;background:#1B1E24;color:#D8D4CA;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.load{height:100vh;display:grid;place-items:center}</style></head><body><div class="load">Loading Harmonograph…</div><script>
(async()=>{
 try{
  const r=await fetch('harmonograph.html?v=20261026-restore',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  let h=await r.text();
  h=h.replace("input[type=range]{-webkit-appearance:none;","input[type=range]{touch-action:pan-y;-webkit-appearance:none;");
  const old="s.addEventListener('input',()=>{P[c.k]=parseFloat(s.value);v.textContent=c.fmt(P[c.k]);if(c.k==='speed'||c.k==='hold')return;if(c.light)repaint();else ghost()});";
  const neu="s.addEventListener('input',()=>{P[c.k]=parseFloat(s.value);v.textContent=c.fmt(P[c.k]);if(c.k==='speed'||c.k==='hold')return;clearTimeout(s._previewTimer);s._previewTimer=setTimeout(()=>{if(c.light)repaint();else ghost()},45)});";
  if(!h.includes(old)) throw new Error('compatibility patch target not found');
  h=h.replace(old,neu);
  document.open(); document.write(h); document.close();
 }catch(e){document.body.innerHTML='<div class="load">Harmonograph could not load: '+String(e.message||e)+'</div>';}
})();
</script></body></html>
