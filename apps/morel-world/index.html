<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Morel World</title>
<style>
:root{--bg:#120d09;--ink:#efe2cc;--dim:#a8957a;--ridge:#e7c98f;--pit:#5b3d24;--hot:#ffd27a;--chip:#2a1f16;--chipOn:#d8a85b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
header{padding:14px 16px 4px;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px}h1{white-space:nowrap}
h1{font-size:20px;margin:0;letter-spacing:.02em}header span{color:var(--dim);font-size:13px}
#cv{display:block;width:100%;height:56vh;max-height:560px;touch-action:pan-y}
#strip{padding:2px 16px 8px;color:var(--dim);font-size:13px;min-height:2.6em}
.row{display:flex;gap:10px;padding:0 16px 10px}
button.big{flex:1;padding:14px;border:0;border-radius:14px;font-size:17px;font-weight:600;background:var(--chipOn);color:#1b120a}
button.big.alt{background:#3a2a1c;color:var(--ink)}
.ctl{padding:4px 16px 8px}.ctl b{display:block;font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:0;border-radius:999px;padding:8px 13px;background:var(--chip);color:var(--ink);font-size:14px}
.chips button.on{background:var(--chipOn);color:#1b120a;font-weight:600}
details{margin:8px 16px 28px;background:#1c140e;border-radius:14px;padding:4px 14px}
summary{padding:10px 0;font-weight:600;cursor:pointer}
details li{margin:6px 0;color:#dccdb5}details li em{color:var(--hot);font-style:normal}
#ver{display:block;color:var(--dim);font-size:12px;margin:8px 0 12px}
</style></head><body>
<header><h1>Morel World</h1><span>a dried morel, struck by its own attractor</span></header>
<canvas id="cv"></canvas>
<div id="strip">Tap Start. The Morel attractor swings a poplar stick against the inside wall.</div>
<div class="row"><button class="big" id="go">Start</button><button class="big alt" id="hit">Big strike</button></div>
<div class="ctl"><b>Size</b><div class="chips" data-k="size"></div></div>
<div class="ctl"><b>Stick (poplar)</b><div class="chips" data-k="stick"></div></div>
<div class="ctl"><b>Dryness</b><div class="chips" data-k="dry"></div></div>
<div class="ctl"><b>Listen from</b><div class="chips" data-k="listen"></div></div>
<div class="ctl"><b>Pace</b><div class="chips" data-k="pace"></div></div>
<div class="ctl"><b>Volume</b><div class="chips" data-k="vol"></div></div>
<details><summary>What you're hearing</summary><ul id="why"></ul><span id="ver">Version 12 Nov · stage 1</span></details>
<script src="phys.js"></script><script src="engine.js"></script>
<script>
const PH=PHYS(),TAU=Math.PI*2;
const S={size:2,stick:1,dry:1,listen:0,pace:0,vol:1};const VOL=[{n:'Whisper',g:.3},{n:'Soft',g:.55},{n:'Medium',g:.85},{n:'Loud',g:1.25}];
const OPT={size:PH.SIZES.map(z=>z.n+(z.H<1?' 10 cm':' '+z.H+' m')),stick:PH.STICKS.map(k=>k.n),dry:PH.DRY.map(d=>d.n),listen:PH.LISTEN,pace:PH.PACE.map(p=>p.n),vol:VOL.map(v=>v.n)};
let info=null;
// ---------- explanations, with this world's own numbers
function explain(){const W=PH.build(S,48000),r=x=>x>=100?Math.round(x):x>=10?+x.toFixed(1):+x.toFixed(2);
 const c=[0,1,2,3].map(k=>W.md.filter(q=>q.k===k).length),lis=PH.LISTEN[S.listen];
 const L=[
 `<em>Shape:</em> the wall is the MGS-1 profile F(s) with the Ω twist and the hex pits P — the same functions the attractor uses. This one is <em>${W.H<1?'10 cm':W.H+' m'}</em> tall, widest radius <em>${r(W.Rx)} m</em>, wall <em>${r(W.h*100)} cm</em> thick.`,
 `<em>Body boom</em> (${c[0]} shell modes, Donnell cylinder equivalent): lowest <em>${r(W.low)} Hz</em>, ring frequency <em>${r(W.ring)} Hz</em>. Where modes crowd tighter than the ear can separate (one critical band, ERB), a few stand in for the rest with the same total energy.`,
 `<em>Shimmer:</em> the 12-around hex lattice makes the wall slightly thicker on ridges, which splits paired modes with 12 and 24 waves around — they beat slowly instead of ringing as one.`,
 `<em>Pit pings</em> (${c[1]} from 168 cells, each a small clamped plate): <em>${c[1]?r(W.panelLo)+'–'+r(W.panelHi)+' Hz':'above hearing at this size'}</em>. Hitting a pit floor rings that pit; hitting a ridge is stiffer, so the contact is shorter and brighter.`,
 `<em>Inside air</em> (${c[2]} cavity modes, Webster horn along the hollow): first <em>${r(W.cav1)} Hz</em>. Reverb time <em>${r(W.RT)} s</em> (Sabine, dried wall absorbing ${Math.round(W.D.al*100)}%), shorter up high from air absorption. Above <em>${r(W.fS)} Hz</em> (Schroeder) the modes blur into a diffuse wash.`,
 `<em>Stick:</em> poplar (USDA: specific gravity 0.40, stiffness 9.4 GPa), <em>${r(W.sm)} kg</em>, rings at <em>${r(W.stick1)} Hz</em> and up (free–free beam). Contact lasts <em>${r(W.T0*1e3)} ms</em> — shorter contact puts energy higher, up to about ${r(1/W.T0)} Hz.`,
 `<em>Dried tissue:</em> ${W.D.cr?`after each hit the brittle wall keeps cracking — little fractures that thin out over time (Omori's law) with many small and few big ones (power law)`:'fresh tissue is soft and damp: no cracking, more damping'}.`,
 `<em>Walls barely push air below ${r(W.fc)} Hz</em> (coincidence frequency), so from outside the lows are muted; inside, the air itself rings.`,
 `<em>Where it is:</em> listening <em>${lis.toLowerCase()}</em> with two spaced ears. Each click reaches the nearer ear first (time and level difference), and the first arrival sets where you hear it (precedence). Sound arrives after the flash: the air takes ${r(1000/343)} ms per metre.`,
 `<em>Rhythm:</em> each hit waits as long as the stick takes to swing the attractor's next jump, so the map's own leaps set the timing. Loudness follows Stevens' law, so big swings sound bigger without drowning the room.`,
 `<em>Never silent:</em> between hits you hear the seashell effect — ambient air ringing the morel's ${S.listen?'walls (wind)':'hollow'}, kept around −42 dB.`];
 document.getElementById('why').innerHTML=L.map(x=>'<li>'+x+'</li>').join('');}
// ---------- controls
document.querySelectorAll('.chips').forEach(el=>{const k=el.dataset.k;OPT[k].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{S[k]=i;paint();
 if(k==='vol'){if(au.g)au.g.gain.setTargetAtTime(VOL[i].g,au.ctx.currentTime,.05);}else{send({cfg:{size:S.size,stick:S.stick,dry:S.dry,listen:S.listen,pace:S.pace}});explain();buildSurf();}};el.appendChild(b);});});
function paint(){document.querySelectorAll('.chips').forEach(el=>{const k=el.dataset.k;[...el.children].forEach((b,i)=>b.classList.toggle('on',S[k]===i));});}
// ---------- audio
const au={ctx:null,node:null,g:null,on:false};
function send(m){if(au.node)au.node.port.postMessage(m);}
async function start(){if(!au.ctx){au.ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'playback'});
  const src=PHYS.toString()+'\n'+ENGINE.toString()+`
const PH=PHYS(),Eng=ENGINE(PH);
class P extends AudioWorkletProcessor{constructor(){super();this.e=new Eng(sampleRate);this.port.onmessage=m=>{const d=m.data;if(d.cfg)this.e.setCfg(d.cfg);if(d.big)this.e.bigHit();};}
 process(i,o){const L=o[0][0],R=o[0][1]||o[0][0];this.e.process(L,R,L.length);if(this.e.events.length){this.port.postMessage({ev:this.e.events});this.e.events=[];}return true;}}
registerProcessor('morel-world',P);`;
  await au.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  au.node=new AudioWorkletNode(au.ctx,'morel-world',{numberOfInputs:0,outputChannelCount:[2]});au.g=au.ctx.createGain();au.g.gain.value=VOL[S.vol].g;
  au.node.connect(au.g).connect(au.ctx.destination);au.node.port.onmessage=m=>{for(const e of m.data.ev)strike(e);};
  send({cfg:{size:S.size,stick:S.stick,dry:S.dry,listen:S.listen,pace:S.pace}});}
 await au.ctx.resume();au.on=true;go.textContent='Stop';}
const go=document.getElementById('go');go.onclick=async()=>{if(au.on){await au.ctx.suspend();au.on=false;go.textContent='Start';}else start();};
document.getElementById('hit').onclick=async()=>{if(!au.on)await start();send({big:1});};
// ---------- picture: the wall (ridges light, pits dark), the attractor's point cloud inside, flashes where the stick lands
const cv=document.getElementById('cv'),cx=cv.getContext('2d');let surf=[],cloud=new Float32Array(3*2400),cn=0,cq=[.2137,1,.5],flashes=[],rot=0,last=performance.now();
function buildSurf(){surf=[];for(let a=0;a<60;a++){const s=(a+.5)/60;for(let b=0;b<96;b++){const th=TAU*(b+.5*(a%2))/96,p=PH.P(th,s),r=PH.PM[0]*PH.F(s)*(1+PH.Om(th,s))*(1-PH.PM[2]*p);surf.push(s,th,r,p);}}}
function strike(e){flashes.push({s:e.s,th:e.th,r:PH.PM[0]*PH.F(e.s)*(1+PH.Om(e.th,e.s))*(1-PH.PM[2]*PH.P(e.th,e.s)),t:performance.now(),k:e.strength,big:e.big});
 const r=x=>x>=10?Math.round(x):+x.toFixed(1);
 document.getElementById('strip').textContent=`${e.big?'Big strike':'Strike'} on a ${e.ridge>.5?'ridge':'pit floor'} · ${Math.round(e.s*100)}% up · contact ${r(e.T*1000)} ms · heard ${r(e.dly*1000)} ms after it lands`;}
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;rot+=dt*.12;
 const w=cv.clientWidth,h=cv.clientHeight,dpr=Math.min(2,devicePixelRatio||1);if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr;}
 cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle='#120d09';cx.fillRect(0,0,w,h);
 const sc=Math.min(w/7.4,h/7.2),X0=w/2,Y0=h/2+3.1*sc,ca=Math.cos(rot),sa=Math.sin(rot);
 const P3=(x,y,z)=>{const xr=x*ca-z*sa,zr=x*sa+z*ca;return[X0+xr*sc,Y0-y*sc,zr];};
 // back of the wall, cloud, front of the wall
 const draw=(front)=>{for(let i=0;i<surf.length;i+=4){const s=surf[i],th=surf[i+1],r=surf[i+2],p=surf[i+3],q=P3(r*Math.cos(th),PH.PM[1]*s,r*Math.sin(th));
   if((q[2]<0)!==front)continue;const L=front?1:.35,c=p>.5?[91,61,36]:[231,201,143],k=(front?.55+.45*(1-p):.5)*L;cx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${k})`;cx.fillRect(q[0]-1.1,q[1]-1.1,2.2,2.2);}};
 draw(false);
 for(let k=0;k<10;k++){cq=PH.M(cq[0],cq[1],cq[2]);cloud[3*cn]=cq[2]*Math.cos(cq[1]);cloud[3*cn+1]=PH.PM[1]*cq[0];cloud[3*cn+2]=cq[2]*Math.sin(cq[1]);cn=(cn+1)%2400;}
 cx.fillStyle='rgba(255,170,90,.55)';for(let i=0;i<2400;i++){const q=P3(cloud[3*i]*.96,cloud[3*i+1],cloud[3*i+2]*.96);cx.fillRect(q[0]-.7,q[1]-.7,1.4,1.4);}
 draw(true);
 flashes=flashes.filter(f=>now-f.t<1400);for(const f of flashes){const a=(now-f.t)/1400,q=P3(f.r*Math.cos(f.th),PH.PM[1]*f.s,f.r*Math.sin(f.th));
  cx.strokeStyle=`rgba(255,226,150,${(1-a)*(q[2]<0?.9:.4)})`;cx.lineWidth=f.big?3:1.6;cx.beginPath();cx.arc(q[0],q[1],(4+a*(f.big?60:28)*Math.sqrt(f.k)),0,TAU);cx.stroke();
  if(a<.15){cx.fillStyle=`rgba(255,240,200,${1-a/.15})`;cx.beginPath();cx.arc(q[0],q[1],f.big?7:4,0,TAU);cx.fill();}}
 requestAnimationFrame(frame);}
paint();explain();buildSurf();requestAnimationFrame(frame);
</script></body></html>
