name: Room conversational floor tests

on:
  pull_request:
    paths:
      - 'scripts/room_conversational_floor.py'
      - 'scripts/room_hidden_world.py'
      - 'scripts/test_room_hidden_world.py'
      - 'scripts/test_room_followup_scene.py'
      - 'scripts/room_world_actions.py'
      - 'scripts/test_room_world_actions.py'
      - 'scripts/test_room_public_scene_ledger.py'
      - 'scripts/test_room_capacity_guard.py'
      - 'scripts/room_conversation_project.py'
      - 'scripts/room_chat_speech.py'
      - 'scripts/test_room_chat_speech_adapter.py'
      - 'scripts/test_room_native_chat_quality.py'
      - 'scripts/room_chat_speech.py'
      - 'scripts/test_room_native3b_selection.py'
      - 'scripts/room_research_architecture.py'
      - 'scripts/test_room_process_label_hygiene.py'
      - 'scripts/room_sequence_uptake.py'
      - 'scripts/room_action_ledger.py'
      - 'scripts/test_room_action_ledger.py'
      - 'scripts/test_room_sequence_uptake.py'
      - 'scripts/test_room_long_action_gate.py'
      - 'scripts/room_group_dynamics.py'
      - 'scripts/test_room_memory_relevance.py'
      - 'scripts/test_room_conversation_project.py'
      - 'scripts/room_participant.py'
      - 'scripts/test_room_allen_source_provenance.py'
      - 'scripts/room_private_commit.py'
      - '.github/workflows/sarah-society.yml'
      - 'scripts/room_conversational_candidate.py'
      - 'scripts/test_room_conversational_workflow.py'
      - 'scripts/test_room_conversational_wrapper_intent.py'
      - 'scripts/room_engine_v5_legacy.py'
      - 'scripts/test_room_conversational_floor.py'
      - 'scripts/test_room_conversational_pipeline.py'
      - 'scripts/room_engine_v5_core.py'
      - 'scripts/room_engine_v5.py'
      - 'scripts/test_room_transcript_preservation.py'
      - 'scripts/test_room_character_initiative.py'
      - 'scripts/room_private_model_autonomy_legacy.py'
      - 'scripts/test_room_self_voice_retry.py'
      - 'scripts/room_private_commit.py'
      - 'scripts/room_expression_quality_legacy.py'
      - 'scripts/room_private_model.py'
      - 'scripts/room_private_model_autonomy_legacy.py'
      - '.github/workflows/sarah-society.yml'
      - '.github/workflows/room-conversation-floor-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Witnessed environmental action consequence without fabricated speech
        run: python3 scripts/test_room_world_actions.py
      - name: Verify source-linked conversational common-ground ledger
        run: python3 scripts/test_room_public_scene_ledger.py
      - name: Verify optional private observations do not leak
        run: python3 scripts/test_room_hidden_world.py
      - name: Verify bounded shared-world trial, sustained evidence and user priority
        run: python3 scripts/test_room_followup_scene.py
      - name: Guard capacity and no model inference pileup
        run: python3 scripts/test_room_capacity_guard.py
      - name: Compile real conversational opportunity path
        run: python3 -m py_compile scripts/room_conversational_floor.py scripts/room_conversation_project.py scripts/room_action_ledger.py scripts/room_conversational_candidate.py scripts/room_engine_v5.py scripts/room_engine_v5_core.py scripts/room_private_commit.py scripts/room_private_model_autonomy_legacy.py scripts/room_expression_quality_legacy.py scripts/test_room_conversational_pipeline.py
      - name: Verify conversational question, response, and repair sequence
        run: python3 scripts/test_room_sequence_uptake.py
      - name: Verify full-turn action gate on live echo regression
        run: python3 scripts/test_room_long_action_gate.py
      - name: Verify native 3B model identity, failback and Allen integrity
        run: |
          python3 scripts/test_room_native3b_selection.py
          python3 scripts/test_room_chat_speech_adapter.py
      - name: Verify bounded generation retry of malformed self perspective
        run: python3 scripts/test_room_self_voice_retry.py
      - name: Verify public source-linked action ledger
        run: python3 scripts/test_room_action_ledger.py
      - name: Verify source-linked response and personal initiative
        run: python3 scripts/test_room_conversation_project.py
      - name: Validate native chat adapter with real publication preflight
        run: python3 scripts/test_room_chat_speech_adapter.py
      - name: Test bounded native-chat sentence acceptance without changing legacy limits
        run: python3 scripts/test_room_native_chat_quality.py
      - name: Verify exact control-label speech quarantine and memory provenance
        run: python3 scripts/test_room_process_label_hygiene.py
      - name: Verify Allen's words survive without invented historical topics
        run: python3 scripts/test_room_allen_source_provenance.py
      - name: Preserve character intent through model wrappers
        run: python3 scripts/test_room_conversational_wrapper_intent.py
      - name: Verify personal motives and conversational response obligations
        run: python3 scripts/test_room_character_initiative.py
      - name: Verify public questions survive model-context preparation
        run: python3 scripts/test_room_transcript_preservation.py
      - name: Validate both real workflow shell routes
        run: python3 scripts/test_room_conversational_workflow.py
      - name: Test directed responses, sleeping participants, voluntary readiness
        run: python3 scripts/test_room_conversational_floor.py
      - name: Test actual selected-expression commit in sandbox
        run: python3 scripts/test_room_conversational_pipeline.py
      - name: Existing sleeping participant regression
        run: python3 scripts/test_room_sleeping_entity.py
      - name: Existing group and personal-history regression
        run: python3 scripts/test_room_group_dynamics.py
      - name: Verify recalled source relevance and preserved partner history
        run: python3 scripts/test_room_memory_relevance.py
