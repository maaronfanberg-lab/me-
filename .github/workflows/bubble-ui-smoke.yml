name: Bubble Lab Browser Smoke

on:
  push:
    branches: [main]
    paths:
      - 'bubble-go/**'
      - '.github/workflows/bubble-ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bubble-lab-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser harness
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install chromium
      - name: Serve Bubble Lab
        run: |
          python3 -m http.server 8000 --directory bubble-go >/tmp/bubble-http.log 2>&1 &
          echo $! > /tmp/bubble-http.pid
      - name: Load engine and require a single-bubble trajectory
        run: |
          cat > /tmp/bubble-smoke.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1170, height: 900 } });
            page.on('console', m => console.log('browser:', m.type(), m.text()));
            page.on('pageerror', e => console.error('pageerror:', e.message));
            await page.goto('http://127.0.0.1:8000', { waitUntil: 'domcontentloaded' });

            await page.waitForFunction(() => {
              const s = document.querySelector('#status')?.textContent || '';
              return ['ready','solving','complete','collapsed','error'].includes(s.toLowerCase());
            }, null, { timeout: 240000 });

            if ((await page.locator('#status').textContent()).toLowerCase() === 'error') {
              throw new Error('Engine failed: ' + await page.locator('#errorBox').textContent());
            }

            await page.waitForFunction(() => {
              const s = (document.querySelector('#status')?.textContent || '').toLowerCase();
              return s === 'complete' || s === 'collapsed' || s === 'error';
            }, null, { timeout: 240000 });

            if ((await page.locator('#status').textContent()).toLowerCase() === 'error') {
              throw new Error('Simulation failed: ' + await page.locator('#errorBox').textContent());
            }

            const result = {
              status: await page.locator('#status').textContent(),
              points: await page.locator('#count').textContent(),
              minRadius: await page.locator('#minR').textContent(),
              maxRadius: await page.locator('#maxR').textContent(),
              mach: await page.locator('#mach').textContent(),
              solver: await page.locator('#solver').textContent(),
              runButton: await page.locator('#go').textContent(),
            };
            console.log(JSON.stringify(result, null, 2));
            if (!/trajectory points:\s*[1-9]/i.test(result.points)) throw new Error('No trajectory was rendered');
            if (!result.minRadius.includes('µm') || !result.maxRadius.includes('µm')) throw new Error('Radius diagnostics missing');

            await page.locator('[data-mode="resonance"]').click();
            await page.waitForTimeout(100);
            if (!(await page.locator('[data-mode="resonance"]').evaluate(el => el.classList.contains('active')))) throw new Error('Mode tiles are not interactive');

            await page.screenshot({ path: 'bubble-lab-smoke.png', fullPage: true });
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          JS
          node /tmp/bubble-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bubble-lab-browser-smoke-${{ github.run_id }}
          path: bubble-lab-smoke.png
          if-no-files-found: ignore
          retention-days: 14
