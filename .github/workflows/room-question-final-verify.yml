name: Full question-routing verification

on:
  push:
    branches:
      - 'fix/entity-question-answering-20260820'
    paths:
      - '.github/workflows/room-question-final-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Run full Room architecture and question regressions
        shell: bash
        run: |
          set +e
          {
            python3 -m py_compile scripts/room_engine_v5.py scripts/room_social_v5.py scripts/room_private_model.py scripts/room_personality_v2.py scripts/room_participant.py scripts/room_allen_observation_sim.py scripts/room_allen_two_voice_sim.py scripts/room_personality_v2_sim.py scripts/room_model_boundary_sim.py scripts/room_prompt_boundary_sim.py scripts/room_expression_quality.py scripts/room_expression_quality_sim.py scripts/room_cross_voice_novelty_sim.py scripts/room_retry_truncation_sim.py scripts/room_incomplete_tail_live_sim.py scripts/room_ai_adjacency_sim.py scripts/room_semantic_epoch.py scripts/room_semantic_epoch_sim.py scripts/room_semantic_recovery_workflow_sim.py scripts/room_supervisor.py scripts/room_supervisor_sim.py scripts/room_topic_bounded.py scripts/room_topic_state_sim.py &&
            python3 scripts/room_engine_v5.py selftest &&
            python3 scripts/room_allen_response_sim.py &&
            python3 scripts/room_allen_observation_sim.py &&
            python3 scripts/room_allen_two_voice_sim.py &&
            python3 scripts/room_personality_v2_sim.py &&
            python3 scripts/room_model_boundary_sim.py &&
            python3 scripts/room_prompt_boundary_sim.py &&
            python3 scripts/room_expression_quality_sim.py &&
            python3 scripts/room_cross_voice_novelty_sim.py &&
            python3 scripts/room_retry_truncation_sim.py &&
            python3 scripts/room_incomplete_tail_live_sim.py &&
            python3 scripts/room_ai_adjacency_sim.py &&
            python3 scripts/room_semantic_epoch_sim.py &&
            python3 scripts/room_semantic_recovery_workflow_sim.py &&
            python3 scripts/room_supervisor_sim.py &&
            python3 scripts/room_topic_state_sim.py &&
            python3 scripts/room_question_answering_sim.py
          } > /tmp/full-question-verify.txt 2>&1
          status=$?
          set -e
          python3 - "$status" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          path='room/allen-social-sim-diagnostic.json'
          try:
              data=json.load(open(path))
          except Exception:
              data={}
          status=int(sys.argv[1])
          try:
              output=open('/tmp/full-question-verify.txt').read()[-12000:]
          except Exception:
              output=''
          data['question_full_architecture_checked_at']=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          data['question_full_architecture_exit_code']=status
          data['question_full_architecture_pass']=status==0
          data['question_full_architecture_output']=output
          data['question_full_architecture_tested_sha']='${{ github.sha }}'
          open(path,'w').write(json.dumps(data,indent=2)+'\n')
          print(output)
          raise SystemExit(status)
          PY
      - name: Record verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'question-final-verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add room/allen-social-sim-diagnostic.json
          git commit -m 'Record full question-routing verification' || exit 0
          branch="${GITHUB_REF_NAME}"
          for n in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
