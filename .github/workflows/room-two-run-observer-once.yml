name: Room two-run observer once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-two-run-observer-once.yml'

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record exact workflow states
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p room
          gh run list --repo "$GITHUB_REPOSITORY" --workflow room-bridge-pending-precedence-once.yml --limit 3 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,displayTitle > /tmp/bridge.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow room-reason-aware-retry-main-once.yml --limit 3 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,displayTitle > /tmp/retry.json
          python3 - <<'PY'
          import json
          out={'bridge_precedence':json.load(open('/tmp/bridge.json')),'reason_aware_retry':json.load(open('/tmp/retry.json'))}
          open('room/two-run-observer.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          git config user.name room-run-observer
          git config user.email actions@users.noreply.github.com
          git add room/two-run-observer.json
          git rm .github/workflows/room-two-run-observer-once.yml
          git commit -m 'Record competing Room repair states'
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
