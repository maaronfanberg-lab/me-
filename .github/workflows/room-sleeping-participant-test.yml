name: Room presence and group dynamics tests

on:
  pull_request:
    paths:
      - 'room/config.json'
      - 'scripts/room_engine_v5.py'
      - 'scripts/room_private_commit.py'
      - 'scripts/build_room_feed.py'
      - 'scripts/test_room_sleeping_entity.py'
      - 'scripts/room_group_dynamics.py'
      - 'scripts/room_interaction_sequence.py'
      - 'scripts/room_beat_protocol.py'
      - 'scripts/test_room_beat_protocol.py'
      - 'scripts/room_delivery_protocol.py'
      - 'scripts/test_room_delivery_protocol.py'
      - 'scripts/room_experiment_guard.py'
      - 'scripts/test_room_experiment_guard.py'
      - 'scripts/room_offline_replay.py'
      - 'scripts/test_room_offline_replay.py'
      - 'scripts/test_room_interaction_sequence.py'
      - 'scripts/room_private_model_autonomy.py'
      - 'scripts/room_private_model_autonomy/__init__.py'
      - 'scripts/test_room_group_dynamics.py'
      - '.github/workflows/room-sleeping-participant-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compile Room nap path
        run: python3 -m py_compile scripts/room_engine_v5.py scripts/room_private_commit.py scripts/build_room_feed.py scripts/test_room_sleeping_entity.py
      - name: Verify sleeping participant
        run: python3 scripts/test_room_sleeping_entity.py
      - name: Compile offline protocol modules
        run: python3 -m py_compile scripts/room_beat_protocol.py scripts/room_delivery_protocol.py scripts/room_experiment_guard.py scripts/test_room_beat_protocol.py scripts/test_room_delivery_protocol.py scripts/test_room_experiment_guard.py
      - name: Verify typed beat outcomes and watchdog safety
        run: python3 scripts/test_room_beat_protocol.py
      - name: Verify durable delivery and replay semantics
        run: python3 scripts/test_room_delivery_protocol.py
      - name: Verify experimental credential isolation
        run: python3 scripts/test_room_experiment_guard.py
      - name: Verify read-only corpus and observer-scope sampler
        run: python3 scripts/test_room_offline_replay.py
      - name: Verify conversation action sequences
        run: python3 scripts/test_room_interaction_sequence.py
      - name: Verify Jules return and group consequences
        run: python3 scripts/test_room_group_dynamics.py
