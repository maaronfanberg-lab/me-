name: Experimental Room social-memory tests

on:
  pull_request:
    paths:
      - 'scripts/room_social_memory.py'
      - 'scripts/test_room_social_memory.py'
      - '.github/workflows/room-social-memory-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witnessed-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify witnessed memory and relationship evidence
        run: python -m unittest discover -s scripts -p 'test_room_social_memory.py' -v
