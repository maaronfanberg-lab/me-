name: Room Step 1 memory attribution once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-step1-memory-attribution-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  step1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Stop hot Room runner and refresh exact main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 10 --json databaseId --jq '.[].databaseId'); do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY"
          done
          for n in $(seq 1 30); do
            count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 10 --json databaseId --jq 'length')
            [ "$count" -eq 0 ] && break
            sleep 2
          done
          count=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 10 --json databaseId --jq 'length')
          [ "$count" -eq 0 ] || { echo 'FAIL: hot Room runner did not stop'; exit 1; }
          git fetch origin main
          git rebase origin/main
          cp room/feed.json /tmp/feed-before-step1.json

      - name: Apply exact guarded Step 1 source changes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p=Path(path); t=p.read_text(); count=t.count(old)
              if count != expected:
                  raise SystemExit(f'FAIL: {path}: expected {expected} exact match(es), found {count}')
              p.write_text(t.replace(old,new,expected))
              print(f'PATCH {path}: {count} exact match(es)')

          core='scripts/room_engine_v5_core.py'
          anchor='''def load(path: Path, default):\n'''
          helper='''KNOWN_MEMORY_SPEAKERS = {"sarah", "mara", "owen", "jules", "allen", "sara"}\nATTRIBUTED_MEMORY_ENV = "ROOM_ATTRIBUTED_MEMORY"\n\n\ndef strict_memory_speaker(value):\n    speaker = str(value or "").strip().lower()\n    if speaker not in KNOWN_MEMORY_SPEAKERS:\n        raise RuntimeError(f"unknown Room speaker in memory: {value!r}")\n    return speaker\n\n\ndef prompt_memory(entity, mind, limit=12):\n    if entity not in ORDER:\n        raise RuntimeError(f"unknown Room entity for memory perspective: {entity!r}")\n    state = mind["entities"][entity]\n    rows = []\n    for item in state["room_memories"][-int(limit):]:\n        if not isinstance(item, dict):\n            raise RuntimeError(f"invalid Room memory row for {entity}: {item!r}")\n        for key in ("speaker", "text", "at"):\n            if key not in item:\n                raise RuntimeError(f"Room memory missing {key} for {entity}: {item!r}")\n        speaker = strict_memory_speaker(item["speaker"])\n        at = str(item["at"]).strip()\n        if not at:\n            raise RuntimeError(f"Room memory has empty timestamp for {entity}: {item!r}")\n        rows.append({\n            "speaker": speaker,\n            "relation": "self" if speaker == entity else "other",\n            "text": str(item["text"])[:300],\n            "at": at,\n        })\n    return rows\n\n\n'''+anchor
          replace_exact(core, anchor, helper)
          replace_exact(core,
'''    mind = minds()\n    current_state = state()\n''',
'''    mind = minds()\n    attributed_memory = prompt_memory(entity, mind) if os.environ.get(ATTRIBUTED_MEMORY_ENV) == "1" else None\n    current_state = state()\n''')
          replace_exact(core,
'''        "relationship": {k: rel.get(k) for k in ("exposure", "direct_familiarity", "trust", "predictability", "reciprocity", "warmth", "respect", "disclosure_depth", "tension")},\n    }\n    perception = model_run("comprehension", {"entity": entity, "profile": P[entity], **base}) if role == "comprehension" else None\n''',
'''        "relationship": {k: rel.get(k) for k in ("exposure", "direct_familiarity", "trust", "predictability", "reciprocity", "warmth", "respect", "disclosure_depth", "tension")},\n    }\n    if attributed_memory is not None:\n        base["memory"] = attributed_memory\n    perception = model_run("comprehension", {"entity": entity, "profile": P[entity], **base}) if role == "comprehension" else None\n''')
          replace_exact(core,
'''            "relationship": base.get("relationship"),\n            "mandatory_speech": True,\n''',
'''            "relationship": base.get("relationship"),\n            **({"memory": base["memory"]} if "memory" in base else {}),\n            "mandatory_speech": True,\n''', expected=2)
          replace_exact(core,
'''            "speaker": message["speaker"],\n            "text": message["text"][:300],\n''',
'''            "speaker": message["speaker"],\n            "text": message["text"][:300],\n            "at": message["at"],\n''')

          participant='scripts/room_participant.py'
          replace_exact(participant,
'''def participant_for(item: dict) -> str:\n    speaker = str(item.get("speaker") or DEFAULT_PARTICIPANT).strip().lower()\n    return speaker if speaker in PARTICIPANTS else DEFAULT_PARTICIPANT\n''',
'''def participant_for(item: dict) -> str:\n    speaker = str(item.get("speaker") or "").strip().lower()\n    if speaker not in PARTICIPANTS:\n        raise RuntimeError(f"unknown participant speaker: {speaker!r}")\n    return speaker\n''')
          replace_exact(participant,
'''    participant = str(message.get("speaker") or DEFAULT_PARTICIPANT).lower()\n    memories = list(entity.get("room_memories") or [])\n''',
'''    if "speaker" not in message:\n        raise RuntimeError(f"participant memory message missing speaker: {message!r}")\n    participant = str(message["speaker"]).strip().lower()\n    if participant not in PARTICIPANTS:\n        raise RuntimeError(f"unknown participant speaker in memory: {participant!r}")\n    if "at" not in message or not str(message["at"]).strip():\n        raise RuntimeError(f"participant memory message missing timestamp: {message!r}")\n    memories = list(entity.get("room_memories") or [])\n''')
          replace_exact(participant,
'''            "speaker": participant,\n            "text": str(message.get("text") or "")[:300],\n''',
'''            "speaker": participant,\n            "text": str(message.get("text") or "")[:300],\n            "at": str(message["at"]),\n''')

          model='scripts/room_private_model.py'
          replace_exact(model,
'''PEOPLE = ["sarah", "mara", "owen", "jules"]\n''',
'''PEOPLE = ["sarah", "mara", "owen", "jules"]\nKNOWN_CONTEXT_SPEAKERS = {"sarah", "mara", "owen", "jules", "allen", "sara"}\n''')
          replace_exact(model,
'''def _public_message(message: object, text_limit: int) -> dict:\n    if not isinstance(message, dict):\n        return {"speaker": None, "text": str(message or "")[:text_limit], "target": None}\n    cognition = message.get("cognition") if isinstance(message.get("cognition"), dict) else {}\n    return {"speaker": message.get("speaker"), "text": str(message.get("text", ""))[:text_limit], "target": cognition.get("target")}\n''',
'''def _strict_context_speaker(value: object) -> str:\n    speaker = str(value or "").strip().lower()\n    if speaker not in KNOWN_CONTEXT_SPEAKERS:\n        raise ValueError(f"unknown Room speaker in model context: {value!r}")\n    return speaker\n\n\ndef _public_message(message: object, text_limit: int) -> dict:\n    if not isinstance(message, dict):\n        raise ValueError(f"invalid Room message in model context: {message!r}")\n    if "speaker" not in message:\n        raise ValueError(f"Room message missing speaker in model context: {message!r}")\n    cognition = message.get("cognition") if isinstance(message.get("cognition"), dict) else {}\n    return {"speaker": _strict_context_speaker(message["speaker"]), "text": str(message.get("text", ""))[:text_limit], "target": cognition.get("target")}\n''')
          memory_block='''\n    memory = out.get("memory")\n    if memory is not None:\n        if not isinstance(memory, list):\n            raise ValueError("Room attributed memory must be a list")\n        cleaned_memory = []\n        for item in memory[-12:]:\n            if not isinstance(item, dict):\n                raise ValueError(f"invalid attributed memory row: {item!r}")\n            for key in ("speaker", "relation", "text", "at"):\n                if key not in item:\n                    raise ValueError(f"attributed memory missing {key}: {item!r}")\n            speaker = _strict_context_speaker(item["speaker"])\n            relation = str(item["relation"]).strip().lower()\n            if relation not in {"self", "other"}:\n                raise ValueError(f"invalid attributed memory relation: {relation!r}")\n            at = str(item["at"]).strip()\n            if not at:\n                raise ValueError(f"attributed memory missing timestamp: {item!r}")\n            cleaned_memory.append({"speaker": speaker, "relation": relation, "text": str(item["text"])[:420], "at": at})\n        out["memory"] = cleaned_memory\n'''
          anchor2='''    profile = out.pop("profile", None)\n'''
          replace_exact(model, anchor2, memory_block+'\n'+anchor2)

          commit='scripts/room_private_commit_base.py'
          anchor3='''def private_commit(parts: list[dict], key: str):\n'''
          helper3='''KNOWN_MEMORY_SPEAKERS = {"sarah", "mara", "owen", "jules", "allen", "sara"}\n\n\ndef public_memory_snapshot(entries):\n    out = []\n    for item in list(entries or [])[-12:]:\n        if not isinstance(item, dict):\n            raise RuntimeError(f"invalid public memory row: {item!r}")\n        for key in ("speaker", "text", "at"):\n            if key not in item:\n                raise RuntimeError(f"public memory missing {key}: {item!r}")\n        speaker = str(item["speaker"]).strip().lower()\n        if speaker not in KNOWN_MEMORY_SPEAKERS:\n            raise RuntimeError(f"unknown Room speaker in public memory: {speaker!r}")\n        at = str(item["at"]).strip()\n        if not at:\n            raise RuntimeError(f"public memory has empty timestamp: {item!r}")\n        out.append({"speaker": speaker, "text": str(item["text"]), "at": at})\n    return out\n\n\n'''+anchor3
          replace_exact(commit, anchor3, helper3)
          replace_exact(commit,
'''            "memory": [{"text": x.get("text", "")} for x in ent.get("room_memories", [])[-12:]],\n''',
'''            "memory": public_memory_snapshot(ent.get("room_memories", [])),\n''')

          workflow='.github/workflows/sarah-society.yml'
          replace_exact(workflow,
'''          ROOM_QUALITY_REJECTION_EXIT=42\n''',
'''          ROOM_QUALITY_REJECTION_EXIT=42\n          export ROOM_ATTRIBUTED_MEMORY=1\n''')
          PY

      - name: Prove additive path disabled is feed-identical
        run: |
          set -euo pipefail
          env -u ROOM_ATTRIBUTED_MEMORY python3 scripts/build_room_feed.py
          cmp -s /tmp/feed-before-step1.json room/feed.json || {
            echo 'FAIL: attributed-memory path disabled changed generated feed'
            diff -u /tmp/feed-before-step1.json room/feed.json | head -200 || true
            exit 1
          }
          echo 'PASS: disabled attributed-memory path is bit-identical at feed boundary'

      - name: Migrate retained memory timestamps strictly and run Step 1 tests
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          conv=json.loads(Path('room/conversation.json').read_text())
          minds=json.loads(Path('room/cognitive_state.json').read_text())
          by_id={m['id']:m for m in conv if isinstance(m,dict) and m.get('id')}
          known={'sarah','mara','owen','jules','allen','sara'}
          changed=0
          for entity, state in minds['entities'].items():
              if entity not in {'sarah','mara','owen','jules'}:
                  raise SystemExit(f'FAIL: unexpected mind entity during Step1 migration: {entity!r}')
              for item in state['room_memories']:
                  if not isinstance(item,dict): raise SystemExit(f'FAIL: malformed memory for {entity}: {item!r}')
                  for key in ('source','speaker','text'):
                      if key not in item: raise SystemExit(f'FAIL: memory missing {key} for {entity}: {item!r}')
                  speaker=str(item['speaker']).strip().lower()
                  if speaker not in known: raise SystemExit(f'FAIL: unknown memory speaker {speaker!r} for {entity}')
                  source=str(item['source'])
                  if source not in by_id: raise SystemExit(f'FAIL: memory source not found in retained conversation: {source}')
                  msg=by_id[source]
                  actual=str(msg.get('speaker') or '').strip().lower()
                  if actual != speaker: raise SystemExit(f'FAIL: memory speaker/source mismatch {entity}: {speaker!r} != {actual!r} source={source}')
                  at=str(msg.get('at') or '').strip()
                  if not at: raise SystemExit(f'FAIL: source message missing timestamp: {source}')
                  if 'at' in item and str(item['at']) != at: raise SystemExit(f'FAIL: existing memory timestamp mismatch: {source}')
                  if 'at' not in item:
                      item['at']=at; changed+=1
          Path('room/cognitive_state.json').write_text(json.dumps(minds,indent=2,ensure_ascii=False)+'\n')
          print(f'PASS: strictly backfilled {changed} retained memory timestamps')
          PY
          python3 -m py_compile scripts/room_engine_v5_core.py scripts/room_private_model.py scripts/room_participant.py scripts/room_private_commit_base.py
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'scripts')
          import room_engine_v5_core as core
          import room_private_model as pm
          import room_participant as part
          import room_private_commit_base as pc
          mind={'entities':{'owen':{'room_memories':[{'speaker':'owen','text':'mine','at':'2026-01-01T00:00:00Z'},{'speaker':'mara','text':'hers','at':'2026-01-01T00:00:01Z'}]}}}
          old_order=core.ORDER
          try:
              core.ORDER=('sarah','mara','owen','jules')
              rows=core.prompt_memory('owen',mind)
          finally:
              core.ORDER=old_order
          assert rows[0]['speaker']=='owen' and rows[0]['relation']=='self', rows
          assert rows[1]['speaker']=='mara' and rows[1]['relation']=='other', rows
          compact=pm._compact_payload({'entity':'owen','memory':rows},'thought','owen')
          assert compact['memory'][0]['speaker']=='owen' and compact['memory'][0]['relation']=='self' and compact['memory'][0]['at'], compact
          try: pm._public_message({'speaker':'bogus','text':'x'},20)
          except ValueError: pass
          else: raise AssertionError('unknown model-context speaker did not raise')
          try: part.participant_for({'speaker':'bogus'})
          except RuntimeError: pass
          else: raise AssertionError('unknown participant speaker did not raise')
          snap=pc.public_memory_snapshot([{'speaker':'mara','text':'x','at':'2026-01-01T00:00:00Z'}])
          assert snap == [{'speaker':'mara','text':'x','at':'2026-01-01T00:00:00Z'}], snap
          try: pc.public_memory_snapshot([{'speaker':'bogus','text':'x','at':'2026-01-01T00:00:00Z'}])
          except RuntimeError: pass
          else: raise AssertionError('unknown public-memory speaker did not raise')
          print('PASS: prompt distinguishes self vs other and preserves speaker/text/at')
          print('PASS: unknown-speaker lookups raise')
          PY
          python3 scripts/room_engine_v5.py selftest
          git diff --check

      - name: Publish Step 1 and restart exactly one Room runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/room_engine_v5_core.py scripts/room_private_model.py scripts/room_participant.py scripts/room_private_commit_base.py .github/workflows/sarah-society.yml room/cognitive_state.json
          git rm .github/workflows/room-step1-memory-attribution-once.yml
          git diff --cached --check
          git commit -m 'Attribute Room memories to their speakers'
          pushed=0
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          [ "$pushed" -eq 1 ] || { echo 'FAIL: Step1 publish failed'; exit 1; }
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
