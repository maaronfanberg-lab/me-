name: Deep Water seismic audio tests
on:
  push:
    branches: [main, deep-water-seismic-voices-20261114, deep-water-direct-audification-20261114, deep-water-distinct-raw-waves-20261114]
    paths:
      - 'apps/deep-water/**'
      - '.github/workflows/deep-water-seismic-test.yml'
  pull_request:
    paths:
      - 'apps/deep-water/**'
      - '.github/workflows/deep-water-seismic-test.yml'
permissions:
  contents: read
jobs:
  seismic-voices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check apps/deep-water/engine.js
          node --check apps/deep-water/mseed.js
          node --check apps/deep-water/test-seismic-voices.cjs
          node --check apps/deep-water/test-direct-wave.cjs
          node --check apps/deep-water/wave-windows.js
          node --check apps/deep-water/test-wave-windows.cjs
          python3 - <<'PY'
          from pathlib import Path
          src = Path('apps/deep-water/index.html').read_text()
          Path('/tmp/deep-water-inline.js').write_text(src.rsplit('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/deep-water-inline.js
      - name: Legacy wave-derived voice tests
        run: node apps/deep-water/test-seismic-voices.cjs
      - name: Direct waveform audification tests
        run: node apps/deep-water/test-direct-wave.cjs
      - name: Measured waveform section tests
        run: node apps/deep-water/test-wave-windows.cjs
