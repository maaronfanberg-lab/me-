name: Room run status observer
# observe PR129 Room + pulse orchestration: 2026-08-21 16:27Z

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-run-status-probe.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record latest relevant workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p room
          fields='databaseId,status,conclusion,event,createdAt,updatedAt,headSha,displayTitle'
          gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --limit 8 --json "$fields" > /tmp/room-runs.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society-pulse.yml --limit 5 --json "$fields" > /tmp/pulse-runs.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow room-live-quality-probe.yml --limit 5 --json "$fields" > /tmp/quality-runs.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow room-cloudflare-git-build-probe.yml --limit 5 --json "$fields" > /tmp/cloudflare-probe-runs.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow room-worker-ingest-simulator.yml --limit 5 --json "$fields" > /tmp/worker-sim-runs.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow room-relay-probe.yml --limit 5 --json "$fields" > /tmp/relay-probe-runs.json
          gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy-room-worker.yml --limit 5 --json "$fields" > /tmp/deploy-runs.json
          python3 - <<'PY'
          import json
          out={
            'room':json.load(open('/tmp/room-runs.json')),
            'pulse':json.load(open('/tmp/pulse-runs.json')),
            'live_quality_probe':json.load(open('/tmp/quality-runs.json')),
            'cloudflare_git_probe':json.load(open('/tmp/cloudflare-probe-runs.json')),
            'worker_ingest_simulator':json.load(open('/tmp/worker-sim-runs.json')),
            'relay_probe':json.load(open('/tmp/relay-probe-runs.json')),
            'room_worker_deploy':json.load(open('/tmp/deploy-runs.json')),
          }
          open('room/run-status-probe.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
          git config user.name "room-run-status-observer"
          git config user.email "actions@users.noreply.github.com"
          git add room/run-status-probe.json
          git commit -m "Record Room workflow status" || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; }
            sleep "$n"
          done
          exit 1
