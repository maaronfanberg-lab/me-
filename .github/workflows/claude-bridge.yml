name: Claude bridge mailbox

on:
  push:
    branches: [main]
    paths:
      - 'bridge/inbox/*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Path under bridge/inbox/'
        required: true
        type: string

permissions:
  contents: write
  copilot-requests: write

concurrency:
  group: claude-bridge
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve request file
        id: request
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            f='${{ inputs.request_file }}'
          else
            f=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^bridge/inbox/.*\.json$' | tail -n 1 || true)
          fi
          case "$f" in
            bridge/inbox/*.json) ;;
            *) echo "No valid bridge inbox request found: $f" >&2; exit 1 ;;
          esac
          test -f "$f"
          base=$(basename "$f" .json)
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "out=bridge/outbox/${base}.json" >> "$GITHUB_OUTPUT"

      - name: Install GitHub Copilot CLI fallback
        if: env.ANTHROPIC_API_KEY == ''
        run: npm install -g @github/copilot

      - name: Ask Claude
        id: claude
        continue-on-error: true
        run: python3 bridge/claude_bridge.py '${{ steps.request.outputs.file }}' '${{ steps.request.outputs.out }}'

      - name: Commit Claude response
        if: always()
        shell: bash
        run: |
          test -f '${{ steps.request.outputs.out }}' || { echo 'No response file produced'; exit 1; }
          git config user.name 'claude-bridge-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '${{ steps.request.outputs.out }}'
          git commit -m "Claude bridge response: $(basename '${{ steps.request.outputs.out }}' .json)" || exit 0
          for n in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1

      - name: Surface bridge failure
        if: steps.claude.outcome != 'success'
        run: |
          cat '${{ steps.request.outputs.out }}'
          exit 1
