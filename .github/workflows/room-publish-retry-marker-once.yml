name: Repair Room publish retry marker once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-publish-retry-marker-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded marker-consumption repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/room_engine_v5.py')
          t=p.read_text()
          anchor='''def _private_run(role: str, payload: dict, timeout: int = 30):\n'''
          helper='''def _publish_retry_reason_for(entity):\n    marker = ".room-publish-retry.json"\n    try:\n        data = json.load(open(marker))\n    except Exception:\n        return ""\n    if str(data.get("entity") or "").lower() != str(entity or "").lower():\n        return ""\n    return str(data.get("reason") or "").strip()\n\n\ndef _clear_publish_retry_marker(entity):\n    marker = ".room-publish-retry.json"\n    try:\n        data = json.load(open(marker))\n        if str(data.get("entity") or "").lower() == str(entity or "").lower():\n            os.remove(marker)\n    except Exception:\n        pass\n\n\ndef _private_run(role: str, payload: dict, timeout: int = 30):\n'''
          old='''    attempts = 5 if role == "expression" else 2\n    last_reason = "unknown"\n    for attempt in range(attempts):\n        retry = ""\n        if attempt:\n            retry = _expression_retry_guidance(last_reason) if role == "expression" else (\n'''
          new='''    attempts = 5 if role == "expression" else 2\n    external_retry_reason = _publish_retry_reason_for(self_entity) if role == "expression" else ""\n    last_reason = external_retry_reason or "unknown"\n    for attempt in range(attempts):\n        retry = ""\n        if role == "expression" and (attempt or external_retry_reason):\n            retry = _expression_retry_guidance(last_reason)\n        elif attempt:\n            retry = (\n'''
          ret='''            return obj\n'''
          retnew='''            if role == "expression" and external_retry_reason:\n                _clear_publish_retry_marker(self_entity)\n            return obj\n'''
          if helper not in t:
              assert t.count(anchor)==1, 'GUARD helper anchor mismatch'
              t=t.replace(anchor,helper,1)
          if new not in t:
              assert t.count(old)==1, 'GUARD retry loop mismatch'
              t=t.replace(old,new,1)
          if retnew not in t:
              assert t.count(ret)>=1, 'GUARD return anchor mismatch'
              t=t.replace(ret,retnew,1)
          p.write_text(t)
          print('PASS patch applied')
          PY
      - name: Verify exact outer-retry behavior
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/room_engine_v5.py
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0,'scripts')
          import room_engine_v5 as room
          marker='.room-publish-retry.json'
          json.dump({'entity':'jules','reason':'same_beat_sentence_copy'},open(marker,'w'))
          assert room._publish_retry_reason_for('jules')=='same_beat_sentence_copy'
          assert room._publish_retry_reason_for('owen')==''
          captured=[]
          originals=(room._private_model._compact_payload,room._private_model._request,room._private_model._extract_json,room._private_model._validate,room._private_model._sanitize_expression,room._expression_quality.quality_issue)
          old_prompt=os.environ.get('ROOM_NODE_PROMPT'); old_url=os.environ.get('ROOM_MODEL_URL')
          try:
            os.environ['ROOM_NODE_PROMPT']='enabled'; os.environ['ROOM_MODEL_URL']='http://unused'
            room._private_model._compact_payload=lambda payload,role,self_entity=None:{'entity':payload.get('entity','jules')}
            room._private_model._request=lambda model_url,prompt,role,temperature,timeout,self_entity=None,attempt=0:(captured.append(prompt) or '{"utterance":"new distinct point"}')
            room._private_model._extract_json=lambda raw:{'utterance':'new distinct point'}
            room._private_model._validate=lambda role,obj,compact,prompt,self_entity=None:obj
            room._private_model._sanitize_expression=lambda obj,compact,self_entity=None:obj
            room._expression_quality.quality_issue=lambda *args:None
            out=room._private_run('expression',{'entity':'jules'},timeout=1)
            assert out=={'utterance':'new distinct point'}, out
            assert 'Do not reuse any complete sentence' in captured[0], captured[0]
            assert 'same_beat_sentence_copy' not in captured[0], captured[0]
            assert not os.path.exists(marker), 'marker not consumed after successful expression'
            print('ASSERT rejected_speaker_receives_outer_retry_guidance_on_first_attempt=true')
            print('ASSERT retry_reason_not_exposed_to_conversation=true')
            print('ASSERT marker_consumed_after_success=true')
          finally:
            room._private_model._compact_payload,room._private_model._request,room._private_model._extract_json,room._private_model._validate,room._private_model._sanitize_expression,room._expression_quality.quality_issue=originals
            if old_prompt is None: os.environ.pop('ROOM_NODE_PROMPT',None)
            else: os.environ['ROOM_NODE_PROMPT']=old_prompt
            if old_url is None: os.environ.pop('ROOM_MODEL_URL',None)
            else: os.environ['ROOM_MODEL_URL']=old_url
            try: os.remove(marker)
            except FileNotFoundError: pass
          PY
          python3 scripts/room_engine_v5.py selftest
          git diff --check
      - name: Publish and restart one Room runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/room_engine_v5.py
          git rm .github/workflows/room-publish-retry-marker-once.yml
          git commit -m 'Carry publish rejection reason into next expression beat'
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then break; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 10 --json databaseId --jq '.[].databaseId'); do gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true; done
          sleep 3
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
