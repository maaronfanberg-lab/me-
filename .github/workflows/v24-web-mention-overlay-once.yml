name: Install V24 web mention overlay once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Install V24 web mention overlay patcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wire web overlay into existing family launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('experiments/emily-olivia-society/things_falcon_bridge.py')
          s=p.read_text()
          old='''v3.enrich = enrich_v4\n\nif __name__ == "__main__":\n    raise SystemExit(v3.main())\n'''
          new='''v3.enrich = enrich_v4\n\nif __name__ == "__main__":\n    import things_falcon_bridge_web  # installs web-wide mention overlay on v3.enrich\n    raise SystemExit(v3.main())\n'''
          if new in s:
              print('overlay already wired')
          elif old in s:
              p.write_text(s.replace(old,new,1))
          else:
              raise SystemExit('launcher tail changed; refusing broad rewrite')
          PY

      - name: Compile only affected Things modules
        working-directory: experiments/emily-olivia-society
        run: >-
          python3 -m py_compile
          things_falcon_bridge.py
          things_falcon_bridge_web.py
          things_web_mentions.py
          things_surname_deep.py
          things_falcon_bridge_v3.py

      - name: Commit launcher wiring
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/emily-olivia-society/things_falcon_bridge.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Load web-wide mention overlay in V24 launcher [skip ci]'
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*4))
          done
          exit 1
