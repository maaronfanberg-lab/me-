name: Emily Olivia One Shot Restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emily-olivia-one-shot-restart.yml'

concurrency:
  group: emily-olivia-community
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch corrected Community runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run emily-olivia-community-run.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f opener=""
