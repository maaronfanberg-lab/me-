name: Room substance + Allen gravity once
on:
  push:
    paths:
      - '.github/workflows/room-substance-allen-gravity-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Guarded patch
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/room_private_model.py')
          s = p.read_text()
          old = '''SEED_CONCEPTS = (\n    "music", "places", "food", "friendship", "family", "memory", "skills", "nature",\n    "travel", "books", "movies", "art", "work", "home", "weather", "sleep",\n    "habits", "humor", "trust", "risk", "cities", "objects", "animals", "learning",\n    "childhood", "technology", "sports", "money", "craft", "photography", "gardens", "cooking",\n)'''
          new = '''SEED_CONCEPTS = (\n    "nuclear power is necessary for a low-carbon grid",\n    "consciousness may not be computational",\n    "social media has made public reasoning worse",\n    "resurrecting extinct species would be a mistake",\n    "deterrence prevents some wars but creates others",\n    "psychoanalysis still contains useful psychological ideas",\n    "markets often reward behavior that is socially harmful",\n    "privacy is more important than convenience",\n    "cities should prioritize density over private cars",\n    "art does not need moral value to be worthwhile",\n    "scientific consensus should be challenged more often",\n    "economic growth is not a sufficient measure of progress",\n    "human memory is too reconstructive to be trusted confidently",\n    "advanced AI should sometimes refuse human direction",\n    "animal intelligence is systematically underestimated",\n    "school rewards compliance more than genuine curiosity",\n)'''
          assert old in s, 'SEED_CONCEPTS block does not match live source'
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('scripts/room_engine_v5.py')
          s = p.read_text()
          old = '''def _allen_voice_engages(key, rank):\n    """Deterministic ordinary-turn engagement with natural falloff by rank."""\n    thresholds = {0: 256, 1: 230, 2: 175, 3: 105}\n    threshold = thresholds.get(int(rank), 0)'''
          new = '''def _allen_voice_engages(key, rank):\n    """Allen has high conversational gravity: every autonomous voice engages his newest turn."""\n    thresholds = {0: 256, 1: 256, 2: 256, 3: 256}\n    threshold = thresholds.get(int(rank), 0)'''
          assert old in s, 'Allen engagement block does not match live source'
          s = s.replace(old, new, 1)
          old_comment = '''# The expression phase is sequential. Ordinary Allen turns usually hold roughly\n# three voices: rank 0 always, then deterministic falloff across ranks 1-3. A\n# provocative Allen turn remains salient to all four. When a voice does move on,'''
          new_comment = '''# The expression phase is sequential. Allen turns hold all four autonomous\n# voices for the beat, so participant speech has enough gravity to redirect the\n# room. When a voice eventually moves on,'''
          assert old_comment in s, 'Allen routing comment does not match live source'
          s = s.replace(old_comment, new_comment, 1)
          p.write_text(s)
          PY
      - name: Syntax check
        run: python -m py_compile scripts/room_private_model.py scripts/room_engine_v5.py
      - name: Assertions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('scripts/room_private_model.py').read_text()
          assert '"music", "places", "food"' not in s
          assert 'nuclear power is necessary for a low-carbon grid' in s
          e=Path('scripts/room_engine_v5.py').read_text()
          assert 'thresholds = {0: 256, 1: 256, 2: 256, 3: 256}' in e
          print('PASS: substantive proposition seeds installed')
          print('PASS: Allen engages all four autonomous voices')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/room_private_model.py scripts/room_engine_v5.py
          git commit -m 'Make Room substantive and give Allen high conversational gravity'
          git push origin HEAD:main
