name: Extract live cognitive topic once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-live-cognitive-topic-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Extract requested fields only
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          src = json.loads(Path('room/cognitive_state.json').read_text())
          topic_hits=[]
          vocab_hits=[]
          def walk(x,path=()):
              if isinstance(x,dict):
                  for k,v in x.items():
                      p=path+(k,)
                      if k=='topic_episode' and isinstance(v,dict): topic_hits.append((p,v))
                      if k=='previous_vocabulary' and isinstance(v,list): vocab_hits.append((p,v))
                      walk(v,p)
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,path+(i,))
          walk(src)
          out={
              'topic_episode_hits': len(topic_hits),
              'previous_vocabulary_hits': len(vocab_hits),
          }
          if topic_hits:
              path,t=topic_hits[-1]
              out['topic_episode_path']=list(path)
              out['topic_episode']={k:t.get(k) for k in ('id','root','current_facet','focus_turns','status','bridge_pending','recent_terms')}
          if vocab_hits:
              path,v=vocab_hits[-1]
              out['previous_vocabulary_path']=list(path)
              out['previous_vocabulary_count']=len(v)
              out['previous_vocabulary']=v if len(v)<200 else v[-50:]
              out['previous_vocabulary_mode']='full' if len(v)<200 else '50_most_recent'
          Path('room/cognitive-topic-requested.json').write_text(json.dumps(out,indent=2,ensure_ascii=False)+'\n')
          PY
      - name: Commit extraction and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add room/cognitive-topic-requested.json
          git rm .github/workflows/extract-live-cognitive-topic-once.yml
          git commit -m 'Record requested live cognitive topic fields'
          for n in $(seq 1 12); do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          exit 1
