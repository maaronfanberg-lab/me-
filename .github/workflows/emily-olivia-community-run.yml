# Emily + Olivia continuous community runtime
name: Emily Olivia Community Run

on:
  workflow_dispatch:
    inputs:
      opener:
        description: "Optional explicit Emily opening message; blank lets the Stanford chain open autonomously"
        required: false
        default: ""
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"

concurrency:
  group: emily-olivia-community
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  community-run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AGENTSOCIETY_LLM_API_KEY: local-bitnet-unused
      COMMUNITY_BITNET_ROOT: ${{ github.workspace }}/experiments/emily-olivia-society/vendor/BitNet
      COMMUNITY_BITNET_MODEL: ${{ github.workspace }}/experiments/emily-olivia-society/models/Falcon3-1B-Instruct-1.58bit/ggml-model-i2_s.gguf
      COMMUNITY_BITNET_PORT: '8080'
      COMMUNITY_BITNET_START_TIMEOUT: '900'
      COMMUNITY_GENERATION_TIMEOUT: '900'
      COMMUNITY_SOCIAL_RPC_TIMEOUT: '60'
      COMMUNITY_MAX_TOKENS: '64'
      GH_TOKEN: ${{ github.token }}
      TZ: America/Chicago
    steps:
      - name: Gate Central-time handoff slot
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset="$(date +%z)"
          schedule="${{ github.event.schedule }}"
          run=false
          case "$offset:$schedule" in
            '-0500:0 10 * * *'|'-0500:30 15 * * *'|'-0500:0 21 * * *'|'-0500:30 2 * * *') run=true ;;
            '-0600:0 11 * * *'|'-0600:30 16 * * *'|'-0600:0 22 * * *'|'-0600:30 3 * * *') run=true ;;
          esac
          if [ "$run" = true ]; then
            hour="$(date +%H)"
            if [ "$hour" -ge 22 ] || [ "$hour" -lt 5 ]; then
              echo "Scheduled Community handoff arrived during quiet hours; skipping delayed run."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Central offset=$offset schedule=$schedule run=$run"

      - name: Check out Community runtime from main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Validate Community Python before expensive work
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: >-
          python3 -m py_compile
          bitnet_server.py patch_stanford_local.py community_cycle.py community_cycle_base.py
          stanford_native_cycle.py paper_act_adapter.py paper_plan_adapter.py paper_react_adapter.py
          paper_reflection_adapter.py community_session.py controlled_social_space.py first_exchange.py
          social_bridge.py persistence_reflection.py observer.py

      - name: Restore Community runtime and BitNet
        id: bitnet-cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            experiments/emily-olivia-society/.venv-agentsociety
            experiments/emily-olivia-society/.venv-stanford
            experiments/emily-olivia-society/vendor
            experiments/emily-olivia-society/models
            experiments/emily-olivia-society/.bootstrap-ready-v11
          key: community-runtime-bitnet-v11-${{ runner.os }}-py311-${{ hashFiles('experiments/emily-olivia-society/bootstrap_upstreams.sh', 'experiments/emily-olivia-society/patch_stanford_local.py', 'experiments/emily-olivia-society/upstreams.json') }}
          restore-keys: |
            community-runtime-bitnet-v11-${{ runner.os }}-py311-

      - name: Bootstrap pinned research code and BitNet
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: timeout 55m bash bootstrap_upstreams.sh

      - name: Verify build artifacts before caching
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          test -x vendor/BitNet/build/bin/llama-cli
          test -x vendor/BitNet/build/bin/llama-server
          test -s models/Falcon3-1B-Instruct-1.58bit/ggml-model-i2_s.gguf
          test -f .bootstrap-ready-v11
          grep -q 'COMMUNITY_BITNET_HTTP_V4' vendor/stanford-genagents/simulation_engine/gpt_structure.py

      - name: Save runtime cache
        if: steps.gate.outputs.run == 'true' && steps.bitnet-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            experiments/emily-olivia-society/.venv-agentsociety
            experiments/emily-olivia-society/.venv-stanford
            experiments/emily-olivia-society/vendor
            experiments/emily-olivia-society/models
            experiments/emily-olivia-society/.bootstrap-ready-v11
          key: ${{ steps.bitnet-cache.outputs.cache-primary-key }}

      - name: Start and probe BitNet
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          timeout 20m python3 bitnet_server.py start
          python3 bitnet_server.py status
          timeout 16m python3 bitnet_server.py probe

      - name: Restore latest successful memory checkpoint
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        env:
          COMMUNITY_WORKFLOW_FILE: emily-olivia-community-run.yml
          COMMUNITY_ARTIFACT_NAME: emily-olivia-community-results
        run: bash restore_latest_checkpoint.sh

      - name: Validate restore evidence
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('replay/checkpoint_restore.json')
          if not p.exists(): raise SystemExit('checkpoint_restore.json missing')
          data = json.loads(p.read_text())
          if not isinstance(data, dict): raise SystemExit('checkpoint restore evidence must be an object')
          print(json.dumps(data, indent=2))
          PY

      - name: Initialize or preserve cognition
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python init_cognition.py

      - name: Keep Emily and Olivia talking continuously
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          hour="$(date +%H)"
          if [ "$hour" -ge 22 ] || [ "$hour" -lt 5 ]; then
            echo "Community quiet hours are 10:00 PM to 5:00 AM America/Chicago."
            exit 0
          fi
          now_epoch="$(date +%s)"
          quiet_epoch="$(date -d 'today 22:00' +%s)"
          seconds_until_quiet="$((quiet_epoch - now_epoch))"
          if [ "$seconds_until_quiet" -le 0 ]; then exit 0; fi
          continuous_seconds=18000
          if [ "$seconds_until_quiet" -lt "$continuous_seconds" ]; then continuous_seconds="$seconds_until_quiet"; fi
          OPENER="${{ github.event.inputs.opener }}"
          .venv-stanford/bin/python community_session.py \
            --run \
            --continuous-seconds "$continuous_seconds" \
            --turn-delay-seconds 0 \
            --opener "$OPENER"

      - name: Verify session integrity and grounded natural dialogue
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from community_cycle import _is_usable_utterance
          p = Path('replay/community_session.json')
          if not p.is_file(): raise SystemExit('community_session.json missing')
          d = json.loads(p.read_text())
          if d.get('status') != 'completed': raise SystemExit('community session did not complete cleanly')
          completed = int(d.get('completed_reply_turns', 0))
          if completed < 1: raise SystemExit('no completed reply turns')
          if not d.get('resumed_social_state') and not d.get('autonomous_opening'):
              raise SystemExit('clean state did not create an autonomous Stanford opening')
          if d.get('autonomous_opening'):
              opening = d.get('opening_turn') or {}
              action = opening.get('action', {})
              content = str(action.get('content', ''))
              if action.get('type') != 'message' or not _is_usable_utterance(content):
                  raise SystemExit(f'unusable autonomous opening: {opening!r}')
              if opening.get('action_result', {}).get('success') is not True:
                  raise SystemExit('autonomous opening was not delivered')
              cognition = action.get('cognition', {})
              if cognition.get('act_research_source') != 'fe05a71d3e4ed7d10bf68aa4eda6dd995ec070f4':
                  raise SystemExit('autonomous opening did not use pinned paper act source')
          turns = d.get('turns') or []
          candidates = turns if turns else ([d.get('latest_turn')] if d.get('latest_turn') else [])
          if not candidates: raise SystemExit('no turn evidence persisted')
          outputs=[]
          for t in candidates:
              action=t.get('action',{})
              if action.get('type') != 'message': raise SystemExit(f'non-message turn: {t!r}')
              inbox=t.get('observation',{}).get('inbox',[])
              if not isinstance(inbox,list) or not inbox: raise SystemExit(f'missing inbound evidence: {t!r}')
              inbound=str(inbox[-1].get('content',''))
              content=str(action.get('content',''))
              if not _is_usable_utterance(content,inbound): raise SystemExit(f'ungrounded or unnatural dialogue: inbound={inbound[:180]!r} reply={content[:240]!r}')
              if action.get('cognition', {}).get('act_research_source') != 'fe05a71d3e4ed7d10bf68aa4eda6dd995ec070f4':
                  raise SystemExit('reply did not use pinned paper act source')
              if t.get('action_result',{}).get('success') is not True: raise SystemExit('undelivered message in replay')
              if t.get('consumed_inbound') is not True: raise SystemExit('delivered reply did not consume inbound')
              outputs.append(' '.join(content.lower().split()))
          if len(set(outputs)) != len(outputs): raise SystemExit('duplicate reply detected')
          if Path('replay/community_session_error.json').exists(): raise SystemExit('community session error evidence exists')
          print(json.dumps(d, indent=2))
          PY

      - name: Verify persistence and reflection
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python persistence_reflection.py --run

      - name: Verify handoff evidence exists
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          test -s replay/social_state.json
          test -s replay/checkpoint_restore.json
          test -s replay/community_session.json
          test -d workspaces/emily
          test -d workspaces/olivia
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('replay/social_state.json').read_text())
          if state.get('version') != 1 or not isinstance(state.get('inboxes'),dict): raise SystemExit('invalid persisted social state')
          for who in ('emily','olivia'):
              root=Path('workspaces')/who
              for rel in ('scratch.json','meta.json','memory_stream/nodes.json','memory_stream/embeddings.json'):
                  p=root/rel
                  if not p.is_file() or p.stat().st_size==0: raise SystemExit(f'missing cognition file: {p}')
                  json.loads(p.read_text())
          PY
          python3 bitnet_server.py status

      - name: Generate observer report
        if: always() && steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: python3 observer.py --summary > replay/observer.json || true

      - name: Upload community results
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emily-olivia-community-results
          retention-days: 14
          path: |
            experiments/emily-olivia-society/replay/
            experiments/emily-olivia-society/workspaces/
            experiments/emily-olivia-society/vendor/BitNet/logs/
          if-no-files-found: warn

      - name: Publish real replay to viewer
        if: steps.gate.outputs.run == 'true'
        run: |
          test -s experiments/emily-olivia-society/replay/community_session.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f experiments/emily-olivia-society/replay/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Emily Olivia live replay [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          echo "Failed to publish replay after retries" >&2
          exit 1

      - name: Stop BitNet server
        if: always() && steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: python3 bitnet_server.py stop || true
