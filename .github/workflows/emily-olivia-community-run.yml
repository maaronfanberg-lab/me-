name: Emily Olivia Community Run

on:
  workflow_dispatch:
    inputs:
      opener:
        description: "Emily's opening message"
        required: false
        default: "Hello, Olivia."
      turns:
        description: "Maximum reply turns (2-10) for manual bounded runs"
        required: false
        default: "8"
  push:
    branches:
      - main
    paths:
      - '.github/workflows/emily-olivia-community-run.yml'
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "30 15 * * *"
    - cron: "30 16 * * *"
    - cron: "0 21 * * *"
    - cron: "0 22 * * *"
    - cron: "30 2 * * *"
    - cron: "30 3 * * *"

concurrency:
  group: emily-olivia-community
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  community-run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      COMMUNITY_BITNET_ROOT: ${{ github.workspace }}/experiments/emily-olivia-society/vendor/BitNet
      COMMUNITY_BITNET_MODEL: ${{ github.workspace }}/experiments/emily-olivia-society/models/BitNet-b1.58-2B-4T/ggml-model-i2_s.gguf
      COMMUNITY_BITNET_PORT: '8080'
      COMMUNITY_BITNET_START_TIMEOUT: '900'
      COMMUNITY_GENERATION_TIMEOUT: '900'
      COMMUNITY_SOCIAL_RPC_TIMEOUT: '60'
      COMMUNITY_MAX_TOKENS: '64'
      GH_TOKEN: ${{ github.token }}
      TZ: America/Chicago
    steps:
      - name: Gate Central-time handoff slot
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset="$(date +%z)"
          schedule="${{ github.event.schedule }}"
          run=false
          case "$offset:$schedule" in
            '-0500:0 10 * * *'|'-0500:30 15 * * *'|'-0500:0 21 * * *'|'-0500:30 2 * * *') run=true ;;
            '-0600:0 11 * * *'|'-0600:30 16 * * *'|'-0600:0 22 * * *'|'-0600:30 3 * * *') run=true ;;
          esac
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Central offset=$offset schedule=$schedule run=$run"

      - name: Check out Community runtime from main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Validate Community Python before expensive work
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: python3 -m py_compile bitnet_server.py patch_stanford_local.py community_cycle.py community_session.py controlled_social_space.py first_exchange.py social_bridge.py persistence_reflection.py observer.py

      - name: Restore Community runtime and BitNet
        id: bitnet-cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            experiments/emily-olivia-society/.venv-agentsociety
            experiments/emily-olivia-society/.venv-stanford
            experiments/emily-olivia-society/vendor
            experiments/emily-olivia-society/models
            experiments/emily-olivia-society/.bootstrap-ready-v7
          key: community-runtime-bitnet-v7-${{ runner.os }}-py311-${{ hashFiles('experiments/emily-olivia-society/bootstrap_upstreams.sh', 'experiments/emily-olivia-society/patch_stanford_local.py', 'experiments/emily-olivia-society/upstreams.json') }}
          restore-keys: |
            community-runtime-bitnet-v7-${{ runner.os }}-py311-
            community-runtime-bitnet-${{ runner.os }}-py311-

      - name: Bootstrap pinned research code and free BitNet build
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: timeout 55m bash bootstrap_upstreams.sh

      - name: Verify build artifacts before caching
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          test -x vendor/BitNet/build/bin/llama-cli
          test -x vendor/BitNet/build/bin/llama-server
          test -s models/BitNet-b1.58-2B-4T/ggml-model-i2_s.gguf
          test -f .bootstrap-ready-v7
          grep -q 'COMMUNITY_BITNET_HTTP_V2' vendor/stanford-genagents/simulation_engine/gpt_structure.py
          ! grep -q 'client = openai.OpenAI' vendor/stanford-genagents/simulation_engine/gpt_structure.py

      - name: Save Community runtime and BitNet immediately after bootstrap
        if: steps.gate.outputs.run == 'true' && steps.bitnet-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            experiments/emily-olivia-society/.venv-agentsociety
            experiments/emily-olivia-society/.venv-stanford
            experiments/emily-olivia-society/vendor
            experiments/emily-olivia-society/models
            experiments/emily-olivia-society/.bootstrap-ready-v7
          key: ${{ steps.bitnet-cache.outputs.cache-primary-key }}

      - name: Start one persistent BitNet server
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: timeout 20m python3 bitnet_server.py start

      - name: Confirm persistent BitNet server
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          python3 bitnet_server.py status
          timeout 16m python3 bitnet_server.py probe

      - name: Restore latest successful memory checkpoint
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        env:
          COMMUNITY_WORKFLOW_FILE: emily-olivia-community-run.yml
          COMMUNITY_ARTIFACT_NAME: emily-olivia-community-results
        run: bash restore_latest_checkpoint.sh

      - name: Validate restore evidence
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('replay/checkpoint_restore.json')
          if not p.exists():
              raise SystemExit('checkpoint_restore.json missing')
          data = json.loads(p.read_text())
          if not isinstance(data, dict):
              raise SystemExit('checkpoint restore evidence must be an object')
          print(json.dumps(data, indent=2))
          PY

      - name: Initialize or preserve private cognition workspaces
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python init_cognition.py

      - name: Keep Emily and Olivia talking
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          OPENER="${{ github.event.inputs.opener }}"
          TURNS="${{ github.event.inputs.turns }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hour="$(date +%H)"
            if [ "$hour" -ge 22 ] || [ "$hour" -lt 5 ]; then
              echo "Community quiet hours are 10:00 PM to 5:00 AM America/Chicago."
              exit 0
            fi
            now_epoch="$(date +%s)"
            quiet_epoch="$(date -d 'today 22:00' +%s)"
            seconds_until_quiet="$((quiet_epoch - now_epoch))"
            if [ "$seconds_until_quiet" -le 0 ]; then
              echo "Quiet time has begun."
              exit 0
            fi
            continuous_seconds=18000
            if [ "$seconds_until_quiet" -lt "$continuous_seconds" ]; then
              continuous_seconds="$seconds_until_quiet"
            fi
            .venv-stanford/bin/python community_session.py \
              --run \
              --continuous-seconds "$continuous_seconds" \
              --turn-delay-seconds 60 \
              --opener "Let's continue naturally from where we left off."
          else
            if [ -z "$OPENER" ]; then OPENER="Hello, Olivia."; fi
            if [ -z "$TURNS" ]; then TURNS="8"; fi
            if ! [[ "$TURNS" =~ ^[0-9]+$ ]] || [ "$TURNS" -lt 2 ] || [ "$TURNS" -gt 10 ]; then
              echo "turns must be an integer from 2 through 10" >&2
              exit 2
            fi
            .venv-stanford/bin/python community_session.py --run --turns "$TURNS" --opener "$OPENER"
          fi

      - name: Verify session integrity
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('replay/community_session.json').read_text())
          if summary.get('status') != 'completed':
              raise SystemExit('community session did not complete cleanly')
          if int(summary.get('completed_reply_turns', 0)) < 1:
              raise SystemExit('community session completed no reply turns')
          if not summary.get('session_id'):
              raise SystemExit('community session missing session_id')
          latest = summary.get('latest_turn') or {}
          if latest.get('action', {}).get('type') == 'message':
              if latest.get('action_result', {}).get('success') is not True:
                  raise SystemExit('latest message was not delivered')
              if latest.get('consumed_inbound') is not True:
                  raise SystemExit('latest delivered message did not consume inbound')
          if Path('replay/community_session_error.json').exists():
              raise SystemExit('community session error evidence exists')
          print(json.dumps(summary, indent=2))
          PY

      - name: Verify persistence and reflection
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python persistence_reflection.py --run

      - name: Verify handoff evidence exists
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          test -s replay/social_state.json
          test -s replay/checkpoint_restore.json
          test -s replay/community_session.json
          test -d workspaces/emily
          test -d workspaces/olivia
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('replay/social_state.json').read_text())
          if state.get('version') != 1 or not isinstance(state.get('inboxes'), dict):
              raise SystemExit('invalid persisted social state')
          for who in ('emily', 'olivia'):
              root = Path('workspaces') / who
              for rel in ('scratch.json', 'meta.json', 'memory_stream/nodes.json', 'memory_stream/embeddings.json'):
                  p = root / rel
                  if not p.is_file() or p.stat().st_size == 0:
                      raise SystemExit(f'missing cognition file: {p}')
                  json.loads(p.read_text())
          PY
          python3 bitnet_server.py status

      - name: Generate compact read-only observer report
        if: always() && steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          mkdir -p replay
          python3 observer.py --summary > replay/observer.json || true

      - name: Upload community results
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emily-olivia-community-results
          retention-days: 14
          path: |
            experiments/emily-olivia-society/replay/
            experiments/emily-olivia-society/workspaces/
          if-no-files-found: error

      - name: Stop BitNet server
        if: always() && steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: python3 bitnet_server.py stop || true
