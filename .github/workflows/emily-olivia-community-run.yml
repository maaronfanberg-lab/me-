name: Emily Olivia Community Run

on:
  workflow_dispatch:
    inputs:
      opener:
        description: "Emily's opening message"
        required: false
        default: "Hello, Olivia."
      turns:
        description: "Maximum reply turns (2-10) for manual bounded runs"
        required: false
        default: "8"
  schedule:
    # Four Central-time handoff slots. Each slot has a CDT and CST UTC form;
    # the first gate below keeps only the one matching the current UTC offset.
    - cron: "0 10 * * *"   # 05:00 CDT
    - cron: "0 11 * * *"   # 05:00 CST
    - cron: "30 15 * * *"  # 10:30 CDT
    - cron: "30 16 * * *"  # 10:30 CST
    - cron: "0 21 * * *"   # 16:00 CDT
    - cron: "0 22 * * *"   # 16:00 CST
    - cron: "30 2 * * *"   # 21:30 CDT
    - cron: "30 3 * * *"   # 21:30 CST

concurrency:
  group: emily-olivia-community
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  community-run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENTSOCIETY_LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TZ: America/Chicago
    steps:
      - name: Gate Central-time handoff slot
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          offset="$(date +%z)"
          schedule="${{ github.event.schedule }}"
          run=false

          case "$offset:$schedule" in
            '-0500:0 10 * * *'|'-0500:30 15 * * *'|'-0500:0 21 * * *'|'-0500:30 2 * * *') run=true ;;
            '-0600:0 11 * * *'|'-0600:30 16 * * *'|'-0600:0 22 * * *'|'-0600:30 3 * * *') run=true ;;
          esac

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Central offset=$offset schedule=$schedule run=$run"

      - name: Check out Community runtime from main
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Require model secret
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is missing."
            exit 1
          fi

      - name: Bootstrap pinned research code
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: bash bootstrap_upstreams.sh

      - name: Restore latest successful memory checkpoint
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        env:
          COMMUNITY_WORKFLOW_FILE: emily-olivia-community-run.yml
          COMMUNITY_ARTIFACT_NAME: emily-olivia-community-results
        run: bash restore_latest_checkpoint.sh

      - name: Initialize or preserve private cognition workspaces
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python init_cognition.py

      - name: Keep Emily and Olivia talking
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: |
          OPENER="${{ github.event.inputs.opener }}"
          TURNS="${{ github.event.inputs.turns }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hour="$(date +%H)"
            if [ "$hour" -ge 22 ] || [ "$hour" -lt 5 ]; then
              echo "Community quiet hours are 10:00 PM to 5:00 AM America/Chicago."
              exit 0
            fi
            now_epoch="$(date +%s)"
            quiet_epoch="$(date -d 'today 22:00' +%s)"
            seconds_until_quiet="$((quiet_epoch - now_epoch))"
            if [ "$seconds_until_quiet" -le 0 ]; then
              echo "Quiet time has begun."
              exit 0
            fi
            continuous_seconds=19800
            if [ "$seconds_until_quiet" -lt "$continuous_seconds" ]; then
              continuous_seconds="$seconds_until_quiet"
            fi
            OPENER="Let's continue naturally from where we left off."
            .venv-stanford/bin/python community_session.py \
              --run \
              --continuous-seconds "$continuous_seconds" \
              --turn-delay-seconds 60 \
              --opener "$OPENER"
          else
            if [ -z "$OPENER" ]; then OPENER="Hello, Olivia."; fi
            if [ -z "$TURNS" ]; then TURNS="8"; fi
            .venv-stanford/bin/python community_session.py \
              --run \
              --turns "$TURNS" \
              --opener "$OPENER"
          fi

      - name: Verify persistence and reflection
        if: steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python persistence_reflection.py --run

      - name: Generate compact read-only observer report
        if: always() && steps.gate.outputs.run == 'true'
        working-directory: experiments/emily-olivia-society
        run: python3 observer.py --summary > replay/observer.json

      - name: Upload community results
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: emily-olivia-community-results
          path: |
            experiments/emily-olivia-society/replay/
            experiments/emily-olivia-society/workspaces/
          if-no-files-found: warn
