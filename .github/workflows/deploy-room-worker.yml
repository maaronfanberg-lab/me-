name: Deploy validated Room Worker
# self-reporting deployment gate plus live Allen auth/build probe: 2026-08-20

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/room-worker/**'
      - '.github/workflows/deploy-room-worker.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-room-live-mirror
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
      ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Detect Cloudflare API token
        id: token
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare API token is available.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare API token is unavailable.'
          fi

      - name: Resolve Fanberg Cloudflare account
        id: account
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Using configured Cloudflare account ID.'
            exit 0
          fi
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50' \
            > /tmp/cf-accounts.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json
          d=json.load(open('/tmp/cf-accounts.json'))
          if not d.get('success'):
              raise SystemExit('Cloudflare account lookup failed')
          matches=[a for a in d.get('result',[]) if 'fanberg' in str(a.get('name','')).lower()]
          if len(matches) != 1:
              names=[str(a.get('name','')) for a in d.get('result',[])]
              raise SystemExit(f'Expected exactly one Fanberg Cloudflare account; found {len(matches)}. Accessible account names: {names}')
          a=matches[0]
          print(f"CLOUDFLARE_ACCOUNT_ID={a['id']}")
          print(f"CLOUDFLARE_ACCOUNT_NAME={a['name']}")
          PY
          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo 'Resolved Fanberg Cloudflare account.'

      - name: Check deploy credentials without exposing them
        id: creds
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.token.outputs.available }}" = 'true' ] && [ "${{ steps.account.outcome }}" = 'success' ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment credentials are usable.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Cloudflare deployment credentials are not usable.'
          fi

      - name: Probe live Allen auth without a credential
        id: allen_auth
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          code=$(curl -sS --connect-timeout 3 --max-time 8 \
            -o /tmp/allen-auth-response.json \
            -w '%{http_code}' \
            "${ROOM_RELAY_URL}/api/allen/auth")
          rc=$?
          set -e
          echo "http_code=${code}" >> "$GITHUB_OUTPUT"
          echo "curl_rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "Allen auth HTTP ${code}; curl rc ${rc}"
          cat /tmp/allen-auth-response.json 2>/dev/null || true
          test "$rc" -eq 0

      - name: Refuse unvalidated Worker source
        id: validate
        if: steps.creds.outputs.available == 'true'
        continue-on-error: true
        run: |
          node --check cloudflare/room-worker/src/index-entry.js
          node scripts/room_worker_ingest_sim.mjs
          python3 - <<'PY'
          import json
          d=json.load(open('room/worker-ingest-simulator-diagnostic.json'))
          if not d.get('pass'):
              raise SystemExit('Worker source simulator is not green; refusing deployment')
          print('Worker source simulator is green.')
          PY

      - name: Deploy existing room-live-mirror Worker
        id: deploy_worker
        if: steps.creds.outputs.available == 'true' && steps.validate.outcome == 'success'
        continue-on-error: true
        run: npx --yes wrangler@latest deploy --config cloudflare/room-worker/wrangler.toml

      - name: Push current Room feed through deployed Worker
        id: ingest
        if: steps.deploy_worker.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          token_json=$(curl -fsS --connect-timeout 3 --max-time 8 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=room-live-mirror")
          relay_token=$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))')
          test -n "$relay_token"
          ingest=$(curl -fsS --connect-timeout 3 --max-time 8 \
            -X POST \
            -H "Authorization: Bearer ${relay_token}" \
            -H 'Content-Type: application/json' \
            --data-binary @room/feed.json \
            "${ROOM_RELAY_URL}/api/ingest")
          printf '%s\n' "$ingest"
          accepted=$(printf '%s' "$ingest" | python3 -c 'import json,sys; print(str(bool(json.load(sys.stdin).get("accepted"))).lower())')
          test "$accepted" = true

      - name: Verify live relay and Allen-key build
        id: verify
        if: steps.ingest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          curl -fsS --connect-timeout 3 --max-time 8 \
            -H 'Origin: https://maaronfanberg-lab.github.io' \
            "${ROOM_RELAY_URL}/api/feed?fresh=$(date +%s)" > /tmp/live-relay.json
          curl -fsS --retry 5 --retry-delay 2 \
            "${ROOM_RELAY_URL}/health?fresh=$(date +%s)" > /tmp/room-health.json
          python3 - <<'PY'
          import json
          from datetime import datetime
          local=json.load(open('room/feed.json'))
          raw=json.load(open('/tmp/live-relay.json'))
          health=json.load(open('/tmp/room-health.json'))
          remote=raw.get('feed',raw)
          ls=local.get('state',{}); rs=remote.get('state',{})
          def ts(x):
              return datetime.fromisoformat(str(x).replace('Z','+00:00')).timestamp()
          lg=local.get('generated_at') or ls.get('last_run')
          rg=remote.get('generated_at') or rs.get('last_run')
          lag=ts(lg)-ts(rg)
          print(json.dumps({
            'local_boot':ls.get('boot_id'),
            'relay_boot':rs.get('boot_id'),
            'local_cycle':ls.get('cycle'),
            'relay_cycle':rs.get('cycle'),
            'timestamp_lag_seconds':lag,
            'allen_key_build':health.get('allenKeyBuild'),
          },indent=2))
          if ls.get('boot_id') != rs.get('boot_id'):
              raise SystemExit('Relay is still on the wrong Room boot')
          if lag > 90:
              raise SystemExit('Relay is still stale')
          if health.get('allenKeyBuild') != '20260820-current':
              raise SystemExit('Live Worker does not have the current Allen-key build')
          PY

      - name: Write non-secret deployment status
        if: always()
        env:
          TOKEN_AVAILABLE: ${{ steps.token.outputs.available }}
          ACCOUNT_OUTCOME: ${{ steps.account.outcome }}
          CREDS_AVAILABLE: ${{ steps.creds.outputs.available }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_worker.outcome }}
          INGEST_OUTCOME: ${{ steps.ingest.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ALLEN_AUTH_OUTCOME: ${{ steps.allen_auth.outcome }}
          ALLEN_AUTH_HTTP: ${{ steps.allen_auth.outputs.http_code }}
          ALLEN_AUTH_CURL_RC: ${{ steps.allen_auth.outputs.curl_rc }}
        run: |
          mkdir -p room
          python3 - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timezone
          creds=os.environ.get('CREDS_AVAILABLE')=='true'
          auth={}
          try:
              auth=json.load(open('/tmp/allen-auth-response.json'))
          except Exception:
              pass
          auth_http=str(os.environ.get('ALLEN_AUTH_HTTP') or '')
          allen_live=(auth_http=='401' and auth.get('error')=='unauthorized')
          out={
            'checked_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'worker':'room-live-mirror',
            'source_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'token_available':os.environ.get('TOKEN_AVAILABLE')=='true',
            'account':os.environ.get('ACCOUNT_OUTCOME') or 'skipped',
            'credentials_available':creds,
            'validate':os.environ.get('VALIDATE_OUTCOME') or 'skipped',
            'deploy':os.environ.get('DEPLOY_OUTCOME') or 'skipped',
            'ingest':os.environ.get('INGEST_OUTCOME') or 'skipped',
            'verify':os.environ.get('VERIFY_OUTCOME') or 'skipped',
            'allen_auth_transport':os.environ.get('ALLEN_AUTH_OUTCOME') or 'skipped',
            'allen_auth_http':auth_http,
            'allen_auth_error':auth.get('error'),
            'allen_auth_fallback_live':allen_live,
            'expected_allen_key_build':'20260820-current',
          }
          out['pass']=creds and out['validate']=='success' and out['deploy']=='success' and out['ingest']=='success' and out['verify']=='success'
          if allen_live:
              out['allen_state']='fallback-capable-worker-live'
          elif auth.get('error')=='allen-key-not-configured':
              out['allen_state']='old-secret-only-worker-live'
          else:
              out['allen_state']='live-auth-state-unresolved'
          out['state']='deployed-and-verified' if out['pass'] else ('missing-cloudflare-token' if not out['token_available'] else 'deployment-or-verification-failed')
          open('room/cloudflare-deploy-status.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Publish deployment status
        if: always()
        run: |
          git config user.name "room-worker-deployer"
          git config user.email "actions@users.noreply.github.com"
          git add room/cloudflare-deploy-status.json
          git commit -m "Record Room Worker deployment status" || exit 0
          for n in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            sleep "$n"
          done
          exit 1
