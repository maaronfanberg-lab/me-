name: Earthlight DSP and mobile audio smoke
on:
  push:
    branches: [main]
    paths:
      - 'apps/earthlight.html'
      - 'apps/deep-earth-ambient.js'
      - 'apps/deep-earth-core.js'
      - 'apps/deep-earth-voices.js'
      - 'apps/deep-earth-music.js'
      - 'apps/deep-earth-ambient.css'
      - '.github/workflows/earthlight-audio-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: earthlight-dsp-tests
  cancel-in-progress: true
jobs:
  dsp:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --silent playwright
          npx playwright install --with-deps chromium
      - name: Serve instrument
        run: python3 -m http.server 8100 --directory . >/tmp/earthlight-http.log 2>&1 &
      - name: Real browser + offline DSP renders
        run: |
          cat >/tmp/earthlight-test.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright');
          (async()=>{
           const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--autoplay-policy=no-user-gesture-required']});
           const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true,deviceScaleFactor:2});
           const errors=[];page.on('pageerror',e=>errors.push(e.stack||e.message));page.on('console',x=>{if(x.type()==='error')console.log('CONSOLE ERROR',x.text())});
           await page.goto('http://127.0.0.1:8100/apps/earthlight.html',{waitUntil:'domcontentloaded'});
           await page.waitForFunction(()=>window.__earthlight&&document.querySelectorAll('#controls input').length>=30,{timeout:20000});
           console.log('CONTROL COUNT',await page.locator('#controls input').count());
           await page.locator('#power').click();
           await page.waitForFunction(()=>window.__earthlight.getStatus().audioState==='running',{timeout:12000});
           console.log('AUDIO BOOT',await page.evaluate(()=>window.__earthlight.getStatus()));
           const musicState=await page.evaluate(()=>window.__earthlight.getStatus().musicStats);
           if(!musicState||musicState.lead<1||musicState.pulse<1)throw Error('No composed melody or musical pulse on startup');
           console.log('MUSICAL COMPOSITION ACTIVE',musicState);
           await page.locator('#spatialMode').selectOption('headphone');
           await page.locator('#mono').click();
           if((await page.locator('#mono').getAttribute('aria-pressed'))!=='true')throw Error('Mono fold down did not enable');
           await page.locator('#mono').click();
           await page.locator('#spatialMode').selectOption('speaker');
           await page.evaluate(()=>window.__earthlight.setParam('root',47.50));
           if(Math.abs((await page.evaluate(()=>window.__earthlight.getParams().root))-47.5)>.001)throw Error('Pitch slider not wired');
           await page.evaluate(()=>window.__earthlight.setParam('root',43.65));
           const readings=await page.evaluate(async()=>{
            function metrics(b,f){const L=b.getChannelData(0),R=b.getChannelData(1),sr=b.sampleRate,N=b.length,s=Math.floor(N*.57);let peak=0,sum=0,diff=0;
             for(let i=s;i<N;i++){let a=L[i],c=R[i];peak=Math.max(peak,Math.abs(a),Math.abs(c));sum+=(a*a+c*c)/2;diff+=(a-c)**2}
             const ph=(A,frequency)=>{let re=0,im=0;for(let i=s;i<N;i++){let a=2*Math.PI*frequency*i/sr;re+=A[i]*Math.cos(a);im-=A[i]*Math.sin(a)}return {re:re/(N-s),im:im/(N-s)}};
             let a=ph(L,f),c=ph(R,f),aamp=Math.hypot(a.re,a.im),bamp=Math.hypot(c.re,c.im);
             let monoamp=Math.hypot((a.re+c.re)/2,(a.im+c.im)/2);
             let low=ph(L,20),low2=ph(R,20),lowamp=(Math.hypot(low.re,low.im)+Math.hypot(low2.re,low2.im))/2;
             return {peak,rms:Math.sqrt(sum/(N-s)),sideRatio:Math.sqrt(diff/Math.max(sum*2,1e-12)),rootMonoRetention:monoamp/Math.max((aamp+bamp)/2,1e-12),rootMagnitude:(aamp+bamp)/2,below20Relative:lowamp/Math.max((aamp+bamp)/2,1e-12)};}
            let monoSub=metrics(await window.__earthlight.simulate({subOnly:true,seconds:3}),43.65);
            let stereo=metrics(await window.__earthlight.simulate({seconds:3,spatial:'speaker'}),43.65);
            let headphone=metrics(await window.__earthlight.simulate({seconds:3,spatial:'headphone'}),43.65);
            return {monoSub,stereo,headphone};
           });
           console.log('DSP RESULTS',JSON.stringify(readings,null,2));
           const musicalContrast=await page.evaluate(async()=>{
             let buf=await window.__earthlight.simulate({seconds:2.9});
             let on=buf.getChannelData(0);let saved=window.__earthlight.getParams();
             window.__earthlight.setParam('lead',0);window.__earthlight.setParam('pulse',0);
             let off=(await window.__earthlight.simulate({seconds:2.9})).getChannelData(0);
             window.__earthlight.setParam('lead',saved.lead);window.__earthlight.setParam('pulse',saved.pulse);
             let difference=0,total=0;for(let i=12000;i<on.length;i+=3){difference+=(on[i]-off[i])**2;total+=on[i]**2;}return Math.sqrt(difference/Math.max(total,1e-10));
           });
           console.log('MUSIC LAYER SIGNAL CONTRAST',musicalContrast);
           if(musicalContrast<.075)throw Error('Music layer too weak to distinguish from drone');
           for(const [name,m] of Object.entries(readings)){if(!(m.peak<.98))throw Error('Peak overload '+name);if(!(m.rms>0.00001))throw Error('Silence '+name);if(!(m.rootMonoRetention>.94))throw Error('Fundamental phase cancellation '+name);}
           if(readings.monoSub.sideRatio>.008)throw Error('Mono foundation leaked into stereo difference');
           if(readings.monoSub.below20Relative>.18)throw Error('Unwanted very-low-frequency energy');
           // Verify a preset does not unmute a paused synth and does not detach the params object.
           await page.locator('#power').click();
           await page.waitForTimeout(300);
           await page.evaluate(()=>window.__earthlight.setParam('master',.4));
           await page.locator('[data-preset="deep"]').click();
           await page.waitForTimeout(300);
           const mutedState=await page.evaluate(()=>window.__earthlight.getStatus());
           if(mutedState.playing||mutedState.audioState==='running')throw Error('Mute was undone by preset or volume slider: '+JSON.stringify(mutedState));
           console.log('PASS muted volume and preset safety');
           // Stress simulation with all energetic layers and the output trim at their maxima.
           const stress=await page.evaluate(async()=>{
             for(const id of ['lead','pulse','master','sub','subHarm','warmth','body','bodyDrive','pad','padDensity','shimmer','reverb','echo','feedback']){
               const el=document.querySelector('#c-'+id);window.__earthlight.setParam(id,Number(el.max));
             }
             const b=await window.__earthlight.simulate({seconds:3.5});
             const a=b.getChannelData(0),r=b.getChannelData(1);let peak=0,energy=0,finite=true;
             for(let i=0;i<a.length;i++){peak=Math.max(peak,Math.abs(a[i]),Math.abs(r[i]));energy+=a[i]*a[i]+r[i]*r[i];finite=finite&&Number.isFinite(a[i])&&Number.isFinite(r[i]);}
             return {peak,rms:Math.sqrt(energy/(2*a.length)),finite};
           });
           console.log('ALL MAXIMUM DSP STRESS',stress);
           if(!stress.finite||stress.peak>=.72||stress.rms<.002)throw Error('Unsafe maximum-output stress render');
           if(errors.length)throw Error('Browser errors '+errors.join(' | '));
           await page.screenshot({path:'/tmp/earthlight-mobile.png',fullPage:true});
           await browser.close();
           console.log('PASS: real composed melody, musical pulse, 30 controls, mono phase preservation, all-max safety and browser startup');
          })().catch(e=>{console.error('FAIL',e);process.exit(1)});
          JS
          node /tmp/earthlight-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earthlight-mobile-smoke-${{ github.run_id }}
          path: /tmp/earthlight-mobile.png
          if-no-files-found: ignore
