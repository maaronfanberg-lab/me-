name: Harmony Graph offline regression
on:
  push:
    branches: [main]
    paths:
      - 'apps/things-universe-v24*.js'
      - 'apps/things-universe-v24.html'
      - 'scripts/test_harmony_graph_offline.mjs'
      - '.github/workflows/harmony-graph-offline.yml'
  pull_request:
    paths:
      - 'apps/things-universe-v24*.js'
      - 'apps/things-universe-v24.html'
      - 'scripts/test_harmony_graph_offline.mjs'
      - '.github/workflows/harmony-graph-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test_harmony_graph_offline.mjs
