name: Observe current Room run once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/observe-current-room-run-once.yml'
permissions:
  contents: write
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record current Room runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --limit 6 --json databaseId,status,conclusion,createdAt,updatedAt,headSha,event,displayTitle > room/current-room-runs.json
          git config user.name room-run-observer
          git config user.email actions@users.noreply.github.com
          git add room/current-room-runs.json
          git rm .github/workflows/observe-current-room-run-once.yml
          git commit -m 'Record current Room runs'
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
