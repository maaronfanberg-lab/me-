name: Allen social boundary simulator

on:
  push:
    branches: ['**']
    paths:
      - 'scripts/room_allen_response_sim.py'
      - 'scripts/room_allen_observation_sim.py'
      - 'scripts/room_allen_provocation_sim.py'
      - 'scripts/room_responsiveness_sim.py'
      - 'scripts/room_allen_two_voice_sim.py'
      - 'scripts/room_question_answering_sim.py'
      - 'scripts/room_participant.py'
      - 'scripts/room_social_v5.py'
      - 'scripts/room_personality_v2.py'
      - 'scripts/room_engine_v5.py'
      - 'scripts/room_private_model.py'
      - 'scripts/room_private_commit.py'
      - '.github/workflows/room-allen-social-sim.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'scripts/room_allen_response_sim.py'
      - 'scripts/room_allen_observation_sim.py'
      - 'scripts/room_allen_provocation_sim.py'
      - 'scripts/room_responsiveness_sim.py'
      - 'scripts/room_allen_two_voice_sim.py'
      - 'scripts/room_question_answering_sim.py'
      - 'scripts/room_participant.py'
      - 'scripts/room_social_v5.py'
      - 'scripts/room_personality_v2.py'
      - 'scripts/room_engine_v5.py'
      - 'scripts/room_private_model.py'
      - 'scripts/room_private_commit.py'
      - '.github/workflows/room-allen-social-sim.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Run Allen and Room responsiveness simulators
        shell: bash
        run: |
          set +e
          python3 scripts/room_allen_response_sim.py > /tmp/allen-response.txt 2>&1
          response_status=$?
          python3 scripts/room_allen_observation_sim.py > /tmp/allen-observation.txt 2>&1
          observation_status=$?
          python3 scripts/room_allen_provocation_sim.py > /tmp/allen-provocation.txt 2>&1
          provocation_status=$?
          python3 scripts/room_responsiveness_sim.py > /tmp/room-responsiveness.txt 2>&1
          responsiveness_status=$?
          python3 scripts/room_allen_two_voice_sim.py > /tmp/allen-rank1.txt 2>&1
          rank1_status=$?
          python3 scripts/room_question_answering_sim.py > /tmp/room-question-answering.txt 2>&1
          question_status=$?
          python3 scripts/room_engine_v5.py selftest > /tmp/engine-selftest.txt 2>&1
          engine_status=$?
          set -e
          python3 - "$response_status" "$observation_status" "$provocation_status" "$responsiveness_status" "$rank1_status" "$question_status" "$engine_status" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          response_status,observation_status,provocation_status,responsiveness_status,rank1_status,question_status,engine_status=map(int,sys.argv[1:])
          def read(path):
              try:return open(path).read()[-6000:]
              except Exception:return ''
          payload={
              'checked_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'pass':all(x==0 for x in (response_status,observation_status,provocation_status,responsiveness_status,rank1_status,question_status,engine_status)),
              'response_sim_exit_code':response_status,
              'observation_sim_exit_code':observation_status,
              'provocation_sim_exit_code':provocation_status,
              'responsiveness_sim_exit_code':responsiveness_status,
              'rank1_sim_exit_code':rank1_status,
              'question_sim_exit_code':question_status,
              'engine_selftest_exit_code':engine_status,
              'response_sim_output':read('/tmp/allen-response.txt'),
              'observation_sim_output':read('/tmp/allen-observation.txt'),
              'provocation_sim_output':read('/tmp/allen-provocation.txt'),
              'responsiveness_sim_output':read('/tmp/room-responsiveness.txt'),
              'rank1_sim_output':read('/tmp/allen-rank1.txt'),
              'question_sim_output':read('/tmp/room-question-answering.txt'),
              'engine_selftest_output':read('/tmp/engine-selftest.txt'),
              'tested_sha':'${{ github.sha }}',
          }
          open('room/allen-social-sim-diagnostic.json','w').write(json.dumps(payload,indent=2)+'\n')
          print(json.dumps(payload,indent=2))
          PY
      - name: Record diagnostic on tested branch
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'allen-social-simulator'
          git config user.email 'actions@users.noreply.github.com'
          git add room/allen-social-sim-diagnostic.json
          git commit -m 'Record Allen social boundary simulator' || exit 0
          branch="${GITHUB_REF_NAME}"
          for n in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
      - name: Enforce simulator result
        if: always()
        run: python3 -c 'import json; d=json.load(open("room/allen-social-sim-diagnostic.json")); raise SystemExit(0 if d.get("pass") else 1)'
