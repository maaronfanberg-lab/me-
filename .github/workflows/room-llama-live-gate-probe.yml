name: Room Llama live gate probe

on:
  push:
    branches: [room-meta-language-gate]
    paths:
      - '.github/workflows/room-llama-live-gate-probe.yml'
      - 'scripts/room_private_model_autonomy.py'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: room-meta-language-gate
          fetch-depth: 1

      - name: Verify meta gate semantics
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/room_private_model_autonomy.py scripts/room_engine_v5.py
          PYTHONPATH=scripts python3 - <<'PY'
          import room_private_model_autonomy as a
          empty={'context':[], 'event':None, 'discussion':{'subject':'movies','focus':'movies'}}
          assert a._public_meta_language("We need to focus on the script rather than your latest idea.", empty)
          grounded={'context':[{'speaker':'mara','text':'The screenplay needs a stronger ending.'}], 'event':None, 'discussion':{'subject':'movies'}}
          assert not a._public_meta_language("I think we should rewrite the script ending.", grounded)
          assert a._public_meta_language("The output format requires structured data.", empty)
          assert not a._public_meta_language("I disagree because the ending feels rushed.", empty)
          joined=' '.join(a.AUTONOMY_PROMPTS.values()).lower()
          for forbidden in ('storyline','talking point'):
              assert forbidden not in joined, forbidden
          print('meta-gate-semantics-pass')
          PY

      - name: Download verified runtime and Llama
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .room_model/runtime
          gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'llama-runtime-linux-x64.tar.gz' --dir .room_model
          echo '360a5bfab5b8fe562c52e060a998a052f5fc7d98a0448b035c2eedbb6acfbd94  .room_model/llama-runtime-linux-x64.tar.gz' | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 5 'https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf?download=true' --output .room_model/llama.gguf
          echo '6f85a640a97cf2bf5b8e764087b1e83da0fdb51d7c9fab7d0fece9385611df83  .room_model/llama.gguf' | sha256sum -c -
          tar -xzf .room_model/llama-runtime-linux-x64.tar.gz -C .room_model/runtime

      - name: Run four-voice meta-language probe
        run: |
          set -euo pipefail
          server_bin=$(find .room_model/runtime -type f -name 'llama-server' | head -1)
          chmod +x "$server_bin"
          "$server_bin" -m .room_model/llama.gguf --host 127.0.0.1 --port 18080 -c 8192 -np 2 >.room_model/server.log 2>&1 &
          model_pid=$!
          trap 'kill "$model_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            curl -fsS --connect-timeout 1 --max-time 2 http://127.0.0.1:18080/health >/dev/null 2>&1 && break
            kill -0 "$model_pid"
            sleep 1
          done
          PYTHONPATH=scripts ROOM_BRAIN_ACTIVE='llama3.2-1b' ROOM_MODEL_URL='http://127.0.0.1:18080/completion' ROOM_NODE_PROMPT='meta-language-probe' python3 - <<'PY'
          import json,time
          import room_engine_v5 as engine
          import room_private_model_autonomy as autonomy
          cfg=json.load(open('room/config.json'))
          people=['sarah','mara','owen','jules']; actions=['DEEPEN','COMPARE','BRIDGE','ANSWER']; partners=['mara','owen','jules','sarah']
          outputs=[]
          for i,e in enumerate(people):
              payload={'entity':e,'profile':cfg['p'][e],'event':None,'context':[],
                'topic':{'id':'topic-probe','root':'movies','current_facet':'movies','facets':[],'shared_references':[],'unresolved':[]},
                'keywords':['movies'],'partner':partners[i],
                'relationship':{'trust':0.6,'warmth':0.5,'respect':0.7,'direct_familiarity':0.5,'reciprocity':0.5,'disclosure_depth':0.3,'tension':0.1},
                'social_observation':{'participation':'PARTICIPANT','relationship_events':[]},
                'deliberation':{'action':actions[i],'preferred_partner':partners[i],'focus':'movies','new_information_goal':'add one personally meaningful thought about movies','must_respond':True}}
              t=time.monotonic(); out=engine._legacy._core.model_run('expression',payload,timeout=30); elapsed=time.monotonic()-t
              u=str(out.get('utterance') or '').strip(); compact=autonomy._autonomy_compact(payload,'expression',e)
              assert elapsed < 40,(e,elapsed); assert u; assert not autonomy._public_meta_language(u,compact),(e,u)
              outputs.append(u); print(f'{e}-seconds={elapsed:.3f} utterance={u}')
          assert len(set(outputs))==4
          print('four-voice-meta-pass')
          print('live-gate-probe-pass')
          PY
