name: Perennial daily growth

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perennial-daily
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Grow and verify
        working-directory: experiments/perennial
        run: |
          python3 grow.py
          python3 verify.py
      - name: Commit the new day
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add experiments/perennial/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perennial: grow $(date -u +%F)"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 20))
          done
          exit 1
