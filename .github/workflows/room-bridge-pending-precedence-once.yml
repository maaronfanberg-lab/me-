name: Room bridge-pending precedence once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-bridge-pending-precedence-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply guarded selector repair
        run: python3 scripts/room_bridge_pending_precedence_repair.py
      - name: Verify against current live state
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/room_topic_bounded.py scripts/room_private_commit_liveness_core.py
          python3 - <<'PY'
          import copy, json, sys
          sys.path.insert(0, 'scripts')
          import room_topic_bounded as bounded
          import room_private_commit_liveness_core as commit

          state=json.load(open('room/state.json'))
          conversation=json.load(open('room/conversation.json'))
          live=copy.deepcopy(state['topic_episode'])
          latest=next((m for m in reversed(conversation) if m.get('speaker') not in bounded.social.ORDER), None)
          assert latest is not None, 'no live external participant event found'
          live['bridge_pending']=True
          live['status']='ready_to_bridge'
          live['bridge_reason']='selector_precedence_regression'
          updated=bounded.update_topic(live,[latest],int(state.get('cycle',0))+1)
          assert updated.get('bridge_pending') is True, updated
          assert updated.get('status') == 'ready_to_bridge', updated
          assert updated.get('root') == live.get('root'), (live.get('root'),updated.get('root'),latest)
          seed=commit._safe_bridge_seed([],int(state.get('cycle',0))+1,updated)
          root=seed[0]
          vocabulary=commit.episode_previous_vocabulary(updated)
          near=[v for v in vocabulary if commit._near_vocabulary(root,[v])]
          assert root not in {'sarah','mara','owen','jules','allen','sara'}, root
          assert not near, (root,near)
          print(f"ASSERT pending_participant_ingress_cannot_preempt_bridge speaker={latest.get('speaker')!r} preserved_root={updated.get('root')!r}")
          print(f"ASSERT vetted_breakout_seed root={root!r} near_hits={near} vocabulary_count={len(vocabulary)}")
          print('PASS live bridge-pending precedence regression')
          PY
      - name: Mark only current bad episode pending
        run: |
          python3 - <<'PY'
          import json
          for p in ('room/state.json','room/cognitive_state.json'):
              data=json.load(open(p))
              topic=data.get('topic_episode') or {}
              topic['bridge_pending']=True
              topic['status']='ready_to_bridge'
              topic['bridge_reason']='selector_precedence_recovery'
              data['topic_episode']=topic
              open(p,'w').write(json.dumps(data,indent=2,ensure_ascii=False)+'\n')
          print('PASS: current bad episode marked ready_to_bridge')
          PY
      - name: Publish and restart exactly one Room runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/room_topic_bounded.py room/state.json room/cognitive_state.json
          git rm .github/workflows/room-bridge-pending-precedence-once.yml
          git rm scripts/room_bridge_pending_precedence_repair.py
          git commit -m 'Give pending bridge precedence over participant ingress'
          pushed=0
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          test "$pushed" -eq 1
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 10 --json databaseId --jq '.[].databaseId'); do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done
          sleep 3
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
