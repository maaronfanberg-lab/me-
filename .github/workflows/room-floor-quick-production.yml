name: Room short production-wrapper A/B

on:
  push:
    branches:
      - research/room-floor-continuity-20261028
    paths:
      - '.github/workflows/room-floor-quick-production.yml'
      - 'scripts/room_floor_production_wrapper_quick.py'

permissions:
  contents: write

concurrency:
  group: room-quick-wrapper-ab
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ROOM_CONVERSATIONAL_FLOOR: '1'
      ROOM_NODE_PROMPT: 'Isolated public source comparison'
      ROOM_BRAIN_ACTIVE: llama3.2-1b
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify source and workflow syntax
        run: |
          python3 -m py_compile scripts/room_floor_production_wrapper_quick.py
          python3 scripts/test_room_conversation_project.py
      - name: Download exact production 1B model and runtime
        run: |
          set -euo pipefail
          mkdir -p .shadow/runtime
          gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'llama-runtime-linux-x64.tar.gz' --dir .shadow
          echo '360a5bfab5b8fe562c52e060a998a052f5fc7d98a0448b035c2eedbb6acfbd94  .shadow/llama-runtime-linux-x64.tar.gz' | sha256sum -c -
          tar -xzf .shadow/llama-runtime-linux-x64.tar.gz -C .shadow/runtime
          curl -fsSL --retry 3 --retry-delay 4             'https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf?download=true'             -o .shadow/llama-3.2-1b.gguf
          echo '6f85a640a97cf2bf5b8e764087b1e83da0fdb51d7c9fab7d0fece9385611df83  .shadow/llama-3.2-1b.gguf' | sha256sum -c -
      - name: Compare real wrapper outputs, no room mutations
        run: |
          set -euo pipefail
          exe=$(find .shadow/runtime -type f -name 'llama-server' | head -1)
          chmod +x "$exe"
          "$exe" -m .shadow/llama-3.2-1b.gguf --host 127.0.0.1 --port 18081 -c 8192 -np 2 -t 4 >.shadow/model.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then ready=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then tail -70 .shadow/model.log; exit 1; fi
          ROOM_MODEL_URL=http://127.0.0.1:18081/completion python3 -u scripts/room_floor_production_wrapper_quick.py
      - name: Save publicly sourced comparison on research branch
        if: always()
        run: |
          test -s docs/research/room-floor-quick-model-v2-20261028.json
          git config user.name 'room-quick-probe'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/research/room-floor-quick-model-v2-20261028.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record short production 1B wrapper A/B'
          for i in 1 2 3 4 5; do
            git push origin HEAD:research/room-floor-continuity-20261028 && exit 0
            git fetch origin research/room-floor-continuity-20261028
            git rebase origin/research/room-floor-continuity-20261028 || { git rebase --abort; exit 1; }
            sleep "$i"
          done
          exit 1
