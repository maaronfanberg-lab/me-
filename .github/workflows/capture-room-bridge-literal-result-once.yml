name: Capture Room bridge literal result once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-room-bridge-literal-result-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Capture literal requested fields and assertion
        run: |
          set +e
          PYTHONPATH=scripts python3 - <<'PY' > /tmp/literal.txt 2>&1
          import json
          from pathlib import Path
          import room_private_commit_liveness_core as bridge
          minds=json.loads(Path('room/cognitive_state.json').read_text())
          state=json.loads(Path('room/state.json').read_text())
          topic=minds.get('topic_episode') if isinstance(minds,dict) else None
          print('TOPIC_EPISODE_PRESENT='+str(isinstance(topic,dict)))
          if not isinstance(topic,dict):
              raise AssertionError('room/cognitive_state.json has no topic_episode object')
          vocab=topic.get('previous_vocabulary')
          print('PREVIOUS_VOCABULARY_PRESENT='+str(isinstance(vocab,list)))
          if not isinstance(vocab,list) or not vocab:
              raise AssertionError('topic_episode.previous_vocabulary is missing or empty')
          requested={
            'topic_episode':{k:topic.get(k) for k in ('id','root','current_facet','focus_turns','status','bridge_pending','recent_terms')},
            'previous_vocabulary_count':len(vocab),
            'previous_vocabulary':vocab if len(vocab)<200 else None,
            'previous_vocabulary_recent_50':vocab[-50:] if len(vocab)>=200 else None,
            'bridge_pending':topic.get('bridge_pending'),
          }
          print('REQUESTED='+json.dumps(requested,ensure_ascii=False,separators=(',',':')))
          probe=dict(topic); probe['bridge_pending']=True; probe['status']='ready_to_bridge'; probe['bridge_reason']=probe.get('bridge_reason') or 'regression_probe'
          cycle=int(state.get('cycle',0))+1
          selected=bridge._bridge_safe_new_topic_from_terms(vocab[-50:],cycle,probe)
          root=selected.get('root')
          near_hits=[term for term in vocab if bridge._base._bounded_topic._near(root,term)]
          print(f"ASSERT selected_root_not_near_literal_previous_vocabulary root={root!r} near_hits={near_hits!r} vocabulary_count={len(vocab)}")
          assert root
          assert not near_hits, f'bridge selected root near literal previous_vocabulary: {near_hits!r}'
          print('PASS literal live previous_vocabulary bridge regression')
          PY
          rc=$?
          set -e
          { echo "EXIT_CODE=$rc"; cat /tmp/literal.txt; } > room/bridge-literal-result.txt
          cat room/bridge-literal-result.txt
      - name: Commit result and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add room/bridge-literal-result.txt
          git rm .github/workflows/capture-room-bridge-literal-result-once.yml
          git commit -m 'Record literal bridge regression result'
          for n in $(seq 1 12); do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          exit 1
