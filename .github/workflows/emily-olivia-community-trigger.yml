name: Trigger Emily Olivia Community

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/emily-olivia-community-trigger.yml'
      - '.github/workflows/emily-olivia-community-run.yml'
      - 'experiments/emily-olivia-society/*.py'
      - 'experiments/emily-olivia-society/*.sh'
      - 'experiments/emily-olivia-society/agents.json'
      - 'experiments/emily-olivia-society/upstreams.json'

concurrency:
  group: emily-olivia-community-trigger
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch-community:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Community runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One dispatch only; Community concurrency replaces stale runs.
          # A valid pending social message still takes precedence inside the runtime. If
          # checkpoint sanitation forces a clean restart, this gives Emily a concrete,
          # ordinary opener instead of pretending there is clean context to resume.
          gh workflow run emily-olivia-community-run.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f opener="Hey Olivia. How's your day going?"
