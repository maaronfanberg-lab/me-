name: Trigger Emily Olivia Community

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/emily-olivia-community-trigger.yml'
      - '.github/workflows/emily-olivia-community-run.yml'
      - 'experiments/emily-olivia-society/*.py'
      - 'experiments/emily-olivia-society/*.sh'
      - 'experiments/emily-olivia-society/agents.json'
      - 'experiments/emily-olivia-society/upstreams.json'

concurrency:
  group: emily-olivia-community-trigger
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  dispatch-community:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve current Community runtime or replace stale one
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/emily-olivia-community-run.yml/runs?per_page=30"
          active_lines="$(
            gh api --method GET "$runs_api" \
              --jq '.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | "\(.id) \(.head_sha) \(.status)"'
          )"

          stale_lines=""
          if [ -n "$active_lines" ]; then
            while read -r run_id head_sha status; do
              [ -n "${run_id:-}" ] || continue
              compare_status="$(
                gh api --method GET \
                  "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...${head_sha}" \
                  --jq '.status' 2>/dev/null || printf 'unknown'
              )"
              if [ "$compare_status" != "identical" ] && [ "$compare_status" != "ahead" ]; then
                stale_lines+="${run_id} ${head_sha} ${status}"$'\n'
              fi
            done <<< "$active_lines"
          fi

          if [ -n "$stale_lines" ]; then
            echo "Replacing stale Emily + Olivia Community run(s) so this relevant code change can take effect:"
            printf '%s' "$stale_lines"
            while read -r run_id head_sha status; do
              [ -n "${run_id:-}" ] || continue
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                --silent || true
            done <<< "$stale_lines"

            for attempt in $(seq 1 6); do
              stubborn=""
              while read -r run_id head_sha status; do
                [ -n "${run_id:-}" ] || continue
                live_status="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || printf 'completed')"
                if [ "$live_status" = "in_progress" ] || [ "$live_status" = "queued" ] || [ "$live_status" = "pending" ]; then
                  stubborn+="${run_id} ${head_sha} ${live_status}"$'\n'
                fi
              done <<< "$stale_lines"
              [ -z "$stubborn" ] && break
              sleep 5
            done

            if [ -n "${stubborn:-}" ]; then
              echo "Stale Community run(s) ignored graceful cancellation; force-cancelling only those runs:"
              printf '%s' "$stubborn"
              while read -r run_id head_sha status; do
                [ -n "${run_id:-}" ] || continue
                gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" \
                  --silent || true
              done <<< "$stubborn"
            fi

            for attempt in $(seq 1 12); do
              remaining_stale=0
              while read -r run_id head_sha status; do
                [ -n "${run_id:-}" ] || continue
                live_status="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' 2>/dev/null || printf 'completed')"
                if [ "$live_status" = "in_progress" ] || [ "$live_status" = "queued" ] || [ "$live_status" = "pending" ]; then
                  remaining_stale=$((remaining_stale + 1))
                fi
              done <<< "$stale_lines"
              [ "$remaining_stale" -eq 0 ] && break
              if [ "$attempt" -eq 12 ]; then
                echo "Stale Community runtime did not leave the active state after force-cancellation." >&2
                exit 1
              fi
              sleep 5
            done
          fi

          active_after="$(
            gh api --method GET "$runs_api" \
              --jq '.workflow_runs[] | select(.status == "in_progress" or .status == "queued" or .status == "pending") | "\(.id) \(.head_sha) \(.status)"'
          )"
          if [ -n "$active_after" ]; then
            echo "A current Emily + Olivia Community runtime already owns the slot; not creating a duplicate:"
            echo "$active_after"
            exit 0
          fi

          # A valid pending social message still takes precedence inside the runtime.
          # A clean state opens autonomously through the Stanford chain; no authored
          # default dialogue is supplied by the trigger.
          gh workflow run emily-olivia-community-run.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f opener=""
