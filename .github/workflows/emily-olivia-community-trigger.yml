name: Trigger Emily Olivia Community

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/emily-olivia-community-trigger.yml'
      - '.github/workflows/emily-olivia-community-run.yml'
      - 'experiments/emily-olivia-society/**'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-community:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Community runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run emily-olivia-community-run.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
