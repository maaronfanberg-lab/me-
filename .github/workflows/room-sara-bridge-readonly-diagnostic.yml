name: Room Sara bridge read-only diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-sara-bridge-readonly-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Read previous Sara bridge probe state
        env:
          ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
        run: |
          set +e
          token_json=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=room-live-mirror")
          token_rc=$?
          relay_token=$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))' 2>/dev/null)

          session_body=$(mktemp)
          curl -sS -o "$session_body" -w '%{http_code}' "${ROOM_RELAY_URL%/}/api/sara/session" > session_status.txt
          session_rc=$?
          session_status=$(cat session_status.txt)

          pending_body=$(mktemp)
          curl -sS -o "$pending_body" -w '%{http_code}' -H "Authorization: Bearer ${relay_token}" "${ROOM_RELAY_URL%/}/api/participant/pending" > pending_status.txt
          pending_rc=$?
          pending_status=$(cat pending_status.txt)

          feed_body=$(mktemp)
          curl -sS -o "$feed_body" -w '%{http_code}' "${ROOM_RELAY_URL%/}/api/feed?diag=${GITHUB_RUN_ID}" > feed_status.txt
          feed_rc=$?
          feed_status=$(cat feed_status.txt)

          SESSION_FILE="$session_body" PENDING_FILE="$pending_body" FEED_FILE="$feed_body" \
          TOKEN_RC="$token_rc" SESSION_RC="$session_rc" SESSION_STATUS="$session_status" \
          PENDING_RC="$pending_rc" PENDING_STATUS="$pending_status" FEED_RC="$feed_rc" FEED_STATUS="$feed_status" \
          python3 - <<'PY'
          import json, os
          def load(name):
              try: return json.load(open(os.environ[name]))
              except Exception: return None
          def integer(name):
              try: return int(os.environ[name])
              except Exception: return -1
          session=load('SESSION_FILE') or {}
          pending=load('PENDING_FILE') or {}
          feed=load('FEED_FILE') or {}
          probes=[]
          for turn in session.get('turns',[]):
              msg=(turn or {}).get('message') or {}
              text=str(msg.get('text') or '')
              if msg.get('speaker')=='sara' and text.startswith('Sara bridge probe '):
                  probes.append({'sequence':turn.get('sequence'),'message':msg})
          latest=probes[-1] if probes else None
          text=((latest or {}).get('message') or {}).get('text')
          pending_match=None
          feed_match=None
          if text:
              pending_match=next((m for m in pending.get('messages',[]) if m.get('speaker')=='sara' and m.get('text')==text),None)
              feed_match=next((m for m in ((feed.get('feed') or {}).get('conversation') or []) if m.get('speaker')=='sara' and m.get('text')==text),None)
          result={
              'checked_at':__import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat().replace('+00:00','Z'),
              'token_exit_code':integer('TOKEN_RC'),
              'session_http_status':os.environ.get('SESSION_STATUS'),
              'session_exit_code':integer('SESSION_RC'),
              'pending_http_status':os.environ.get('PENDING_STATUS'),
              'pending_exit_code':integer('PENDING_RC'),
              'feed_http_status':os.environ.get('FEED_STATUS'),
              'feed_exit_code':integer('FEED_RC'),
              'latest_probe':latest,
              'pending_match':pending_match,
              'feed_match':feed_match,
              'probe_count':len(probes),
          }
          os.makedirs('room',exist_ok=True)
          open('room/sara-room-readonly-diagnostic.json','w').write(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY

      - name: Persist diagnostic
        if: always()
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add room/sara-room-readonly-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Sara Room read-only diagnostic'
          for attempt in $(seq 1 12); do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          exit 1
