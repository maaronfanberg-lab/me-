name: Room Sara bridge read-only diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-sara-bridge-readonly-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify consumed Sara turn reached social cognition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path, default):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return default

          prior = load('room/sara-room-readonly-diagnostic.json', {})
          latest = (prior.get('latest_probe') or {}).get('message') or {}
          probe_text = str(latest.get('text') or '')
          feed_match = prior.get('feed_match') or {}
          source_id = str(feed_match.get('id') or '')

          conversation = load('room/conversation.json', [])
          minds = load('room/cognitive_state.json', {})
          ai = ('sarah', 'mara', 'owen', 'jules')
          entities = minds.get('entities') or {}
          observed_ids = {str(x) for x in (minds.get('participant_observation_ids') or [])}

          sara_index = None
          sara_message = None
          for i, message in enumerate(conversation):
              if not isinstance(message, dict):
                  continue
              if message.get('speaker') == 'sara' and str(message.get('text') or '') == probe_text:
                  sara_index = i
                  sara_message = message

          relationships = {}
          memory_matches = {}
          for name in ai:
              entity = entities.get(name) or {}
              rel = ((entity.get('people') or {}).get('sara') or {})
              relationships[name] = {
                  'present': bool(rel),
                  'observed_turns': int(rel.get('observed_turns') or 0),
                  'direct_turns': int(rel.get('direct_turns') or 0),
                  'last_direct_cycle': rel.get('last_direct_cycle'),
                  'exposure': rel.get('exposure'),
                  'direct_familiarity': rel.get('direct_familiarity'),
                  'warmth': rel.get('warmth'),
                  'reciprocity': rel.get('reciprocity'),
              }
              matches = []
              for memory in entity.get('room_memories') or []:
                  if not isinstance(memory, dict):
                      continue
                  if (source_id and str(memory.get('source') or '') == source_id) or (
                      probe_text and memory.get('speaker') == 'sara' and str(memory.get('text') or '') == probe_text
                  ):
                      matches.append(memory)
              memory_matches[name] = matches

          following_ai = []
          linked_ai = []
          if sara_index is not None:
              sara_discourse = str((sara_message or {}).get('discourse_id') or '')
              for message in conversation[sara_index + 1:]:
                  if not isinstance(message, dict):
                      continue
                  speaker = str(message.get('speaker') or '')
                  if speaker in ('allen', 'sara'):
                      break
                  if speaker not in ai:
                      continue
                  cognition = message.get('cognition') or {}
                  compact = {
                      'id': message.get('id'),
                      'speaker': speaker,
                      'text': message.get('text'),
                      'at': message.get('at'),
                      'target': cognition.get('target'),
                      'move_type': cognition.get('move_type'),
                      'parent_discourse_id': message.get('parent_discourse_id'),
                      'derived_from': message.get('derived_from'),
                      'discourse_id': message.get('discourse_id'),
                      'beat_id': message.get('beat_id') or cognition.get('beat_id'),
                  }
                  following_ai.append(compact)
                  if (
                      (sara_discourse and str(message.get('parent_discourse_id') or '') == sara_discourse)
                      or (source_id and str(message.get('derived_from') or '') == source_id)
                      or str(cognition.get('target') or '') == 'sara'
                  ):
                      linked_ai.append(compact)
                  if len(following_ai) >= 8:
                      break

          social_present_for_all = all(relationships[n]['present'] for n in ai)
          memories_present_for_all = all(bool(memory_matches[n]) for n in ai)
          observed_id_present = bool(source_id and source_id in observed_ids)
          consumed_in_conversation = sara_message is not None
          room_continued_after = bool(following_ai)

          result = {
              'checked_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'probe_text': probe_text,
              'source_id': source_id,
              'consumed_in_conversation': consumed_in_conversation,
              'participant_observation_id_present': observed_id_present,
              'sara_relationship_present_for_all': social_present_for_all,
              'sara_memory_present_for_all': memories_present_for_all,
              'relationships': relationships,
              'memory_matches': memory_matches,
              'following_ai': following_ai,
              'linked_ai': linked_ai,
              'room_continued_after_sara': room_continued_after,
              'pass': all((consumed_in_conversation, observed_id_present, social_present_for_all, memories_present_for_all, room_continued_after)),
          }
          Path('room/sara-room-cognition-final.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          if not result['pass']:
              raise SystemExit(1)
          PY

      - name: Persist final Sara cognition evidence
        if: always()
        run: |
          set -e
          [ -f room/sara-room-cognition-final.json ] || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add room/sara-room-cognition-final.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record final Sara Room cognition evidence'
          for attempt in $(seq 1 12); do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          exit 1
