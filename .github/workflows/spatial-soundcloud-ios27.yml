name: Spatial SoundCloud iOS 27 CI

on:
  push:
    branches:
      - feature/spatial-soundcloud-ios27-poc
    paths:
      - 'experiments/spatial-soundcloud-ios27/**'
      - 'cloudflare/spatial-soundcloud-auth/**'
      - '.github/workflows/spatial-soundcloud-ios27.yml'
  pull_request:
    paths:
      - 'experiments/spatial-soundcloud-ios27/**'
      - 'cloudflare/spatial-soundcloud-auth/**'
      - '.github/workflows/spatial-soundcloud-ios27.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios27-build-and-test:
    name: Xcode 27 compile + DSP tests
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun simctl list devices available | head -80

      - name: Install XcodeGen
        run: |
          set -euxo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: experiments/spatial-soundcloud-ios27
        run: |
          set -euxo pipefail
          xcodegen generate
          xcodebuild -list -project SpatialSoundCloud.xcodeproj

      - name: Build app for iOS 27 Simulator
        working-directory: experiments/spatial-soundcloud-ios27
        run: |
          set -o pipefail
          xcodebuild \
            -project SpatialSoundCloud.xcodeproj \
            -scheme SpatialSoundCloud \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee xcodebuild-build.log

      - name: Run DSP unit tests
        working-directory: experiments/spatial-soundcloud-ios27
        run: |
          set -o pipefail
          xcodebuild \
            -project SpatialSoundCloud.xcodeproj \
            -scheme SpatialSoundCloud \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild-test.log

      - name: Check OAuth Worker JavaScript syntax
        run: |
          set -euxo pipefail
          node --check cloudflare/spatial-soundcloud-auth/src/index.js

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-soundcloud-xcode27-logs
          path: |
            experiments/spatial-soundcloud-ios27/xcodebuild-build.log
            experiments/spatial-soundcloud-ios27/xcodebuild-test.log
          if-no-files-found: ignore
          retention-days: 7
