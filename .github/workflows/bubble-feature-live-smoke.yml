name: Keyless Coupled Bubble World

on:
  push:
    branches: [bubble-coupled-sim-v1]
    paths:
      - '.github/workflows/bubble-feature-live-smoke.yml'
      - 'bubble/**'
      - 'scripts/run_coupled_bubbles.py'
      - 'scripts/test_bubble_core.py'
      - 'scripts/test_coupled_bubbles.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keyless-coupled-bubble-world
  cancel-in-progress: true

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'

      - name: Validate single-bubble and coupled physics
        run: python -m unittest scripts.test_bubble_core scripts.test_coupled_bubbles

      - name: Run 12 communicating virtual bubble nodes
        run: |
          python scripts/run_coupled_bubbles.py \
            --nodes 12 --model km \
            --radius 1e-5 --radius-spread 0.02 --spacing 1e-3 \
            --drive-amplitude 1000 --drive-frequency 20000 \
            --end-time 5e-5 --macro-dt 2.5e-6 --min-macro-dt 7.8125e-8 \
            --max-corrections 4 --coupling-rel-tol 1e-3 \
            --coupling-abs-tol 0.5 --under-relaxation 0.65 --rtol 1e-8 \
            --output artifacts/coupled-bubble-world.json

      - name: Summarize coupled world
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/coupled-bubble-world.json')
          data = json.loads(p.read_text())
          hist = data.get('history', [])
          max_mach = max((x['max_wall_mach'] for x in hist), default=0.0)
          max_coupling = max((max(abs(v) for v in x['coupling_pressure_pa']) for x in hist), default=0.0)
          print('status:', data['status'])
          print('simulation_time:', data['simulation_time'])
          print('accepted_steps:', len(hist))
          print('rollbacks:', data['rollbacks'])
          print('max_wall_mach:', max_mach)
          print('max_abs_coupling_pressure_pa:', max_coupling)
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a') as f:
              f.write('## Keyless coupled bubble world\n')
              f.write(f"- Status: `{data['status']}`\n")
              f.write(f"- Virtual nodes: `{data['config']['node_count']}`\n")
              f.write(f"- Accepted macrosteps: `{len(hist)}`\n")
              f.write(f"- Rollbacks: `{data['rollbacks']}`\n")
              f.write(f"- Max wall Mach: `{max_mach:.6g}`\n")
              f.write(f"- Max |coupling pressure|: `{max_coupling:.6g} Pa`\n")
          if data['status'] not in {'complete', 'collapsed'}:
              raise SystemExit(2)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: coupled-bubble-world-${{ github.run_id }}
          path: artifacts/coupled-bubble-world.json
          retention-days: 30
