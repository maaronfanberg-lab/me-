name: Deploy project home to GitHub Pages

on:
  push:
    branches: [main, gev-live-flights-build-fix]
    paths-ignore:
      - 'room/*.json'
      - 'room/**/*.json'
      - 'society/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  # This repository receives frequent independent commits. Do not kill a valid
  # Pages build merely because a newer commit arrived while it was running.
  # GitHub still retains only the newest pending run for this concurrency group.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout newest ref
        uses: actions/checkout@v6

      - name: Bake newest Room snapshot when legacy launcher supports it
        run: |
          if grep -q '__ROOM_SNAPSHOT_B64__' apps/sarah-room.html; then
            python3 scripts/bake_room.py
          else
            echo 'Current Room launcher uses the live viewer; skipping legacy snapshot bake.'
          fi

      - name: Set up Node for Earth Signal
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Build live-only Earth Signal
        working-directory: cloudflare/gods-eye-view-mobile
        run: npm run build

      - name: Use stable keyless Earth basemap endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('cloudflare/gods-eye-view-mobile/dist/assets')
          old = 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
          new = 'https://wi.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer'
          changed = 0

          for p in root.glob('*.js'):
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  continue
              p.write_text(s.replace(old, new), encoding='utf-8')
              changed += 1

          if changed == 0:
              raise SystemExit('Earth Signal basemap patch seam not found')
          for p in root.glob('*.js'):
              if old in p.read_text(encoding='utf-8'):
                  raise SystemExit(f'Old Esri basemap endpoint still present in {p}')
          print(f'Patched Earth Signal basemap endpoint in {changed} bundle(s).')
          PY

      - name: Stage Earth Signal under Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/gods-eye-view-mobile
          mkdir -p apps/gods-eye-view-mobile
          cp -a cloudflare/gods-eye-view-mobile/dist/. apps/gods-eye-view-mobile/
          test -s apps/gods-eye-view-mobile/index.html

      - name: Rebase Earth Signal static paths for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('apps/gods-eye-view-mobile')
          base = '/me-/apps/gods-eye-view-mobile/'
          prefixes = ['assets/', 'cesium/', 'models/', 'mobile.css', 'manifest.webmanifest', 'sw.js', 'logo.svg', 'mic.svg', 'pin.svg', 'location.svg', 'visual-presets.svg']
          text_suffixes = {'.html', '.js', '.css', '.webmanifest', '.json'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_suffixes: continue
              try: s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              original = s
              for prefix in prefixes:
                  s = s.replace(f'"/{prefix}', f'"{base}{prefix}')
                  s = s.replace(f"'/{prefix}", f"'{base}{prefix}")
                  s = s.replace(f'url(/{prefix}', f'url({base}{prefix}')
              if s != original: p.write_text(s, encoding='utf-8')
          index = (root / 'index.html').read_text(encoding='utf-8')
          required = [base + 'assets/', base + 'mobile.css', base + 'manifest.webmanifest']
          missing = [x for x in required if x not in index]
          if missing: raise SystemExit(f'GitHub Pages path rebase incomplete: {missing}')
          PY

      - name: Verify Earth Signal source contract is bundled
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'api.adsb.lol/v2' apps/gods-eye-view-mobile/assets
          grep -R -q 'earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson' apps/gods-eye-view-mobile/assets
          grep -R -q 'wi.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer' apps/gods-eye-view-mobile/assets
          grep -Fq '[data-layer-id="traffic"]' apps/gods-eye-view-mobile/mobile.css
          grep -q 'USGS · ADSB.lol' apps/gods-eye-view-mobile/index.html
          if grep -R -q 'Street Traffic · Live/Simulated' apps/gods-eye-view-mobile; then
            echo 'Synthetic street-traffic presentation leaked into production bundle.'
            exit 1
          fi
          echo 'Verified Earth Signal: USGS earthquakes + ADSB.lol aircraft; synthetic street traffic disabled.'

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
