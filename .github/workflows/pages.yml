name: Deploy project home to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # Live Room data changes constantly and must not redeploy Pages every beat.
      - 'room/*.json'
      - 'room/**/*.json'
      - 'society/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout newest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Bake newest Room snapshot when legacy launcher supports it
        run: |
          if grep -q '__ROOM_SNAPSHOT_B64__' apps/sarah-room.html; then
            python3 scripts/bake_room.py
          else
            echo 'Current Room launcher uses the live viewer; skipping legacy snapshot bake.'
          fi

      - name: Set up Node for God's Eye View
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Build keyless God's Eye View mobile
        working-directory: cloudflare/gods-eye-view-mobile
        run: npm run build

      - name: Stage God's Eye View under Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/gods-eye-view-mobile
          mkdir -p apps/gods-eye-view-mobile
          cp -a cloudflare/gods-eye-view-mobile/dist/. apps/gods-eye-view-mobile/
          test -s apps/gods-eye-view-mobile/index.html
          echo 'Gods Eye View staged at /apps/gods-eye-view-mobile/'

      - name: Rebase God's Eye View static paths for GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('apps/gods-eye-view-mobile')
          base = '/me-/apps/gods-eye-view-mobile/'
          prefixes = [
              'assets/', 'cesium/', 'models/',
              'mobile.css', 'manifest.webmanifest', 'sw.js',
              'logo.svg', 'mic.svg', 'pin.svg', 'location.svg', 'visual-presets.svg'
          ]

          text_suffixes = {'.html', '.js', '.css', '.webmanifest', '.json'}
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in text_suffixes:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              for prefix in prefixes:
                  s = s.replace(f'"/{prefix}', f'"{base}{prefix}')
                  s = s.replace(f"'/{prefix}", f"'{base}{prefix}")
                  s = s.replace(f'url(/{prefix}', f'url({base}{prefix}')
              if s != original:
                  p.write_text(s, encoding='utf-8')

          index = (root / 'index.html').read_text(encoding='utf-8')
          required = [base + 'assets/', base + 'mobile.css', base + 'manifest.webmanifest']
          missing = [x for x in required if x not in index]
          if missing:
              raise SystemExit(f'GitHub Pages path rebase incomplete: {missing}')
          print('Rebased God\'s Eye View assets for GitHub Pages subpath.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
