name: Room Next clean-sheet check

on:
  pull_request:
    paths:
      - 'cloudflare/room-next/**'
      - '.github/workflows/room-next-check.yml'
      - '.github/workflows/deploy-room-next.yml'
  push:
    branches:
      - 'feat/room-next-clean-slate-20260821'
    paths:
      - 'cloudflare/room-next/**'
      - '.github/workflows/room-next-check.yml'
      - '.github/workflows/deploy-room-next.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: cloudflare/room-next
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install isolated Room Next dependencies
        run: npm install --no-audit --no-fund
      - name: Enforce clean-sheet architecture
        run: npm run check
      - name: Compile Worker without deploying
        run: npm run dry-run
