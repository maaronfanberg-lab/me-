name: Room cognition architecture smoke

on:
  pull_request:
    paths:
      - 'room/**'
      - 'scripts/room_engine.py'
      - 'scripts/room_engine_v5.py'
      - 'scripts/room_social_v5.py'
      - 'scripts/room_private_model.py'
      - 'scripts/room_personality_v2.py'
      - 'scripts/room_personality_v2_sim.py'
      - 'scripts/room_model_boundary_sim.py'
      - 'scripts/room_prompt_boundary_sim.py'
      - 'scripts/room_expression_quality.py'
      - 'scripts/room_expression_quality_sim.py'
      - 'scripts/room_cross_voice_novelty_sim.py'
      - 'scripts/room_retry_truncation_sim.py'
      - 'scripts/room_incomplete_tail_live_sim.py'
      - 'scripts/room_ai_adjacency_sim.py'
      - 'scripts/room_adjacency_wiring_sim.py'
      - 'scripts/room_live_echo_pipeline_sim.py'
      - 'scripts/room_semantic_epoch.py'
      - 'scripts/room_semantic_epoch_sim.py'
      - 'scripts/room_semantic_recovery_workflow_sim.py'
      - 'scripts/room_supervisor.py'
      - 'scripts/room_supervisor_sim.py'
      - 'scripts/room_topic_bounded.py'
      - 'scripts/room_topic_state_sim.py'
      - 'scripts/room_participant.py'
      - 'scripts/room_allen_response_sim.py'
      - 'scripts/room_allen_observation_sim.py'
      - 'scripts/room_allen_two_voice_sim.py'
      - '.github/workflows/sarah-society.yml'
      - '.github/workflows/room-semantic-recovery.yml'
      - '.github/workflows/room-supervisor.yml'
      - '.github/workflows/pages.yml'
      - '.github/workflows/room-architecture-smoke.yml'

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate research-informed 12-node / 48-process Room architecture
        run: |
          python3 -m py_compile scripts/room_engine_v5.py scripts/room_social_v5.py scripts/room_private_model.py scripts/room_personality_v2.py scripts/room_participant.py scripts/room_allen_observation_sim.py scripts/room_allen_two_voice_sim.py scripts/room_personality_v2_sim.py scripts/room_model_boundary_sim.py scripts/room_prompt_boundary_sim.py scripts/room_expression_quality.py scripts/room_expression_quality_sim.py scripts/room_cross_voice_novelty_sim.py scripts/room_retry_truncation_sim.py scripts/room_incomplete_tail_live_sim.py scripts/room_ai_adjacency_sim.py scripts/room_adjacency_wiring_sim.py scripts/room_live_echo_pipeline_sim.py scripts/room_semantic_epoch.py scripts/room_semantic_epoch_sim.py scripts/room_semantic_recovery_workflow_sim.py scripts/room_supervisor.py scripts/room_supervisor_sim.py scripts/room_topic_bounded.py scripts/room_topic_state_sim.py
          python3 scripts/room_engine_v5.py selftest
          python3 scripts/room_allen_response_sim.py
          python3 scripts/room_allen_observation_sim.py
          python3 scripts/room_allen_two_voice_sim.py
          python3 scripts/room_personality_v2_sim.py
          python3 scripts/room_model_boundary_sim.py
          python3 scripts/room_prompt_boundary_sim.py
          python3 scripts/room_expression_quality_sim.py
          python3 scripts/room_cross_voice_novelty_sim.py
          python3 scripts/room_retry_truncation_sim.py
          python3 scripts/room_incomplete_tail_live_sim.py
          python3 scripts/room_ai_adjacency_sim.py
          python3 scripts/room_adjacency_wiring_sim.py
          python3 scripts/room_live_echo_pipeline_sim.py
          python3 scripts/room_semantic_epoch_sim.py
          python3 scripts/room_semantic_recovery_workflow_sim.py
          python3 scripts/room_supervisor_sim.py
          python3 scripts/room_topic_state_sim.py
