name: Deploy Emily Olivia Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/emily-olivia-community/**'
      - 'experiments/emily-olivia-society/viewer.html'
      - '.github/workflows/deploy-emily-olivia-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-emily-olivia-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Normalize Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          raw="${CLOUDFLARE_API_TOKEN_RAW:-}"
          test -n "$raw" || { echo 'Missing CLOUDFLARE_API_TOKEN/CF_API_TOKEN'; exit 1; }
          token="$raw"
          token="${token#Bearer }"
          token="${token#bearer }"
          token="$(printf '%s' "$token" | tr -d '\r\n')"
          test -n "$token" || { echo 'Cloudflare token became empty after normalization'; exit 1; }
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Verify Wrangler authentication
        shell: bash
        run: npx --yes wrangler@latest whoami

      - name: Deploy Community viewer and Alex queue
        id: deploy
        working-directory: cloudflare/emily-olivia-community
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy 2>&1 | tee /tmp/emily-olivia-deploy.txt
          url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/emily-olivia-deploy.txt | tail -1)
          test -n "$url" || { echo 'Could not determine workers.dev URL'; cat /tmp/emily-olivia-deploy.txt; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed URL: $url"

      - name: Verify replay, Alex entrance, and retired generator
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 "$APP_URL/" | tee /tmp/viewer.html
          grep -q 'Read-only live view' /tmp/viewer.html
          curl -fsS --retry 8 --retry-delay 2 "$APP_URL/alex" | tee /tmp/alex.html
          grep -q 'Emily + Olivia + Alex' /tmp/alex.html
          grep -q 'Speak as Alex' /tmp/alex.html
          curl -fsS --retry 8 --retry-delay 2 "$APP_URL/state" | tee /tmp/state.json
          python3 -m json.tool /tmp/state.json >/dev/null
          code=$(curl -sS -o /tmp/start-retired.txt -w '%{http_code}' "$APP_URL/start")
          test "$code" = "410" || { echo "Expected retired /start to return 410, got $code"; exit 1; }
          grep -q 'Retired duplicate generator' /tmp/start-retired.txt

      - name: Summary
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "### Emily + Olivia Cloudflare Community" >> "$GITHUB_STEP_SUMMARY"
          echo "Live mirror of the persisted Stanford Community replay plus the private Alex human-participant queue." >> "$GITHUB_STEP_SUMMARY"
          echo "No independent Cloudflare conversation generator is started." >> "$GITHUB_STEP_SUMMARY"
          echo "Viewer: $APP_URL/" >> "$GITHUB_STEP_SUMMARY"
          echo "Alex entrance: $APP_URL/alex" >> "$GITHUB_STEP_SUMMARY"
          echo "Snapshot: $APP_URL/state" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact stream: $APP_URL/stream" >> "$GITHUB_STEP_SUMMARY"
