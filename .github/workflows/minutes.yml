name: The Minutes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: the-minutes
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record next minute
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
        run: python minutes_secretary.py

      - name: Commit minute
        run: |
          git config user.name "minutes-secretary"
          git config user.email "minutes-secretary@users.noreply.github.com"
          git add minutes/minutes.md minutes/state.json
          git diff --cached --quiet && exit 0
          git commit -m "minutes: record next item"
          git pull --rebase origin main
          git push origin HEAD:main
