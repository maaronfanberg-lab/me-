name: Run Room bridge live regression on main once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-room-bridge-live-main-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Run exact live regression
        run: |
          set +e
          PYTHONPATH=scripts python3 scripts/room_bridge_live_vocabulary_sim.py > /tmp/bridge-main.txt 2>&1
          rc=$?
          set -e
          {
            echo "EXIT_CODE=$rc"
            cat /tmp/bridge-main.txt
          } > room/bridge-live-main-test.txt
          cat room/bridge-live-main-test.txt
          test "$rc" -eq 0
      - name: Commit evidence and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add room/bridge-live-main-test.txt
          git rm .github/workflows/run-room-bridge-live-main-once.yml
          git commit -m 'Record bridge live-vocabulary regression on main'
          for n in $(seq 1 12); do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep 2
          done
          exit 1
