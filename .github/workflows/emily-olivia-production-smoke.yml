name: Emily Olivia Production Smoke

on:
  push:
    paths:
      - .github/workflows/emily-olivia-production-smoke.yml

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENTSOCIETY_LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache Community runtime
        uses: actions/cache@v4
        with:
          path: |
            experiments/emily-olivia-society/.venv-agentsociety
            experiments/emily-olivia-society/.venv-stanford
            experiments/emily-olivia-society/vendor
            experiments/emily-olivia-society/.bootstrap-ready-v2
          key: community-runtime-${{ runner.os }}-py311-${{ hashFiles('experiments/emily-olivia-society/bootstrap_upstreams.sh', 'experiments/emily-olivia-society/upstreams.json') }}
      - name: Require model secret
        run: |
          test -n "$OPENAI_API_KEY"
      - name: Bootstrap pinned research code
        working-directory: experiments/emily-olivia-society
        run: bash bootstrap_upstreams.sh
      - name: Restore latest production checkpoint
        working-directory: experiments/emily-olivia-society
        env:
          COMMUNITY_WORKFLOW_FILE: emily-olivia-community-run.yml
          COMMUNITY_ARTIFACT_NAME: emily-olivia-community-results
        run: bash restore_latest_checkpoint.sh
      - name: Initialize cognition
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python init_cognition.py
      - name: Run 60-second production smoke session
        working-directory: experiments/emily-olivia-society
        run: |
          .venv-stanford/bin/python community_session.py \
            --run \
            --continuous-seconds 60 \
            --turn-delay-seconds 5 \
            --opener "Production smoke test continuation."
      - name: Verify persistence and reflection
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python persistence_reflection.py --run
      - name: Generate observer summary
        working-directory: experiments/emily-olivia-society
        run: python3 observer.py --summary > replay/observer.json
      - name: Upload smoke results
        uses: actions/upload-artifact@v4
        with:
          name: emily-olivia-production-smoke-results
          path: |
            experiments/emily-olivia-society/replay/
            experiments/emily-olivia-society/workspaces/
          if-no-files-found: error
