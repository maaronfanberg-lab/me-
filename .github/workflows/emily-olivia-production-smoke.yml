name: Emily Olivia Production Smoke

on:
  push:
    paths:
      - .github/workflows/emily-olivia-production-smoke.yml

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AGENTSOCIETY_LLM_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: |
            experiments/emily-olivia-society/.venv-agentsociety
            experiments/emily-olivia-society/.venv-stanford
            experiments/emily-olivia-society/vendor
            experiments/emily-olivia-society/.bootstrap-ready-v2
          key: community-runtime-${{ runner.os }}-py311-${{ hashFiles('experiments/emily-olivia-society/bootstrap_upstreams.sh', 'experiments/emily-olivia-society/upstreams.json') }}
      - name: Bootstrap
        working-directory: experiments/emily-olivia-society
        run: bash bootstrap_upstreams.sh
      - name: Direct OpenAI model probe
        working-directory: experiments/emily-olivia-society
        run: |
          .venv-stanford/bin/python - <<'PY'
          import os
          import openai
          client = openai.OpenAI(api_key=os.environ["OPENAI_API_KEY"])
          try:
              response = client.chat.completions.create(
                  model="gpt-4o",
                  messages=[{"role": "user", "content": "Reply with exactly: model-ok"}],
                  max_tokens=20,
              )
              print("MODEL_PROBE:", response.choices[0].message.content)
          except Exception as exc:
              print("MODEL_PROBE_ERROR:", type(exc).__name__, str(exc))
              raise
          PY
      - name: Restore checkpoint
        working-directory: experiments/emily-olivia-society
        env:
          COMMUNITY_WORKFLOW_FILE: emily-olivia-community-run.yml
          COMMUNITY_ARTIFACT_NAME: emily-olivia-community-results
        run: bash restore_latest_checkpoint.sh
      - name: Initialize cognition
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python init_cognition.py
      - name: Verify actual model dialogue
        working-directory: experiments/emily-olivia-society
        run: .venv-stanford/bin/python community_session.py --run --turns 2 --opener "Olivia, tell me one unusual thing you noticed today."
