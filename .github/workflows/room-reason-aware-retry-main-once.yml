name: Repair Room reason-aware expression retry once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-reason-aware-retry-main-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply guarded reason-aware retry repair
        run: python3 scripts/room_reason_aware_retry_repair.py

      - name: Verify reason-aware retry and Room invariants
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/room_engine_v5.py scripts/room_private_model.py
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'scripts')
          import room_engine_v5 as room

          guidance = room._expression_retry_guidance
          assert 'Do not reuse any complete sentence' in guidance('same_beat_sentence_copy')
          assert 'Change the underlying contribution' in guidance('same_beat_semantic_coverage')
          assert 'Change the underlying contribution' in guidance('same_beat_restatement_sentence')
          assert 'without recapping it' in guidance('duplicate_context')
          assert 'complete valid JSON object' in guidance('Unterminated string starting at: line 1 column 47')

          captured=[]
          originals={
              'compact': room._private_model._compact_payload,
              'request': room._private_model._request,
              'extract': room._private_model._extract_json,
              'validate': room._private_model._validate,
              'sanitize': room._private_model._sanitize_expression,
              'quality': room._expression_quality.quality_issue,
          }
          old_prompt=os.environ.get('ROOM_NODE_PROMPT')
          old_url=os.environ.get('ROOM_MODEL_URL')
          try:
              os.environ['ROOM_NODE_PROMPT']='enabled'
              os.environ['ROOM_MODEL_URL']='http://unused'
              room._private_model._compact_payload=lambda payload, role, self_entity=None: {'entity': payload.get('entity','sarah')}
              def fake_request(model_url,prompt,role,temperature,timeout,self_entity=None,attempt=0):
                  captured.append(prompt)
                  return '{"utterance":"fresh point"}'
              room._private_model._request=fake_request
              room._private_model._extract_json=lambda raw: {'utterance':'fresh point'}
              room._private_model._validate=lambda role,obj,compact,prompt,self_entity=None: obj
              room._private_model._sanitize_expression=lambda obj,compact,self_entity=None: obj
              outcomes=iter(['same_beat_sentence_copy',None])
              room._expression_quality.quality_issue=lambda utterance,compact,self_entity,similarity: next(outcomes)
              result=room._private_run('expression',{'entity':'sarah'},timeout=1)
              assert result == {'utterance':'fresh point'}, result
              assert len(captured) == 2, captured
              assert 'RETRY CONTROL:' not in captured[0], captured[0]
              assert 'Do not reuse any complete sentence' in captured[1], captured[1]
              assert 'same_beat_sentence_copy' not in captured[1], captured[1]
              print('PASS: rejected expression receives reason-aware retry control')
          finally:
              room._private_model._compact_payload=originals['compact']
              room._private_model._request=originals['request']
              room._private_model._extract_json=originals['extract']
              room._private_model._validate=originals['validate']
              room._private_model._sanitize_expression=originals['sanitize']
              room._expression_quality.quality_issue=originals['quality']
              if old_prompt is None: os.environ.pop('ROOM_NODE_PROMPT',None)
              else: os.environ['ROOM_NODE_PROMPT']=old_prompt
              if old_url is None: os.environ.pop('ROOM_MODEL_URL',None)
              else: os.environ['ROOM_MODEL_URL']=old_url

          assert 'sara' in room.ORDER
          assert 'allen' in room.ORDER
          assert len(tuple(room.ORDER)) == 4
          assert tuple(room.PARTICIPANTS)[-2:] == ('allen','sara')
          print('PASS: Sara remains participant-only; autonomous ORDER remains four')
          PY
          python3 scripts/room_retry_truncation_sim.py
          python3 scripts/room_expression_quality_sim.py
          python3 scripts/room_engine_v5.py selftest
          git diff --check

      - name: Publish repair and restart exactly one Room runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/room_engine_v5.py
          git rm .github/workflows/room-reason-aware-retry-main-once.yml
          git rm scripts/room_reason_aware_retry_repair.py
          git diff --cached --check
          git commit -m 'Make Room expression retries reason-aware'
          pushed=0
          for n in 1 2 3 4; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          test "$pushed" -eq 1
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 10 --json databaseId --jq '.[].databaseId'); do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done
          sleep 3
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
