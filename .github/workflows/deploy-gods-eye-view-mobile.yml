name: Deploy God's Eye View Mobile

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare/gods-eye-view-mobile/**'
      - '.github/workflows/deploy-gods-eye-view-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-gods-eye-view-mobile
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      OPENSKY_AUTH_MODE: anon
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN/CF_API_TOKEN'; exit 1; }
          echo 'Cloudflare token is available. Google credentials are not required.'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Verify Wrangler authentication
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest whoami

      - name: Build keyless mobile app
        working-directory: cloudflare/gods-eye-view-mobile
        run: npm run build

      - name: Ensure Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@latest pages project list 2>&1 | tee /tmp/pages-list.txt | grep -q 'gods-eye-view-mobile'; then
            echo 'Cloudflare Pages project already exists.'
          else
            npx --yes wrangler@latest pages project create gods-eye-view-mobile --production-branch main
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy cloudflare/gods-eye-view-mobile/dist \
            --project-name gods-eye-view-mobile \
            --branch main \
            --commit-dirty=true 2>&1 | tee /tmp/gev-deploy.txt
          url=$(grep -Eo 'https://[^[:space:]]+\.pages\.dev' /tmp/gev-deploy.txt | tail -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed URL: $url"

      - name: Verify live phone app
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 2 "$APP_URL/" -o /tmp/index.html
          grep -q 'apple-mobile-web-app-capable' /tmp/index.html
          grep -q 'manifest.webmanifest' /tmp/index.html
          curl -fsS --retry 5 --retry-delay 2 "$APP_URL/mobile.css" -o /tmp/mobile.css
          test -s /tmp/mobile.css
          echo "Verified live keyless mobile app at $APP_URL"

      - name: Summary
        env:
          APP_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "### God's Eye View Mobile deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Map: keyless OpenStreetMap + Re:Earth terrain" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
