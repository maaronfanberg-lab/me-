name: RESONATOR QA

# Runs the RESONATOR proofs on every change to the instrument or its tests. Every check runs even if
# an earlier one fails, and each check's full output is pushed to the branch qa-results/qa (the
# workspace that builds RESONATOR cannot download Actions logs). Pushes made with GITHUB_TOKEN start
# no other workflow.
on:
  push:
    paths:
      - 'apps/resonator.html'
      - 'apps/resonator-next.html'
      - 'qa-resonator/**'
      - '.github/workflows/resonator-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resonator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash   # -eo pipefail: a check piped through tee still fails when it fails
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (Python) and Chromium
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
          mkdir -p qa-out
          git fetch -q --depth=1 origin 4d9404e8d63176c1e1e8ee5e50c494bc4a1fa84f 969aac50dcc8daa40e44c0acc07effb314c09986 || true
      - name: Learning-path claims — live page
        id: claims_live
        continue-on-error: true
        run: node qa-resonator/learn_claims.mjs 2>&1 | tee qa-out/claims_live.txt
      - name: Learning-path claims — preview page
        id: claims_prev
        continue-on-error: true
        run: RESONATOR_SRC=apps/resonator-next.html node qa-resonator/learn_claims.mjs 2>&1 | tee qa-out/claims_preview.txt
      - name: Stage 1 engine proofs (bit-identical audio, async tuning, octave trap)
        id: s1v
        continue-on-error: true
        run: node qa-resonator/stage1_verify.mjs 2>&1 | tee qa-out/stage1_verify.txt
      - name: Stage 1 browser checks (audio-thread stalls, shapes, fallbacks, Copy report)
        id: s1b
        continue-on-error: true
        run: python qa-resonator/stage1_browser.py . 2>&1 | tee qa-out/stage1_browser.txt
      - name: Stage 2 browser checks (add/delete masses, undo across shape changes, presets, mics)
        id: s2b
        continue-on-error: true
        run: python qa-resonator/stage2_browser.py . 2>&1 | tee qa-out/stage2_browser.txt
      - name: Stage 3 levels (plectrum, oscillator, wind, mic vs mallet; pitch; onset; no NaN)
        id: s3m
        continue-on-error: true
        run: node qa-resonator/stage3_measure.mjs --check 2>&1 | tee qa-out/stage3_measure.txt
      - name: Stage 3 browser checks (exciters, hold-to-sustain, wind, Mic in with a fake microphone)
        id: s3b
        continue-on-error: true
        run: python qa-resonator/stage3_browser.py . 2>&1 | tee qa-out/stage3_browser.txt
      - name: Stage 4 engine proofs (extra mics, pan isolation, worst-case ceiling, level)
        id: s4v
        continue-on-error: true
        run: node qa-resonator/stage4_verify.mjs 2>&1 | tee qa-out/stage4_verify.txt
      - name: Stage 4 browser checks (Mics 2–4, undo, pin, net-zero edits, presets)
        id: s4b
        continue-on-error: true
        run: python qa-resonator/stage4_browser.py . 2>&1 | tee qa-out/stage4_browser.txt
      - name: Stage 5 engine proofs (envelopes, followers, Depth 0, LFOs unchanged)
        id: s5v
        continue-on-error: true
        run: node qa-resonator/stage5_verify.mjs 2>&1 | tee qa-out/stage5_verify.txt
      - name: Stage 5 browser checks (modulator types by taps, meters, fake phone mic, presets)
        id: s5b
        continue-on-error: true
        run: python qa-resonator/stage5_browser.py . 2>&1 | tee qa-out/stage5_browser.txt
      - name: P1 engine proofs (sleep off bit-identical, sleep bound, governor, CPU estimate)
        id: p1v
        continue-on-error: true
        run: P1_SKIP_COST=1 node qa-resonator/p1_verify.mjs 2>&1 | tee qa-out/p1_verify.txt
      - name: P1 browser checks (CPU shown, governor, sleeping voices, Copy report)
        id: p1b
        continue-on-error: true
        run: python qa-resonator/p1_browser.py . 2>&1 | tee qa-out/p1_browser.txt
      - name: Stage F engine proofs (reverb off bit-identical, measured T60, tone, level, Hush)
        id: f1v
        continue-on-error: true
        run: F1_SKIP_COST=1 node qa-resonator/f1_verify.mjs 2>&1 | tee qa-out/f1_verify.txt
      - name: Stage F browser checks (FX tab, taps, audible tail, shape change, presets)
        id: f1b
        continue-on-error: true
        run: python qa-resonator/f1_browser.py . 2>&1 | tee qa-out/f1_browser.txt
      - name: Tap controls — preview page
        id: taps
        continue-on-error: true
        run: python qa-resonator/ui_test.py . qa-out/ui-preview.png apps/resonator-next.html 2>&1 | tee qa-out/ui_test.txt
      - name: Publish results to branch qa-results/qa
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOMES: >-
            claims_live=${{ steps.claims_live.outcome }} claims_prev=${{ steps.claims_prev.outcome }}
            s1v=${{ steps.s1v.outcome }} s1b=${{ steps.s1b.outcome }} s2b=${{ steps.s2b.outcome }}
            s3m=${{ steps.s3m.outcome }} s3b=${{ steps.s3b.outcome }} s4v=${{ steps.s4v.outcome }}
            s4b=${{ steps.s4b.outcome }} s5v=${{ steps.s5v.outcome }} s5b=${{ steps.s5b.outcome }}
            p1v=${{ steps.p1v.outcome }} p1b=${{ steps.p1b.outcome }} f1v=${{ steps.f1v.outcome }}
            f1b=${{ steps.f1b.outcome }} taps=${{ steps.taps.outcome }}
        run: |
          mkdir -p qa-out
          echo "${{ github.sha }}" > qa-out/commit.txt
          echo "$OUTCOMES" | tr ' ' '\n' | grep . > qa-out/outcomes.txt
          cd qa-out
          git init -q
          git checkout -q -b results
          git add -A
          git -c user.name=resonator-qa -c user.email=actions@users.noreply.github.com commit -qm "QA ${{ github.sha }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:refs/heads/qa-results/qa
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonator-qa-out
          path: qa-out/
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce the result (every check must pass)
        if: always()
        run: |
          cat qa-out/outcomes.txt
          ! grep -q '=failure' qa-out/outcomes.txt
