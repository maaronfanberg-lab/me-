name: RESONATOR QA

# Runs the RESONATOR proofs on every change to the instrument or its tests, so a phone-only
# problem can be debugged from the results here. Results: Actions tab → "RESONATOR QA".
on:
  push:
    paths:
      - 'apps/resonator.html'
      - 'apps/resonator-next.html'
      - 'qa-resonator/**'
      - '.github/workflows/resonator-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resonator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (Python) and Chromium
        run: |
          python -m pip install --quiet playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Learning-path claims — live page
        run: node qa-resonator/learn_claims.mjs
      - name: Learning-path claims — preview page
        if: hashFiles('apps/resonator-next.html') != ''
        run: RESONATOR_SRC=apps/resonator-next.html node qa-resonator/learn_claims.mjs
      - name: Stage 1 engine proofs (bit-identical audio, async tuning, octave trap)
        if: hashFiles('apps/resonator-next.html') != ''
        run: node qa-resonator/stage1_verify.mjs
      - name: Stage 1 browser checks (audio-thread stalls, shapes, fallbacks, Copy report)
        if: hashFiles('apps/resonator-next.html') != ''
        run: python qa-resonator/stage1_browser.py .
      - name: Stage 2 browser checks (add/delete masses, undo across shape changes, presets, mics)
        if: hashFiles('apps/resonator-next.html') != ''
        run: python qa-resonator/stage2_browser.py .
      - name: Stage 3 levels (plectrum, oscillator, wind, mic vs mallet; pitch; onset; no NaN)
        if: hashFiles('apps/resonator-next.html') != ''
        run: node qa-resonator/stage3_measure.mjs --check
      - name: Stage 3 browser checks (exciters, hold-to-sustain, wind, Mic in with a fake microphone)
        if: hashFiles('apps/resonator-next.html') != ''
        run: python qa-resonator/stage3_browser.py .
      - name: Stage 4 engine proofs (extra mics, pan isolation, worst-case ceiling, level)
        if: hashFiles('apps/resonator-next.html') != ''
        run: node qa-resonator/stage4_verify.mjs
      - name: Stage 4 browser checks (Mics 2–4, undo, pin, net-zero edits, presets)
        if: hashFiles('apps/resonator-next.html') != ''
        run: python qa-resonator/stage4_browser.py .
      - name: Stage 5 engine proofs (envelopes, followers, Depth 0, LFOs unchanged)
        if: hashFiles('apps/resonator-next.html') != ''
        run: node qa-resonator/stage5_verify.mjs
      - name: Stage 5 browser checks (modulator types by taps, meters, fake phone mic, presets)
        if: hashFiles('apps/resonator-next.html') != ''
        run: python qa-resonator/stage5_browser.py .
      - name: P1 engine proofs (sleep off bit-identical, sleep bound, governor, CPU estimate)
        if: hashFiles('apps/resonator-next.html') != ''
        run: |
          git fetch -q --depth=1 origin 4d9404e8d63176c1e1e8ee5e50c494bc4a1fa84f
          P1_SKIP_COST=1 node qa-resonator/p1_verify.mjs
      - name: P1 browser checks (CPU shown, governor, sleeping voices, Copy report)
        if: hashFiles('apps/resonator-next.html') != ''
        run: python qa-resonator/p1_browser.py .
      - name: Tap controls — preview page
        if: hashFiles('apps/resonator-next.html') != ''
        run: python qa-resonator/ui_test.py . ui-preview.png apps/resonator-next.html
      - name: Keep the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resonator-qa-screens
          path: ui-preview.png
          if-no-files-found: ignore
