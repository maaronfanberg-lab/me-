name: One-shot Room semantic branch repair

on:
  push:
    branches: [main]
    paths:
      - 'society/room-semantic-repair-kick.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/room-publish-semantic-coverage-20260821
          fetch-depth: 0
      - name: Patch and verify publish semantic coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/room_expression_quality.py')
          text = path.read_text()
          if 'def _same_beat_aggregate_echo(' not in text:
              marker = '''def _low_substantive_novelty(utterance: str, prior_turns: list[dict]) -> bool:\n'''
              insert = '''_PUBLISH_GARNISH = {\n    "hey", "exactly", "truly", "special", "interest", "fresh", "like",\n    "together", "first", "latest", "start", "use", "create", "creat",\n    "let", "let'", "we've", "here'", "that'", "i'd", "past", "few", "week",\n    "closer", "step", "take", "last", "since", "also", "consider",\n    "addition", "power", "powerful",\n}\n\n\ndef _publish_anchor_tokens(text: object) -> set[str]:\n    \"\"\"Semantic anchors for the irreversible publish boundary.\n\n    Stylistic/evaluative garnish does not count as a new proposition. Normalize\n    common split compounds so a model cannot manufacture novelty by respacing.\n    \"\"\"\n    normalized = re.sub(r"\\btest\\s+bed\\b", "testbed", str(text or ""), flags=re.I)\n    return {word for word in _anchor_tokens(normalized) if word not in _PUBLISH_GARNISH}\n\n\ndef _same_beat_aggregate_echo(utterance: str, prior_turns: list[dict]) -> bool:\n    \"\"\"Reject long turns that mostly recombine already-staged semantics.\n\n    Sentence-level checks catch copying; this catches multi-sentence paraphrase\n    mosaics such as live cycle 4777, where each sentence changed wording but the\n    same chart/test-bed/diverse-sound proposition survived across voices.\n    \"\"\"\n    if not prior_turns:\n        return False\n    current = _publish_anchor_tokens(utterance)\n    if len(current) < 6:\n        return False\n    prior: set[str] = set()\n    for turn in prior_turns:\n        prior.update(_publish_anchor_tokens(turn.get("text")))\n    overlap = current & prior\n    coverage = len(overlap) / max(1, len(current))\n    if len(overlap) >= 8 and coverage >= 0.68:\n        return True\n    if len(prior_turns) >= 2 and len(overlap) >= 10 and coverage >= 0.60:\n        return True\n    return False\n\n\n'''
              if marker not in text:
                  raise SystemExit('novelty marker not found')
              text = text.replace(marker, insert + marker, 1)

              marker2 = '''    if _same_beat_restatement_sentence(text, turns):\n        return "same_beat_restatement_sentence"\n    if _low_substantive_novelty(text, turns):\n'''
              replacement2 = '''    if _same_beat_restatement_sentence(text, turns):\n        return "same_beat_restatement_sentence"\n    if _same_beat_aggregate_echo(text, turns):\n        return "same_beat_semantic_coverage"\n    if _low_substantive_novelty(text, turns):\n'''
              if marker2 not in text:
                  raise SystemExit('same-beat marker not found')
              text = text.replace(marker2, replacement2, 1)
              path.write_text(text)
          PY

          python3 -m py_compile scripts/room_expression_quality.py scripts/room_private_commit.py scripts/room_publish_quality_sim.py
          python3 scripts/room_publish_quality_sim.py

          git config user.name "room-repair"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/room_expression_quality.py
          git diff --cached --quiet && exit 0
          git commit -m "Require substantive semantic novelty before Room publish"
          git push origin HEAD:fix/room-publish-semantic-coverage-20260821
