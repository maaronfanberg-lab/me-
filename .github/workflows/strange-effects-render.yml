name: Strange Effects render

# Searches a formula for chaos (or takes a built-in system), plays it through the Strange Effects engine,
# and publishes the video, sound and report under apps/strange-effects/renders/ on the GitHub Pages site.

on:
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula or system of equations (leave empty to use a system)"
        required: false
        default: ""
      system:
        description: "Built-in system, used when the formula is empty (e.g. Fibonacci ring, Cavity, Lorenz-84)"
        required: false
        default: "Fibonacci ring"
      label:
        description: "Name for this render"
        required: false
        default: ""
      tone:
        description: "Tone"
        type: choice
        options: [gentle, gilmour, strange]
        default: gentle
      particles:
        description: "Particles (1 to 128)"
        required: false
        default: "4"
      space:
        description: "Space"
        type: choice
        options: [room, hall, cathedral]
        default: hall
      seconds:
        description: "Length in seconds (10 to 600)"
        required: false
        default: "120"

permissions:
  contents: write
  actions: write

concurrency:
  group: strange-effects-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SE_FORMULA: ${{ inputs.formula }}
      SE_SYSTEM: ${{ inputs.system }}
      SE_LABEL: ${{ inputs.label }}
      SE_TONE: ${{ inputs.tone }}
      SE_PARTICLES: ${{ inputs.particles }}
      SE_SPACE: ${{ inputs.space }}
      SE_SECONDS: ${{ inputs.seconds }}
      SE_OUT: ${{ github.workspace }}/se-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install numpy==2.5.3 pillow==12.3.0
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - name: Search and play
        working-directory: apps/strange-effects/render
        run: |
          python3 mkengine.py
          node run.js
      - name: Draw frames and encode
        if: ${{ hashFiles('se-out/status.txt') != '' }}
        working-directory: apps/strange-effects/render
        run: |
          set -e
          if [ "$(cat "$SE_OUT/status.txt")" != "ok" ]; then echo "No attractor to render."; exit 0; fi
          FR=$(wc -l < "$SE_OUT/frames.jsonl")
          seq 0 900 $((FR-1)) | xargs -P "$(nproc)" -I{} sh -c 'python3 frames.py chunk {} $(( {} + 900 ))'
          ls "$SE_OUT"/part_*.mp4 | sort | sed "s/.*/file '&'/" > "$SE_OUT/list.txt"
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i "$SE_OUT/list.txt" -c copy "$SE_OUT/v.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$SE_OUT/v.mp4" -i "$SE_OUT/audio.wav" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart "$SE_OUT/video.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$SE_OUT/audio.wav" -codec:a libmp3lame -b:a 192k "$SE_OUT/audio.mp3"
          ffmpeg -hide_banner -nostats -i "$SE_OUT/audio.wav" -af ebur128=peak=true -f null - 2>&1 | grep -E "I:|Peak:" | tail -2 | tr -s ' ' | sed 's/^/Loudness check: /' >> "$SE_OUT/report.md"
          ls -la "$SE_OUT"
      - name: Publish to the site
        run: |
          set -e
          NAME="${SE_LABEL:-${SE_SYSTEM}}"; [ -n "$SE_FORMULA" ] && [ -z "$SE_LABEL" ] && NAME="formula"
          SLUG=$(echo "$NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\+/-/g; s/^-//; s/-$//')-${{ github.run_id }}
          D="apps/strange-effects/renders/$SLUG"; mkdir -p "$D"
          cp "$SE_OUT/report.md" "$D/"; [ -f "$SE_OUT/spec.json" ] && cp "$SE_OUT/spec.json" "$D/" || true
          OK=false; if [ -f "$SE_OUT/video.mp4" ]; then cp "$SE_OUT/video.mp4" "$SE_OUT/audio.mp3" "$D/"; OK=true; fi
          printf '{"title":"%s","when":"%s","ok":%s}\n' "$(echo "$NAME" | sed 's/"/\\"/g')" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$OK" > "$D/meta.json"
          python3 apps/strange-effects/render/index.py
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add "$D" apps/strange-effects/renders/index.html
          git commit -q -m "Strange Effects render: $NAME (run ${{ github.run_id }})"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && { echo "published $D"; exit 0; }; sleep $((i * 4)); done
          echo "PUSH FAILED"; exit 1
      - name: Rebuild the site
        # commits made with the workflow token do not start other workflows on their own; a dispatch does
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches -f ref=main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strange-effects-render
          path: |
            se-out/report.md
            se-out/video.mp4
            se-out/audio.mp3
          retention-days: 14
