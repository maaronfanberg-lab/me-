name: Pocket Spatial Falcon Native Review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pocket-spatial-falcon-native-review.yml'
      - 'ios/PocketSpatialNative/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  COMMUNITY_BITNET_ROOT: ${{ github.workspace }}/experiments/emily-olivia-society/vendor/BitNet
  COMMUNITY_BITNET_MODEL: ${{ github.workspace }}/experiments/emily-olivia-society/models/Falcon3-10B-Instruct-1.58bit/ggml-model-i2_s.gguf
  COMMUNITY_BITNET_PORT: '8080'
  COMMUNITY_BITNET_START_TIMEOUT: '1200'
  COMMUNITY_GENERATION_TIMEOUT: '180'

jobs:
  falcon-review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Community Falcon runtime
        id: bitnet-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            experiments/emily-olivia-society/.venv-agentsociety
            experiments/emily-olivia-society/.venv-stanford
            experiments/emily-olivia-society/vendor
            experiments/emily-olivia-society/models
            experiments/emily-olivia-society/.bootstrap-ready-v12
          key: community-runtime-bitnet-v12-${{ runner.os }}-py311-${{ hashFiles('experiments/emily-olivia-society/bootstrap_upstreams.sh', 'experiments/emily-olivia-society/patch_stanford_local.py', 'experiments/emily-olivia-society/upstreams.json') }}
          restore-keys: |
            community-runtime-bitnet-v12-${{ runner.os }}-py311-

      - name: Bootstrap same Falcon 10B runtime used by Community
        working-directory: experiments/emily-olivia-society
        run: timeout 65m bash bootstrap_upstreams.sh

      - name: Start Falcon 10B BitNet server
        working-directory: experiments/emily-olivia-society
        run: |
          timeout 20m python3 bitnet_server.py start
          python3 bitnet_server.py status

      - name: Ask Falcon to solve native iPhone installation and test path
        working-directory: experiments/emily-olivia-society
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from bitnet_server import request_chat

          root = Path('../..')
          wanted = [
              root / 'ios/PocketSpatialNative/PocketSpatialNative/AudioRouteProbe.swift',
              root / 'ios/PocketSpatialNative/PocketSpatialNative/ContentView.swift',
              root / 'ios/PocketSpatialNative/PocketSpatialNative/PocketSpatialNativeApp.swift',
              root / 'ios/PocketSpatialNative/project.yml',
              root / '.github/workflows/pocket-spatial-native-ios.yml',
          ]
          parts = []
          for path in wanted:
              if path.exists():
                  text = path.read_text(encoding='utf-8', errors='replace')
                  parts.append(f'\n===== {path.as_posix()} =====\n{text[:18000]}')

          context = ''.join(parts)
          prompt = f'''We are building Pocket Spatial, a native iPhone audio experiment. The current Swift app compiles successfully in GitHub Actions and uses AVAudioSession plus AVAudioEngine to probe 5.1/7.1 hardware output and play one discrete PCM channel at a time.

User constraints and facts:
- iPhone SE running iOS 26.6.1.
- Goal is audio only, eventually Lightning-to-HDMI into an AV receiver.
- Do not rely on Safari/Web Audio.
- Do not rely on Replit.
- Prefer no laptop if a legitimate path exists.
- GitHub and GitHub Actions are available.
- Do not assume a paid Apple Developer Program membership unless it is actually required.
- We want the fastest lawful, technically real way to get this native test app onto the user's physical iPhone and run the hardware-channel probe.
- Do not invent signing bypasses, fake provisioning methods, or claim unsigned iOS apps can simply be installed.

Repository excerpts follow:{context}

Act as a senior iOS build/release engineer. Give a concrete decision tree, ranked best path first. State exactly what can be automated in GitHub Actions, what still requires Apple signing/provisioning, whether a free Apple ID route exists, whether TestFlight requires a paid developer account, and whether any no-computer sideload path is genuinely viable on stock iOS 26.6.1. If the current project needs code or CI changes before physical-device testing, identify the exact changes. Finish with one recommended next action for this user.'''

          answer = request_chat(
              'You are Falcon3-10B-Instruct running as the same local BitNet model used by the Community. Be precise, skeptical, practical, and do not fabricate platform capabilities.',
              prompt,
              max_tokens=256,
              temperature=0.1,
              timeout=180,
          )
          out = root / 'falcon-pocket-spatial-native-review.md'
          out.write_text('# Falcon 10B review: Pocket Spatial native iPhone path\n\n' + answer + '\n', encoding='utf-8')
          print('===== FALCON REVIEW =====')
          print(answer)
          print('===== END FALCON REVIEW =====')
          PY

      - name: Upload Falcon review
        uses: actions/upload-artifact@v4
        with:
          name: pocket-spatial-falcon-native-review
          path: falcon-pocket-spatial-native-review.md
          if-no-files-found: error
          retention-days: 14

# Triggered after initial workflow registration so this push starts the Falcon review.
