name: Room watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-watchdog.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: room-watchdog-main
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Replace Room runner when feed is stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          active_room_runs=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/sarah-society.yml/runs?per_page=20" --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")] | length' 2>/dev/null || echo 0)
          case "$active_room_runs" in ''|*[!0-9]*) active_room_runs=0 ;; esac
          if [ "$active_room_runs" -gt 0 ]; then
            echo "ROOM_WATCHDOG runner already active (${active_room_runs}); no replacement dispatch"
            exit 0
          fi

          if python3 - <<'PY'
          import json, pathlib, time, datetime
          p = pathlib.Path('room/feed.json')
          if not p.exists():
              print('ROOM_WATCHDOG stale: feed missing')
              raise SystemExit(2)
          data = json.loads(p.read_text())
          stamp = data.get('generated_at') or (data.get('state') or {}).get('last_run')
          if not stamp:
              print('ROOM_WATCHDOG stale: no timestamp')
              raise SystemExit(2)
          dt = datetime.datetime.fromisoformat(stamp.replace('Z', '+00:00'))
          age = time.time() - dt.timestamp()
          print(f'ROOM_WATCHDOG age_seconds={age:.1f} cycle={(data.get("state") or {}).get("cycle")}')
          if age > 480:
              raise SystemExit(2)
          PY
          then
            echo 'ROOM_WATCHDOG healthy; no action'
            exit 0
          fi
          echo 'ROOM_WATCHDOG stale; dispatching replacement Room runner'
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
