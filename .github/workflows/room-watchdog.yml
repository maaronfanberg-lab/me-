name: Room watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-watchdog.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: room-watchdog-main
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Replace Room runner when feed is stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          active=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/sarah-society.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status == "in_progress" or .status == "queued")][0] | if . then [.id,.status,.created_at] | @tsv else "" end' 2>/dev/null || true)
          if [ -n "$active" ]; then
            IFS=$'\t' read -r active_id active_status active_created <<< "$active"
            active_age=$(python3 - "$active_created" <<'PY'
          import datetime, sys, time
          dt=datetime.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
          print(int(time.time()-dt.timestamp()))
          PY
            )
            echo "ROOM_WATCHDOG active_run=$active_id status=$active_status age_seconds=$active_age"
            # Protect fresh recovery runs from the workflow's cancel-in-progress
            # policy. Only an active run that has itself failed to publish within
            # ten minutes is old enough to replace.
            if [ "$active_age" -lt 600 ]; then
              echo 'ROOM_WATCHDOG fresh Room runner already active; no replacement dispatch'
              exit 0
            fi
            echo 'ROOM_WATCHDOG active Room runner is stale enough to replace'
          fi

          if python3 - <<'PY'
          import json, pathlib, time, datetime
          p = pathlib.Path('room/feed.json')
          if not p.exists():
              print('ROOM_WATCHDOG stale: feed missing')
              raise SystemExit(2)
          data = json.loads(p.read_text())
          stamp = data.get('generated_at') or (data.get('state') or {}).get('last_run')
          if not stamp:
              print('ROOM_WATCHDOG stale: no timestamp')
              raise SystemExit(2)
          dt = datetime.datetime.fromisoformat(stamp.replace('Z', '+00:00'))
          age = time.time() - dt.timestamp()
          print(f'ROOM_WATCHDOG age_seconds={age:.1f} cycle={(data.get("state") or {}).get("cycle")}')
          if age > 480:
              raise SystemExit(2)
          PY
          then
            echo 'ROOM_WATCHDOG healthy; no action'
            exit 0
          fi
          echo 'ROOM_WATCHDOG stale; dispatching replacement Room runner'
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
