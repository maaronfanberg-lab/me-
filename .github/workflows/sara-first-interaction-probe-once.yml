name: Sara participant ingress probe once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sara-first-interaction-probe-once.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Sara participant ingress end to end
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 - <<'PY'
          import room_engine_v5 as engine
          import room_participant as participant

          AI = ('sarah','mara','owen','jules')
          assert tuple(engine.ORDER) == AI
          assert participant.PARTICIPANTS == ('allen','sara')

          state = engine.fresh_state()
          state['cycle'] = 77
          history = []
          discourse = {'nodes': [], 'roots': []}
          mind = engine.fresh_minds()

          item = {
              'id': 'sim-sara-ingress-e2e',
              'at': '2026-08-22T14:42:00Z',
              'speaker': 'sara',
              'text': 'Sarah, what do you think about this?',
          }
          source_id = participant.inject(item, history, discourse, state)
          assert source_id == item['id']
          assert len(history) == 1
          message = history[0]
          assert message['speaker'] == 'sara'
          assert message['cognition']['target'] == 'sarah'
          assert '-sara-v5-' in message['id']
          assert discourse['nodes'][0]['speaker'] == 'sara'

          observed = participant.observe_participant_history(mind, history, discourse, state)
          assert observed == 1
          sarah_rel = mind['entities']['sarah']['people']['sara']
          assert sarah_rel['observed_turns'] == 1
          assert sarah_rel['direct_turns'] == 1
          assert sarah_rel['last_direct_cycle'] == 78

          for entity in ('mara','owen','jules'):
              rel = mind['entities'][entity]['people']['sara']
              assert rel['observed_turns'] == 1
              assert rel['direct_turns'] == 0
              memories = mind['entities'][entity].get('room_memories') or []
              assert any(m.get('source') == message['id'] and m.get('speaker') == 'sara' for m in memories)

          before = {
              entity: (
                  mind['entities'][entity]['people']['sara']['observed_turns'],
                  mind['entities'][entity]['people']['sara']['direct_turns'],
              )
              for entity in AI
          }
          second = participant.observe_participant_history(mind, history, discourse, state)
          after = {
              entity: (
                  mind['entities'][entity]['people']['sara']['observed_turns'],
                  mind['entities'][entity]['people']['sara']['direct_turns'],
              )
              for entity in AI
          }
          assert second == 0
          assert after == before
          assert 'sara' not in mind.get('entities', {})

          print('SARA_INGRESS_MESSAGE=', message)
          print('FIRST_OBSERVED_COUNT=', observed)
          print('SECOND_OBSERVED_COUNT=', second)
          print('SARAH_SARA_REL=', sarah_rel)
          print('SARA_INGRESS_EXIT_CODE=0')
          PY

      - name: Remove one-shot workflow after pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sara-first-interaction-probe-once.yml
          git diff --cached --check
          git commit -m 'Confirm Sara participant ingress boundary'
          git push origin HEAD:main
