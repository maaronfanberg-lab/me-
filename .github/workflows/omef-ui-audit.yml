name: OMEF Exclusive Mobile Browser Audit
on:
  push:
    branches:
      - audit/omef-ui-2026-11-23
    paths:
      - .github/workflows/omef-ui-audit.yml
      - audit/omef-ui-audit.cjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out app and test code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real browser engines
        run: |
          npm install --no-save playwright@latest
          npx playwright install chromium webkit
      - name: Exercise mobile-sized browser controls and capture screenshots
        run: node audit/omef-ui-audit.cjs
      - name: Upload UI screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omef-ui-audit
          path: audit-artifacts/
          retention-days: 14
