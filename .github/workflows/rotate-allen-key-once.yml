name: Rotate Allen Room key once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rotate-allen-key-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Rotate Allen fingerprint and deployment marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          new_hash = '4430912785b4d2a0f75bda347e9fc7c6d35e90156b50ff4ce223c45ae910cadb'
          new_build = '20260822-rotated-1'

          p = Path('cloudflare/room-worker/src/index-entry.js')
          s = p.read_text()
          old = 'const ALLEN_KEY_SHA256 = "c72f439977bc05b63b4cb8427dd958d78e564856e2e070aa8137fb7bdd295e18";'
          assert s.count(old) == 1, 'index-entry Allen fingerprint anchor mismatch'
          s = s.replace(old, f'const ALLEN_KEY_SHA256 = "{new_hash}";', 1)
          old_build = 'const ALLEN_KEY_BUILD = "20260820-current";'
          assert s.count(old_build) == 1, 'index-entry Allen build anchor mismatch'
          s = s.replace(old_build, f'const ALLEN_KEY_BUILD = "{new_build}";', 1)
          p.write_text(s)

          p = Path('cloudflare/room-worker/src/index.js')
          s = p.read_text()
          old = 'const ALLEN_KEY_SHA256 = "e53d0db863593fc618b4b764f70b31a5b9652931d8f8f7838a24cbd8cf87aa4d";'
          assert s.count(old) == 1, 'index.js Allen fingerprint anchor mismatch'
          p.write_text(s.replace(old, f'const ALLEN_KEY_SHA256 = "{new_hash}";', 1))

          p = Path('.github/workflows/deploy-room-worker.yml')
          s = p.read_text()
          old = 'EXPECTED_ALLEN_KEY_BUILD: 20260820-current'
          assert s.count(old) == 1, 'deploy expected-build anchor mismatch'
          p.write_text(s.replace(old, f'EXPECTED_ALLEN_KEY_BUILD: {new_build}', 1))
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/rotate-allen-key-once.yml
          git add cloudflare/room-worker/src/index-entry.js cloudflare/room-worker/src/index.js .github/workflows/deploy-room-worker.yml .github/workflows/rotate-allen-key-once.yml
          git commit -m 'Rotate Allen Room key'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
