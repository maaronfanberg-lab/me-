name: Room secret presence probe

on:
  push:
    paths:
      - 'society/secret-presence-probe.txt'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      ROOM_PROMPT_PERCEPTION: ${{ secrets.ROOM_PROMPT_PERCEPTION }}
      ROOM_PROMPT_DELIBERATION: ${{ secrets.ROOM_PROMPT_DELIBERATION }}
      ROOM_PROMPT_EXPRESSION: ${{ secrets.ROOM_PROMPT_EXPRESSION }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record safe secret-presence flags
        run: |
          set -u
          p=false; d=false; e=false
          [ -n "${ROOM_PROMPT_PERCEPTION:-}" ] && p=true
          [ -n "${ROOM_PROMPT_DELIBERATION:-}" ] && d=true
          [ -n "${ROOM_PROMPT_EXPRESSION:-}" ] && e=true
          mkdir -p room
          cat > room/private-secret-presence.json <<EOF
          {
            "perception": $p,
            "deliberation": $d,
            "expression": $e
          }
          EOF
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add room/private-secret-presence.json
          git commit -m "Record private secret presence"
          git push origin HEAD:main
