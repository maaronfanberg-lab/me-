name: Apply entity question architecture fix

on:
  push:
    branches:
      - 'fix/entity-question-answering-20260820'
    paths:
      - 'scripts/apply_entity_question_architecture_fix.py'
      - '.github/workflows/room-question-architecture-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply and verify architecture compatibility
        run: |
          python3 scripts/apply_entity_question_architecture_fix.py
          python3 -m py_compile scripts/room_engine_v5.py scripts/room_private_model.py
          python3 scripts/room_question_answering_sim.py
          python3 scripts/room_expression_quality_sim.py
          python3 scripts/room_engine_v5.py selftest
      - name: Record runtime repair
        run: |
          set -euo pipefail
          git config user.name 'question-routing-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/room_private_model.py
          git commit -m 'Keep entity question routing separate from Allen' || exit 0
          branch="${GITHUB_REF_NAME}"
          for n in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then exit 0; fi
            git fetch origin "$branch"
            git rebase "origin/$branch" || { git rebase --abort || true; exit 1; }
            sleep "$n"
          done
          exit 1
