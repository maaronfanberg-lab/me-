name: Little World Falcon live verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/little-world-lab/runtime/live-smoke-request.json'

permissions:
  contents: read

jobs:
  live-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Test Little World Falcon adapter
        working-directory: experiments/little-world-lab
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Record runner resources
        run: |
          echo '=== memory ==='
          free -h
          echo '=== disk ==='
          df -h /
          echo '=== cpu ==='
          nproc

      - name: Start isolated Falcon llama.cpp server
        run: |
          set -euo pipefail
          docker pull ghcr.io/ggml-org/llama.cpp:server
          docker run -d --name little-world-falcon \
            -p 8080:8080 \
            ghcr.io/ggml-org/llama.cpp:server \
            -hf bartowski/Falcon3-1B-Instruct-GGUF:Q4_K_M \
            --host 0.0.0.0 \
            --port 8080 \
            -c 2048 \
            -np 1

      - name: Wait for Falcon readiness
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/little-world-health.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx 'little-world-falcon'; then
              echo 'Falcon container exited before becoming healthy.'
              docker ps -a
              docker logs little-world-falcon || true
              exit 1
            fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "Still loading Falcon after $((i * 5)) seconds..."
              docker ps --format '{{.Names}} {{.Status}}'
              free -h
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Falcon server did not become healthy in time.'
            docker logs little-world-falcon || true
            exit 1
          fi
          cat /tmp/little-world-health.json
          curl -fsS http://127.0.0.1:8080/v1/models > /tmp/little-world-models.json
          cat /tmp/little-world-models.json
          python - <<'PY' > /tmp/little-world-model-id.txt
          import json
          data = json.load(open('/tmp/little-world-models.json', encoding='utf-8'))
          rows = data.get('data') or []
          if not rows or not rows[0].get('id'):
              raise SystemExit('llama.cpp returned no model id')
          print(rows[0]['id'])
          PY
          echo "Resolved model id: $(cat /tmp/little-world-model-id.txt)"

      - name: Probe every live Falcon action contract
        working-directory: experiments/little-world-lab
        run: |
          set -euo pipefail
          rm -rf runs/falcon-live-contract
          MODEL_ID="$(cat /tmp/little-world-model-id.txt)"
          python falcon_live_contract.py \
            --temperature 0.1 \
            --max-tokens 96 \
            --timeout 300 \
            --max-attempts 4 \
            --model "$MODEL_ID" \
            --output runs/falcon-live-contract

      - name: Run multi-seed natural Falcon baseline
        working-directory: experiments/little-world-lab
        run: |
          set -euo pipefail
          MODEL_ID="$(cat /tmp/little-world-model-id.txt)"
          for SEED in 7 19 31; do
            OUT="runs/falcon-live-seed-${SEED}"
            rm -rf "$OUT"
            python falcon_live.py \
              --ticks 12 \
              --actors-per-tick 2 \
              --seed "$SEED" \
              --temperature 0.1 \
              --max-tokens 256 \
              --timeout 300 \
              --model "$MODEL_ID" \
              --output "$OUT"
          done

      - name: Validate blocker-closure evidence
        working-directory: experiments/little-world-lab
        run: |
          set -euo pipefail
          python - <<'PY'
          import collections
          import json
          from pathlib import Path

          seeds = [7, 19, 31]
          expected_actions = 12 * 2
          total_actions = 0
          total_rejections = 0
          total_backend_errors = 0
          total_accepted = 0
          action_counts = collections.Counter()
          per_seed = []

          for seed in seeds:
              out = Path(f'runs/falcon-live-seed-{seed}')
              metrics = json.loads((out / 'metrics.json').read_text(encoding='utf-8'))
              assert metrics['ticks'] == 12, metrics
              assert metrics['agents'] == 8, metrics
              assert metrics['total_actions'] == expected_actions, metrics
              assert metrics['backend_errors'] == 0, metrics
              assert (out / 'events.jsonl').exists()
              assert (out / 'checkpoint.json').exists()
              accepted = metrics['total_actions'] - metrics['proposal_rejections'] - metrics['backend_errors']
              assert accepted > 0, metrics
              total_actions += metrics['total_actions']
              total_rejections += metrics['proposal_rejections']
              total_backend_errors += metrics['backend_errors']
              total_accepted += accepted
              action_counts.update(metrics['action_counts'])
              per_seed.append({
                  'seed': seed,
                  'metrics': metrics,
                  'accepted_model_proposals': accepted,
                  'proposal_rejection_rate': round(metrics['proposal_rejections'] / metrics['total_actions'], 4),
              })

          probe = json.loads(Path('runs/falcon-live-contract/probe-results.json').read_text(encoding='utf-8'))
          required = {'move', 'talk', 'help', 'work', 'rest', 'observe'}
          assert probe['ok'] is True, probe
          assert set(probe['passed_action_types']) == required, probe

          aggregate_rejection_rate = total_rejections / total_actions
          summary = {
              'seeds': seeds,
              'runs': len(seeds),
              'total_actions': total_actions,
              'accepted_model_proposals': total_accepted,
              'proposal_rejections': total_rejections,
              'proposal_rejection_rate': round(aggregate_rejection_rate, 4),
              'backend_errors': total_backend_errors,
              'resolved_action_counts': dict(sorted(action_counts.items())),
              'live_contract_action_types': sorted(required),
              'per_seed': per_seed,
              'note': 'Natural multi-seed runs and directed action-contract probes are separate evidence classes.',
          }
          Path('runs/falcon-live-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          assert total_actions == 72, summary
          assert total_backend_errors == 0, summary
          assert total_accepted >= 36, summary
          assert aggregate_rejection_rate <= 0.50, summary
          PY

      - name: Capture Falcon server logs
        if: always()
        run: |
          mkdir -p experiments/little-world-lab/runs/falcon-live-evidence
          docker logs little-world-falcon > experiments/little-world-lab/runs/falcon-live-evidence/server.log 2>&1 || true
          free -h > experiments/little-world-lab/runs/falcon-live-evidence/runner-memory.txt || true
          df -h / > experiments/little-world-lab/runs/falcon-live-evidence/runner-disk.txt || true

      - name: Upload live-verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: little-world-falcon-live-verification
          path: |
            experiments/little-world-lab/runs/falcon-live-contract
            experiments/little-world-lab/runs/falcon-live-seed-*
            experiments/little-world-lab/runs/falcon-live-summary.json
            experiments/little-world-lab/runs/falcon-live-evidence
          if-no-files-found: warn
          retention-days: 14
