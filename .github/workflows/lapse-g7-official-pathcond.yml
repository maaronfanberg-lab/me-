name: Lapse G7 official PathCond benchmark

on:
  pull_request:
    paths:
      - "experiments/lapse-meter/GAUGE_G7A_PREREGISTRATION.md"
      - "experiments/lapse-meter/experiments/g7_official_pathcond.py"
      - "experiments/lapse-meter/tests/test_g7_official_pathcond.py"
      - "experiments/lapse-meter/results/g7a/**"
      - ".github/workflows/lapse-g7-official-pathcond.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-official-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tested PyTorch CPU wheels
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.5.1+cpu" "torchvision==0.20.1+cpu"
          python -m pip install "numpy==2.3.5" "scikit-learn==1.8.0" "tqdm>=4.60,<5"
      - name: Install exact original authors' PathCond from GitHub
        run: python -m pip install --no-deps "git+https://github.com/Artim436/pathcond.git@535b202e3476c64d5e7e9ec5e817344fb5cfd787"
      - name: Verify pinned installation and versions
        run: |
          python - <<'PY'
          import torch, torchvision, sklearn, numpy, inspect
          from pathcond.pathcond import rescaling_path_cond
          print('PyTorch', torch.__version__, 'torchvision', torchvision.__version__)
          print('NumPy', numpy.__version__, 'sklearn', sklearn.__version__)
          print('Official PathCond source', inspect.getfile(rescaling_path_cond))
          PY
      - name: Test exact one-step G5 port and original PathCond invariance
        working-directory: experiments/lapse-meter
        run: python tests/test_g7_official_pathcond.py
      - name: Run G7A frozen 48 tuning plus 36 holdout comparisons
        working-directory: experiments/lapse-meter
        run: python -u experiments/g7_official_pathcond.py results/g7a/ci_full.json
      - name: Print hypotheses, including negative findings
        if: always()
        working-directory: experiments/lapse-meter
        run: |
          python - <<'PY'
          import os,json
          p='results/g7a/ci_full.json'
          if not os.path.isfile(p):
              print('G7A incomplete: no result file'); raise SystemExit(0)
          r=json.load(open(p)); s=r['summary']
          print('H1 original PathCond correct:',s['h1_integration_pass'])
          print('H2 PathCond+Adam CE wins:',s['h2_test_ce_wins'],'pass:',s['h2_pass'])
          print('H3 PathCond+Adam gauge wins:',s['h3_gauge_wins'],'pass:',s['h3_pass'])
          for row in s['cells']:
              print(row['task'],'depth',row['depth'],{k:v['mean_test_ce'] for k,v in row['stats'].items()})
          PY
      - name: Archive every run, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lapse-g7a-full-results
          path: experiments/lapse-meter/results/g7a/ci_full.json
          if-no-files-found: warn
