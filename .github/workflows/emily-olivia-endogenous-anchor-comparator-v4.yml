name: Emily Olivia PE vs retrieval diagnostic v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/emily-olivia-endogenous-anchor-comparator-v4.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  anchor-comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: '33533326825'
      PINNED_ARTIFACT_NAME: emily-olivia-community-results
      PINNED_ARTIFACT_ID: '9810957121'
      PINNED_ARTIFACT_SHA256: fdab00caf21df61e63802c33e7d2cd63c7e213cb463a3e81a780a719e0803c1f
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            experiments/emily-olivia-society/endogenous_workspace.py
            experiments/emily-olivia-society/endogenous_workspace_replay.py
            experiments/emily-olivia-society/endogenous_workspace_artifact_tape.py
            experiments/emily-olivia-society/endogenous_workspace_prediction_error.py
            experiments/emily-olivia-society/endogenous_workspace_trial_v2.py
            experiments/emily-olivia-society/endogenous_workspace_replication_v3.py
            experiments/emily-olivia-society/endogenous_workspace_preregistration_v3.json
          sparse-checkout-cone-mode: false

      - name: Verify pinned source artifact
        run: |
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PINNED_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${PINNED_ARTIFACT_NAME}\") | .id")"
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PINNED_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${PINNED_ARTIFACT_NAME}\") | .digest")"
          test "$artifact_id" = "$PINNED_ARTIFACT_ID"
          test "$digest" = "sha256:${PINNED_ARTIFACT_SHA256}"

      - uses: actions/download-artifact@v4
        with:
          name: emily-olivia-community-results
          path: pinned-community-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33533326825

      - name: Compare learned prediction error with existing retrieval
        working-directory: experiments/emily-olivia-society
        run: |
          python3 - <<'PY'
          import json, statistics
          from pathlib import Path
          from endogenous_workspace_artifact_tape import build_exact_tape
          from endogenous_workspace_replay import normalize_tape
          from endogenous_workspace_replication_v3 import _evaluate_variant

          prereg=json.loads(Path('endogenous_workspace_preregistration_v3.json').read_text())
          raw=build_exact_tape(
              Path('../../pinned-community-artifact'),
              min_ticks=12,
              artifact_run_id=33533326825,
              artifact_sha256='fdab00caf21df61e63802c33e7d2cd63c7e213cb463a3e81a780a719e0803c1f',
          )
          tape=normalize_tape(raw)
          variants=['base','retrieval_only','no_prediction_learning','shuffle_surprise_identity','scramble_temporal_order']
          rows={}
          for variant in variants:
              outcomes=[_evaluate_variant(tape, prereg, int(seed), variant) for seed in prereg['seeds']]
              rows[variant]={
                  'median_delta_vs_yoked': statistics.median(x['delta'] for x in outcomes),
                  'median_selector_score': statistics.median(x['selector_score'] for x in outcomes),
                  'median_yoked_score': statistics.median(x['yoked_score'] for x in outcomes),
              }
          result={
              'experiment':'anchor_pe_vs_retrieval_diagnostic_v4',
              'source_run_id':33533326825,
              'source_artifact_id':9810957121,
              'source_artifact_sha256':'fdab00caf21df61e63802c33e7d2cd63c7e213cb463a3e81a780a719e0803c1f',
              'produced_dialogue':False,
              'wrote_live_memory':False,
              'activated_live_workspace':False,
              'tape_metadata':raw['metadata'],
              'variants':rows,
              'pe_minus_retrieval_selector_score': rows['base']['median_selector_score']-rows['retrieval_only']['median_selector_score'],
              'pe_minus_retrieval_delta_vs_yoked': rows['base']['median_delta_vs_yoked']-rows['retrieval_only']['median_delta_vs_yoked'],
              'shadow_mode_permitted':False,
          }
          Path('anchor-comparator-v4.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: emily-olivia-anchor-pe-vs-retrieval-v4
          path: experiments/emily-olivia-society/anchor-comparator-v4.json
          if-no-files-found: error
          retention-days: 30
