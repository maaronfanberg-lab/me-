name: Force substantive Room bridge once
# explicit Room dispatch after recovery: 2026-08-22 23:26Z
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-force-substantive-bridge-once.yml'
permissions:
  contents: write
  actions: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Stop hot Room runner and refresh main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow sarah-society.yml --status in_progress --limit 10 --json databaseId --jq '.[].databaseId'); do
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done
          sleep 6
          git fetch origin main
          git reset --hard origin/main
      - name: Apply guarded substantive bridge patch
        run: python3 scripts/room_force_substantive_bridge.py
      - name: Verify
        run: |
          python3 -m py_compile scripts/room_engine_v5_core.py scripts/room_topic_bounded.py scripts/room_bridge_fresh.py scripts/room_force_substantive_bridge.py
          python3 scripts/room_bridge_live_vocabulary_sim.py
          python3 -c "import json; s=json.load(open('room/state.json'))['topic_episode']; c=json.load(open('room/cognitive_state.json'))['topic_episode']; assert s['bridge_pending'] and c['bridge_pending']; assert s['bridge_reason']=='substantive_reset' and c['bridge_reason']=='substantive_reset'; print('PASS: substantive bridge marked')"
      - name: Publish and restart Room
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/room_engine_v5_core.py scripts/room_topic_bounded.py room/state.json room/cognitive_state.json society/pulse-kick.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Force Room from meta loop into substantive propositions'
            pushed=0
            for n in 1 2 3 4; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              sleep "$n"
            done
            [ "$pushed" -eq 1 ] || exit 1
          else
            echo 'Substantive bridge state already published'
          fi
          gh workflow run sarah-society.yml --repo "$GITHUB_REPOSITORY" --ref main -f entity=auto
          echo 'Room restart explicitly dispatched'
