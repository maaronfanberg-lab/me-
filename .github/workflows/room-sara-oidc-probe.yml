name: Room Sara OIDC write probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-sara-oidc-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: POST one Sara turn and read session
        env:
          ROOM_RELAY_URL: https://room-live-mirror.dfp6k69dw5.workers.dev
        run: |
          set +e
          token_json=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=room-live-mirror")
          token_rc=$?
          relay_token=$(printf '%s' "$token_json" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value", ""))' 2>/dev/null)

          post_body=$(mktemp)
          curl -sS -o "$post_body" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${relay_token}" \
            -H 'Content-Type: application/json' \
            --data '{"speaker":"sara","display_name":"Sara","text":"Hi. I’m Sara. I’ve been listening for a moment. What are you all in the middle of?"}' \
            "${ROOM_RELAY_URL%/}/api/sara/turn" > post_status.txt
          post_rc=$?
          post_status=$(cat post_status.txt)

          get_body=$(mktemp)
          curl -sS -o "$get_body" -w '%{http_code}' \
            "${ROOM_RELAY_URL%/}/api/sara/session" > get_status.txt
          get_rc=$?
          get_status=$(cat get_status.txt)

          echo "TOKEN_EXIT_CODE=${token_rc}"
          echo "POST_HTTP_STATUS=${post_status}"
          echo "POST_BODY_BEGIN"
          cat "$post_body"
          echo
          echo "POST_BODY_END"
          echo "POST_EXIT_CODE=${post_rc}"
          echo "GET_HTTP_STATUS=${get_status}"
          echo "GET_BODY_BEGIN"
          cat "$get_body"
          echo
          echo "GET_BODY_END"
          echo "GET_EXIT_CODE=${get_rc}"

          if [ "$token_rc" -ne 0 ] || [ "$post_rc" -ne 0 ] || [ "$post_status" != "202" ] || [ "$get_rc" -ne 0 ] || [ "$get_status" != "200" ]; then
            exit 1
          fi
