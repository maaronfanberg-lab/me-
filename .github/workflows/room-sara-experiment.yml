name: Room Sara experiment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'experiments/room-sara/session.json'

permissions:
  contents: write

concurrency:
  group: room-sara-experiment
  cancel-in-progress: false

jobs:
  respond:
    # A Sara commit ends with speaker=sara. Runner is idempotent otherwise.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Run isolated Room responses
        env:
          ROOM_MODEL_URL: ${{ secrets.ROOM_MODEL_URL }}
          ROOM_NODE_PROMPT: ${{ secrets.ROOM_NODE_PROMPT }}
        run: python3 scripts/room_sara_experiment_runner.py
      - name: Publish experiment transcript
        run: |
          if git diff --quiet -- experiments/room-sara/session.json; then
            echo 'No fresh Sara turn.'
            exit 0
          fi
          git config user.name 'room-sara-experiment'
          git config user.email 'actions@users.noreply.github.com'
          git add -- experiments/room-sara/session.json
          git commit -m 'Advance Sara experiment'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep "$attempt"
          done
          exit 1
