name: Emily Olivia exact artifact workspace v2

on:
  push:
    branches: [main]
    paths:
      - 'experiments/emily-olivia-society/endogenous_workspace.py'
      - 'experiments/emily-olivia-society/endogenous_workspace_replay.py'
      - 'experiments/emily-olivia-society/endogenous_workspace_artifact_tape.py'
      - 'experiments/emily-olivia-society/endogenous_workspace_prediction_error.py'
      - 'experiments/emily-olivia-society/endogenous_workspace_trial_v2.py'
      - 'experiments/emily-olivia-society/endogenous_workspace_preregistration_v2.json'
      - '.github/workflows/emily-olivia-endogenous-artifact-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  exact-artifact-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PINNED_RUN_ID: '33533326825'
      PINNED_ARTIFACT_ID: '9810957121'
      PINNED_ARTIFACT_NAME: emily-olivia-community-results
      PINNED_ARTIFACT_SHA256: fdab00caf21df61e63802c33e7d2cd63c7e213cb463a3e81a780a719e0803c1f
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            experiments/emily-olivia-society/endogenous_workspace.py
            experiments/emily-olivia-society/endogenous_workspace_replay.py
            experiments/emily-olivia-society/endogenous_workspace_artifact_tape.py
            experiments/emily-olivia-society/endogenous_workspace_prediction_error.py
            experiments/emily-olivia-society/endogenous_workspace_trial_v2.py
            experiments/emily-olivia-society/endogenous_workspace_preregistration_v2.json
          sparse-checkout-cone-mode: false

      - name: Verify pinned Community artifact identity
        run: |
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PINNED_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${PINNED_ARTIFACT_NAME}\") | .id")"
          digest="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PINNED_RUN_ID}/artifacts" --jq ".artifacts[] | select(.name == \"${PINNED_ARTIFACT_NAME}\") | .digest")"
          test "$artifact_id" = "$PINNED_ARTIFACT_ID"
          test "$digest" = "sha256:${PINNED_ARTIFACT_SHA256}"
          echo "Pinned artifact identity verified."

      - name: Download pinned Community artifact
        uses: actions/download-artifact@v4
        with:
          name: emily-olivia-community-results
          path: pinned-community-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33533326825

      - name: Compile offline v2 instrument
        working-directory: experiments/emily-olivia-society
        run: |
          python3 -m py_compile \
            endogenous_workspace.py \
            endogenous_workspace_replay.py \
            endogenous_workspace_artifact_tape.py \
            endogenous_workspace_prediction_error.py \
            endogenous_workspace_trial_v2.py

      - name: Build exact Stanford metadata tape
        working-directory: experiments/emily-olivia-society
        run: |
          python3 endogenous_workspace_artifact_tape.py \
            --artifact-root ../../pinned-community-artifact \
            --out exact-artifact-tape-v2.json \
            --min-ticks 12 \
            --artifact-run-id "$PINNED_RUN_ID" \
            --artifact-sha256 "$PINNED_ARTIFACT_SHA256"

      - name: Run locked prediction-error trial
        working-directory: experiments/emily-olivia-society
        run: |
          python3 endogenous_workspace_trial_v2.py \
            --tape exact-artifact-tape-v2.json \
            --prereg endogenous_workspace_preregistration_v2.json \
            --out exact-artifact-result-v2.json

      - name: Validate evidence boundaries
        working-directory: experiments/emily-olivia-society
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          tape=json.loads(Path('exact-artifact-tape-v2.json').read_text())
          result=json.loads(Path('exact-artifact-result-v2.json').read_text())
          assert tape['metadata']['exact_node_metadata'] is True
          assert tape['metadata']['artifact_run_id'] == 33533326825
          assert tape['metadata']['artifact_sha256'] == 'fdab00caf21df61e63802c33e7d2cd63c7e213cb463a3e81a780a719e0803c1f'
          assert result['produced_dialogue'] is False
          assert result['wrote_live_memory'] is False
          assert result['activated_live_workspace'] is False
          assert len(result['seeds']) == 8
          assert result['results']['status'] in {'SUPPORTED_FOR_NEXT_OFFLINE_STAGE','NOT_SUPPORTED_BY_V2_TRIAL'}
          print(json.dumps({'tape': tape['metadata'], 'results': result['results']}, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: emily-olivia-endogenous-exact-artifact-v2
          path: |
            experiments/emily-olivia-society/exact-artifact-tape-v2.json
            experiments/emily-olivia-society/exact-artifact-result-v2.json
          if-no-files-found: error
          retention-days: 30
