name: BitNet brain end-to-end

on:
  push:
    branches:
      - experiment/bitnet-brain
  pull_request:
    paths:
      - 'scripts/start_bitnet_brain.sh'
      - 'scripts/bitnet_brain_probe.py'
      - '.github/workflows/bitnet-brain-smoke.yml'

jobs:
  bitnet-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate experiment scripts
        run: |
          bash -n scripts/start_bitnet_brain.sh
          python -m py_compile scripts/bitnet_brain_probe.py
          python -m py_compile scripts/room_engine_v5.py scripts/room_social_v5.py scripts/room_private_model.py

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build git-lfs
          python -m pip install --upgrade pip

      - name: Clone Microsoft BitNet
        run: git clone --recursive --depth 1 https://github.com/microsoft/BitNet.git "$RUNNER_TEMP/BitNet"

      - name: Install BitNet Python dependencies
        working-directory: ${{ runner.temp }}/BitNet
        run: python -m pip install -r requirements.txt

      - name: Download official BitNet 2B GGUF model
        working-directory: ${{ runner.temp }}/BitNet
        run: |
          python -m huggingface_hub.commands.huggingface_cli download microsoft/BitNet-b1.58-2B-4T-gguf --local-dir models/BitNet-b1.58-2B-4T

      - name: Build optimized I2_S runtime
        working-directory: ${{ runner.temp }}/BitNet
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: python setup_env.py -md models/BitNet-b1.58-2B-4T -q i2_s

      - name: Verify exact I2_S model
        id: model
        working-directory: ${{ runner.temp }}/BitNet
        run: |
          MODEL="$PWD/models/BitNet-b1.58-2B-4T/ggml-model-i2_s.gguf"
          test -s "$MODEL"
          echo "path=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Using $MODEL"

      - name: Launch BitNet server
        env:
          BITNET_HOME: ${{ runner.temp }}/BitNet
          BITNET_MODEL: ${{ steps.model.outputs.path }}
          BITNET_HOST: 127.0.0.1
          BITNET_PORT: '18080'
          BITNET_THREADS: '2'
          BITNET_CTX_SIZE: '2048'
        run: |
          nohup bash scripts/start_bitnet_brain.sh > "$RUNNER_TEMP/bitnet-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/bitnet-server.pid"

      - name: Wait for BitNet health
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/bitnet-server.pid")" 2>/dev/null; then
              echo 'BitNet server exited before becoming healthy.' >&2
              cat "$RUNNER_TEMP/bitnet-server.log" || true
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/bitnet-server.log" || true
          exit 1

      - name: Prove Room-compatible completion
        env:
          BITNET_URL: http://127.0.0.1:18080
        run: python scripts/bitnet_brain_probe.py

      - name: Run one real Room v5 cognition beat on BitNet
        env:
          ROOM_MODEL_URL: http://127.0.0.1:18080
          ROOM_CYCLE_KEY: bitnet-room-v5
        run: |
          set -euxo pipefail
          rm -rf room_parts room_work
          mkdir -p room_parts room_work
          for n in $(seq 0 11); do
            ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase sense
          done
          python3 scripts/room_engine_v5.py bus
          for n in 0 1 3 4 6 7 9 10; do
            ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-sense.json
          done
          python3 scripts/room_engine_v5.py bus2 --bus room_work/bus-sense.json
          for n in 2 5 8 11; do
            ROOM_NODE_ID="$n" python3 scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-recurrent.json
          done
          python3 scripts/room_engine_v5.py commit
          python3 scripts/build_room_feed.py
          python3 - <<'PY'
          import json
          s=json.load(open('room/state.json'))
          assert s['version']=='room-cognition-v5'
          assert s['beat_message_count']==4
          assert set(s['beat_contributors'])=={'sarah','mara','owen','jules'}
          msgs=s.get('messages') or s.get('conversation') or []
          print('BITNET ROOM V5 PASS', s['cycle'], s['beat_contributors'])
          print(json.dumps(msgs[-8:], ensure_ascii=False)[:12000])
          PY

      - name: Show server log
        if: always()
        run: tail -n 200 "$RUNNER_TEMP/bitnet-server.log" || true
