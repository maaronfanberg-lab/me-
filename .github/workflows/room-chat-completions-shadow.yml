name: Room real 1B chat-format shadow viability

on:
  push:
    branches: [research/room-chat-completions-20261029]
    paths:
      - '.github/workflows/room-chat-completions-shadow.yml'
      - 'scripts/room_chat_completion_shadow.py'

permissions:
  contents: write

concurrency:
  group: room-chat-format-shadow
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify actual Room code and shadow script syntax
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/room_chat_completion_shadow.py
          python3 scripts/test_room_conversational_floor.py
      - name: Download verified actual Llama 1B production-class model
        run: |
          set -euo pipefail
          mkdir -p .chat_shadow/runtime
          gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'llama-runtime-linux-x64.tar.gz' --dir .chat_shadow
          echo '360a5bfab5b8fe562c52e060a998a052f5fc7d98a0448b035c2eedbb6acfbd94  .chat_shadow/llama-runtime-linux-x64.tar.gz' | sha256sum -c -
          tar -xzf .chat_shadow/llama-runtime-linux-x64.tar.gz -C .chat_shadow/runtime
          curl -fsSL --retry 3 --retry-delay 4             'https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf?download=true'             -o .chat_shadow/model.gguf
          echo '6f85a640a97cf2bf5b8e764087b1e83da0fdb51d7c9fab7d0fece9385611df83  .chat_shadow/model.gguf' | sha256sum -c -
      - name: Run source-grounded real 1B chat-format shadow
        run: |
          set -euo pipefail
          bin=$(find .chat_shadow/runtime -type f -name llama-server | head -1)
          chmod +x "$bin"
          "$bin" -m .chat_shadow/model.gguf --host 127.0.0.1 --port 18086 -c 8192 -np 2 -t 4 >.chat_shadow/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18086/health >/dev/null; then ready=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then tail -80 .chat_shadow/server.log; exit 1; fi
          python3 -u scripts/room_chat_completion_shadow.py
      - name: Save public evidence ONLY on research branch
        if: always()
        run: |
          path='docs/research/room-chat-completions-20261029.json'
          test -s "$path" || exit 1
          git config user.name 'room-chat-shadow-research'
          git config user.email 'actions@users.noreply.github.com'
          git add "$path"
          git diff --cached --quiet && exit 0
          git commit -m 'Record Room chat-format model viability shadow results'
          for n in 1 2 3 4; do
            git push origin HEAD:research/room-chat-completions-20261029 && exit 0
            git fetch origin research/room-chat-completions-20261029
            git rebase origin/research/room-chat-completions-20261029 || { git rebase --abort; exit 1; }
            sleep "$n"
          done
          exit 1
