name: Room Brain Canary

on:
  push:
    branches: [room-brain-canary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: room-brain-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Download known-good runtime and both brains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .room_model/runtime
          gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'society-brain-q4_0.gguf' --dir .room_model
          gh release download society-brain-v1 --repo "$GITHUB_REPOSITORY" --pattern 'llama-runtime-linux-x64.tar.gz' --dir .room_model
          echo '7671c0c304e6ce5a7fc577bcb12aba01e2c155cc2efd29b2213c95b18edaf6ed  .room_model/society-brain-q4_0.gguf' | sha256sum -c -
          echo '360a5bfab5b8fe562c52e060a998a052f5fc7d98a0448b035c2eedbb6acfbd94  .room_model/llama-runtime-linux-x64.tar.gz' | sha256sum -c -
          curl --fail --location --retry 4 --retry-delay 5 'https://huggingface.co/bartowski/SmolLM2-1.7B-Instruct-GGUF/resolve/main/SmolLM2-1.7B-Instruct-Q4_K_M.gguf?download=true' --output .room_model/smollm2-1.7b-instruct-q4_k_m.gguf
          echo '77665ea4815999596525c636fbeb56ba8b080b46ae85efef4f0d986a139834d7  .room_model/smollm2-1.7b-instruct-q4_k_m.gguf' | sha256sum -c -
          tar -xzf .room_model/llama-runtime-linux-x64.tar.gz -C .room_model/runtime

      - name: Run stronger-model autonomy canary and Qwen rollback proof
        run: python3 scripts/room_brain_canary.py

      - name: Upload canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-brain-canary-evidence
          path: |
            canary-results.json
            .room_model/*.log
          if-no-files-found: warn
