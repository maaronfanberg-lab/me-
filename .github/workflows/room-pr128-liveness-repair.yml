name: Room PR128 quality-liveness repair
# trigger after PR129 consensus-core merge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/room-pr128-liveness-repair.yml'

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/room-quality-rejection-liveness-20260821
          fetch-depth: 0
      - name: Rebuild liveness repair on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/room_private_commit.py')
          text = path.read_text()
          text = text.replace('import re\n', 'import re\nimport sys\n', 1)
          marker = '_original_validate_staged_quality = _base.validate_staged_quality\n'
          assert marker in text
          insert = '''QUALITY_REJECTION_EXIT = 42\n_original_validate_staged_quality = _base.validate_staged_quality\n\n\ndef quality_rejection_exit_code(error: BaseException) -> int | None:\n    \"\"\"Classify only intentional same-beat publication rejection as soft.\"\"\"\n    if isinstance(error, RuntimeError) and \"private Room same-beat echo blocked\" in str(error):\n        return QUALITY_REJECTION_EXIT\n    return None\n'''
          text = text.replace(marker, insert, 1)
          old_tail = '''if __name__ == "__main__":\n    c.main()\n'''
          assert old_tail in text
          new_tail = '''def _run_cli() -> None:\n    try:\n        c.main()\n    except RuntimeError as exc:\n        code = quality_rejection_exit_code(exc)\n        if code is None:\n            raise\n        print(f\"ROOM PUBLISH QUALITY REJECTION: {exc}\", file=sys.stderr)\n        raise SystemExit(code) from None\n\n\nif __name__ == "__main__":\n    _run_cli()\n'''
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text)

          Path('scripts/room_expression_node.py').write_text(r'''#!/usr/bin/env python3
from __future__ import annotations

import re
import sys

import room_engine_v5 as engine

QUALITY_REJECTION_EXIT = 42
_QUALITY_REASONS = {
    "empty_expression",
    "rambling_expression",
    "malformed_pronoun",
    "self_address",
    "trailing_fragment",
    "self_repetition",
    "duplicate_context",
}


def expression_quality_rejection_exit_code(error: BaseException) -> int | None:
    """Return 42 only when expression attempts exhausted dialogue-quality gates."""
    if not isinstance(error, RuntimeError):
        return None
    match = re.fullmatch(r"private model output rejected for expression: ([a-z0-9_ -]+)", str(error))
    if not match:
        return None
    reason = match.group(1).strip()
    if reason.startswith("same_beat_") or reason in _QUALITY_REASONS:
        return QUALITY_REJECTION_EXIT
    return None


def main() -> None:
    try:
        engine.main()
    except RuntimeError as exc:
        code = expression_quality_rejection_exit_code(exc)
        if code is None:
            raise
        print(f"ROOM EXPRESSION QUALITY REJECTION: {exc}", file=sys.stderr)
        raise SystemExit(code) from None


if __name__ == "__main__":
    main()
''')

          wf = Path('.github/workflows/sarah-society.yml')
          workflow = wf.read_text()
          needle = '          ROOM_BEAT_FAILURE_LIMIT=2\n'
          assert needle in workflow
          workflow = workflow.replace(needle, needle + '          ROOM_QUALITY_REJECTION_EXIT=42\n', 1)

          old_expr = '''              timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" \\
                env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \\
                ROOM_NODE_PROMPT="${ROOM_PROMPT_EXPRESSION:-}" ROOM_NODE_ID="$n" ROOM_EXPRESSION_RANK="$rank" \\
                python3 scripts/room_skill_exec.py scripts/room_engine_v5.py node --phase recurrent --bus room_work/bus-recurrent.json || return 1\n'''
          assert old_expr in workflow
          new_expr = '''              timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" \\
                env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \\
                ROOM_NODE_PROMPT="${ROOM_PROMPT_EXPRESSION:-}" ROOM_NODE_ID="$n" ROOM_EXPRESSION_RANK="$rank" \\
                python3 scripts/room_skill_exec.py scripts/room_expression_node.py node --phase recurrent --bus room_work/bus-recurrent.json\n              expr_rc=$?\n              if [ "$expr_rc" -eq "$ROOM_QUALITY_REJECTION_EXIT" ]; then\n                return "$ROOM_QUALITY_REJECTION_EXIT"\n              fi\n              [ "$expr_rc" -eq 0 ] || return 1\n'''
          workflow = workflow.replace(old_expr, new_expr, 1)

          old_commit = '''            timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" \\
              env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \\
              python3 scripts/room_private_commit.py commit || return 1\n'''
          assert old_commit in workflow
          new_commit = '''            timeout -k "${ROOM_NODE_KILL_GRACE_SECONDS}s" "${ROOM_NODE_TIMEOUT_SECONDS}s" \\
              env -u ROOM_PROMPT_PERCEPTION -u ROOM_PROMPT_DELIBERATION -u ROOM_PROMPT_EXPRESSION \\
              python3 scripts/room_private_commit.py commit\n            commit_rc=$?\n            if [ "$commit_rc" -eq "$ROOM_QUALITY_REJECTION_EXIT" ]; then\n              return "$ROOM_QUALITY_REJECTION_EXIT"\n            fi\n            [ "$commit_rc" -eq 0 ] || return 1\n'''
          workflow = workflow.replace(old_commit, new_commit, 1)

          old_loop = '''          while [ "$SECONDS" -lt "$stop_at" ]; do\n            if ! run_beat; then\n              consecutive_failures=$((consecutive_failures + 1))\n'''
          assert old_loop in workflow
          new_loop = '''          while [ "$SECONDS" -lt "$stop_at" ]; do\n            run_beat\n            beat_rc=$?\n            if [ "$beat_rc" -eq "$ROOM_QUALITY_REJECTION_EXIT" ]; then\n              consecutive_failures=0\n              echo "Dialogue-quality boundary rejected this beat; regenerating without tripping infrastructure breaker"\n              sleep 1\n              continue\n            fi\n            if [ "$beat_rc" -ne 0 ]; then\n              consecutive_failures=$((consecutive_failures + 1))\n'''
          workflow = workflow.replace(old_loop, new_loop, 1)
          wf.write_text(workflow)

          Path('scripts/room_quality_rejection_runner_sim.py').write_text(r'''#!/usr/bin/env python3
from __future__ import annotations

from pathlib import Path

import room_expression_node as expression
import room_private_commit as publish


def main() -> None:
    assert expression.QUALITY_REJECTION_EXIT == publish.QUALITY_REJECTION_EXIT == 42
    assert expression.expression_quality_rejection_exit_code(
        RuntimeError("private model output rejected for expression: same_beat_sentence_copy")
    ) == 42
    assert expression.expression_quality_rejection_exit_code(
        RuntimeError("private model output rejected for expression: same_beat_consensus_echo")
    ) == 42
    assert expression.expression_quality_rejection_exit_code(
        RuntimeError("private model request failed for expression: HTTP 500")
    ) is None
    assert expression.expression_quality_rejection_exit_code(
        RuntimeError("private model output rejected for expression: invalid json")
    ) is None

    assert publish.quality_rejection_exit_code(
        RuntimeError("private Room same-beat echo blocked for mara: same_beat_semantic_coverage")
    ) == 42
    assert publish.quality_rejection_exit_code(
        RuntimeError("private Room same-beat echo blocked for sarah: same_beat_consensus_echo")
    ) == 42
    assert publish.quality_rejection_exit_code(
        RuntimeError("private Room privacy leak blocked for mara")
    ) is None

    workflow = (Path(__file__).resolve().parents[1] / '.github/workflows/sarah-society.yml').read_text()
    assert 'ROOM_QUALITY_REJECTION_EXIT=42' in workflow
    assert 'scripts/room_expression_node.py node --phase recurrent' in workflow
    assert 'expr_rc=$?' in workflow and 'commit_rc=$?' in workflow and 'beat_rc=$?' in workflow
    assert workflow.count('return "$ROOM_QUALITY_REJECTION_EXIT"') >= 2
    quality = workflow.find('if [ "$beat_rc" -eq "$ROOM_QUALITY_REJECTION_EXIT" ]')
    failure = workflow.find('consecutive_failures=$((consecutive_failures + 1))', quality)
    assert quality >= 0 and failure > quality
    assert 'consecutive_failures=0' in workflow[quality:failure]

    hard = 0
    published = 0
    for rc in (42, 42, 0):
        if rc == 42:
            hard = 0
            continue
        if rc != 0:
            hard += 1
            continue
        hard = 0
        published += 1
    assert hard == 0 and published == 1
    for rc in (1, 1):
        if rc:
            hard += 1
    assert hard == 2
    print('ROOM QUALITY-REJECTION RUNNER SIM: GREEN')


if __name__ == '__main__':
    main()
''')

          arch = Path('.github/workflows/room-architecture-smoke.yml')
          smoke = arch.read_text()
          trigger = "      - 'scripts/room_publish_quality_sim.py'\n"
          assert trigger in smoke
          smoke = smoke.replace(trigger, trigger + "      - 'scripts/room_expression_node.py'\n      - 'scripts/room_quality_rejection_runner_sim.py'\n", 1)
          compile_line = next(line for line in smoke.splitlines() if 'python3 -m py_compile ' in line)
          if 'scripts/room_expression_node.py' not in compile_line:
              smoke = smoke.replace(compile_line, compile_line + ' scripts/room_expression_node.py scripts/room_quality_rejection_runner_sim.py', 1)
          run_marker = '          python3 scripts/room_publish_quality_sim.py\n'
          assert run_marker in smoke
          smoke = smoke.replace(run_marker, run_marker + '          python3 scripts/room_quality_rejection_runner_sim.py\n', 1)
          arch.write_text(smoke)
          PY

          python3 -m py_compile scripts/room_expression_node.py scripts/room_private_commit.py scripts/room_quality_rejection_runner_sim.py
          python3 scripts/room_expression_quality_sim.py
          python3 scripts/room_consensus_echo_sim.py
          python3 scripts/room_cross_voice_novelty_sim.py
          python3 scripts/room_publish_quality_sim.py
          python3 scripts/room_publish_phrase_sim.py
          python3 scripts/room_quality_rejection_runner_sim.py
          python3 scripts/room_retry_truncation_sim.py
          python3 scripts/room_incomplete_tail_live_sim.py
          python3 scripts/room_live_echo_pipeline_sim.py

          git config user.name 'room-repair-bot'
          git config user.email 'room-repair-bot@users.noreply.github.com'
          git add -- .github/workflows/room-architecture-smoke.yml .github/workflows/sarah-society.yml scripts/room_expression_node.py scripts/room_private_commit.py scripts/room_quality_rejection_runner_sim.py
          git commit -m 'Keep Room alive across dialogue-quality rejections'
          git push --force-with-lease origin HEAD:fix/room-quality-rejection-liveness-20260821
