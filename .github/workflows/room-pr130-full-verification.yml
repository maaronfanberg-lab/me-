name: Room PR130 full verification

on:
  push:
    branches:
      - fix/room-single-prior-phrase-echo-20260821
    paths:
      - '.github/workflows/room-pr130-full-verification.yml'
      - 'scripts/room_expression_quality.py'
      - 'scripts/room_expression_quality_core.py'
      - 'scripts/room_consensus_echo_sim.py'
  pull_request:
    paths:
      - '.github/workflows/room-pr130-full-verification.yml'
      - 'scripts/room_expression_quality.py'
      - 'scripts/room_expression_quality_core.py'
      - 'scripts/room_consensus_echo_sim.py'

jobs:
  full:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run exact 4793 and established Room regressions
        run: |
          python3 -m py_compile scripts/room_expression_quality.py scripts/room_expression_quality_core.py scripts/room_consensus_echo_sim.py
          python3 scripts/room_consensus_echo_sim.py
          python3 scripts/room_expression_quality_sim.py
          python3 scripts/room_cross_voice_novelty_sim.py
          python3 scripts/room_publish_quality_sim.py
          python3 scripts/room_retry_truncation_sim.py
          python3 scripts/room_live_echo_pipeline_sim.py
          python3 scripts/room_engine_v5.py selftest
