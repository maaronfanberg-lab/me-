name: Room secret presence check

on:
  push:
    paths:
      - 'society/secret-check-kick.txt'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Record secret presence only
        env:
          P1: ${{ secrets.ROOM_PROMPT_PERCEPTION != '' }}
          P2: ${{ secrets.ROOM_PROMPT_DELIBERATION != '' }}
          P3: ${{ secrets.ROOM_PROMPT_EXPRESSION != '' }}
        run: |
          printf '{"perception":%s,"deliberation":%s,"expression":%s}\n' "$P1" "$P2" "$P3" > room/secret-check.json
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add room/secret-check.json
          git commit -m "Record Room secret presence"
          git push origin HEAD:main
