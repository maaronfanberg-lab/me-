name = "room-live-mirror"
main = "src/index-entry.js"
compatibility_date = "2026-08-17"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomState"

[[durable_objects.bindings]]
name = "LEVIATHAN_SIGNALS"
class_name = "LeviathanSignalStore"

[exports.RoomState]
type = "durable-object"
storage = "sqlite"

[exports.LeviathanSignalStore]
type = "durable-object"
storage = "sqlite"
