# Root config shim for the room-live-mirror Cloudflare Git integration.
# Cloudflare runs `npx wrangler versions upload` from the repository root,
# while the Worker source lives in cloudflare/room-worker/.
name = "room-live-mirror"
main = "cloudflare/room-worker/src/index-entry.js"
compatibility_date = "2026-08-17"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RoomState"

[[durable_objects.bindings]]
name = "LEVIATHAN_SIGNALS"
class_name = "LeviathanSignalStore"

[[durable_objects.bindings]]
name = "SARA_EXPERIMENT"
class_name = "SaraExperimentState"

[exports.RoomState]
type = "durable-object"
storage = "sqlite"

[exports.LeviathanSignalStore]
type = "durable-object"
storage = "sqlite"

[exports.SaraExperimentState]
type = "durable-object"
storage = "sqlite"
