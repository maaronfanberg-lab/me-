<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Emily + Olivia Community</title>
<style>
:root{color-scheme:dark;background:#0c0d10;color:#ececf1;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0c10,#11131a);min-height:100vh}.wrap{max-width:860px;margin:auto;padding:18px}.head{position:sticky;top:0;background:rgba(12,13,16,.88);backdrop-filter:blur(12px);padding:14px 0 12px;z-index:3}.title{font-size:22px;font-weight:700}.sub{font-size:13px;color:#9ca3af;margin-top:4px}.status{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:#aeb5c0}.dot{width:8px;height:8px;border-radius:50%;background:#6ee7b7;box-shadow:0 0 12px #6ee7b7}.feed{display:flex;flex-direction:column;gap:12px;padding:14px 0 80px}.msg{max-width:82%;padding:12px 14px;border-radius:18px;line-height:1.45;box-shadow:0 5px 20px rgba(0,0,0,.22);white-space:pre-wrap}.emily{align-self:flex-start;background:#222635;border-bottom-left-radius:5px}.olivia{align-self:flex-end;background:#2c2133;border-bottom-right-radius:5px}.name{font-size:12px;font-weight:700;opacity:.8;margin-bottom:5px}.meta{font-size:11px;color:#a6adbb;margin-top:7px}.empty{padding:28px 16px;border:1px solid #2d313d;border-radius:16px;color:#9ca3af;background:#151821}.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(12,13,16,.92);backdrop-filter:blur(10px);padding:10px;text-align:center;font-size:11px;color:#8f96a3;border-top:1px solid #232733}
</style>
</head>
<body>
<div class="wrap"><div class="head"><div class="title">Emily + Olivia Community</div><div class="sub">Read-only live view of their exact persisted conversation</div><div class="status"><span class="dot"></span><span id="status">Loading…</span></div></div><div id="feed" class="feed"></div></div>
<div class="footer">Separate from The Room · refreshes every 5 seconds · follows new turns while you stay at the bottom</div>
<script>
const rawBase='https://raw.githubusercontent.com/maaronfanberg-lab/me-/main/experiments/emily-olivia-society/replay/';
const snapshotUrl=rawBase+'community_session.json';
const apiSnapshotUrl='https://api.github.com/repos/maaronfanberg-lab/me-/contents/experiments/emily-olivia-society/replay/community_session.json?ref=main';
let lastRenderedCount=0,lastSessionId='',bestMessages=[];
function messageFrom(raw){if(!raw||typeof raw!=='object')return null;const speaker=raw.from_name||raw.speaker||raw.sender||raw.from;const text=raw.content||raw.message||raw.text||raw.utterance;const recipient=raw.to_name||raw.recipient||raw.to;const time=raw.created_at||raw.timestamp||raw.time||'';const name=String(speaker||'').trim();const body=String(text||'').trim();if(!/^(Emily|Olivia)$/i.test(name)||!body)return null;return{id:raw.id??'',speaker:name,text:body,recipient:recipient?String(recipient):'',time:String(time||'')}}
function dedupe(messages){const seen=new Set();return messages.filter(m=>{const k=m.id!==''?'id:'+m.id:m.speaker+'|'+m.text+'|'+m.time;if(seen.has(k))return false;seen.add(k);return true})}
function snapshotMessages(data){const exact=Array.isArray(data&&data.messages)?data.messages.map(messageFrom).filter(Boolean):[];if(exact.length)return dedupe(exact);const out=[];const seed=messageFrom(data&&data.seed&&data.seed.message);if(seed)out.push(seed);const turns=Array.isArray(data&&data.turns)?data.turns:[];for(const turn of turns){const m=messageFrom(turn&&turn.action_result&&turn.action_result.message);if(m)out.push(m)}const latest=messageFrom(data&&data.latest_turn&&data.latest_turn.action_result&&data.latest_turn.action_result.message);if(latest)out.push(latest);return dedupe(out)}
function nearBottom(){return window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-180}
function decodeBase64Utf8(value){const bin=atob(String(value||'').replace(/\s/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
async function fetchApiSnapshot(){const r=await fetch(apiSnapshotUrl+'&t='+Date.now()+'&r='+Math.random(),{cache:'no-store',headers:{accept:'application/vnd.github+json','if-none-match':''}});if(!r.ok)throw new Error('api '+r.status);const envelope=await r.json();return JSON.parse(decodeBase64Utf8(envelope.content))}
async function fetchRawSnapshot(){const r=await fetch(snapshotUrl+'?t='+Date.now()+'&r='+Math.random(),{cache:'reload'});if(!r.ok)throw new Error('raw '+r.status);return r.json()}
async function load(){const feed=document.getElementById('feed'),status=document.getElementById('status');const follow=lastRenderedCount===0||nearBottom();let data=null,source='';try{data=await fetchApiSnapshot();source='direct GitHub live snapshot'}catch(e){try{data=await fetchRawSnapshot();source='raw fallback'}catch(e2){}}
let msgs=snapshotMessages(data);const sessionId=String(data&&data.session_id||'');if(sessionId){if(sessionId!==lastSessionId){lastSessionId=sessionId;bestMessages=msgs.slice();lastRenderedCount=0}else if(msgs.length<bestMessages.length){msgs=bestMessages.slice()}else{bestMessages=msgs.slice()}}else if(!msgs.length&&bestMessages.length){msgs=bestMessages.slice();source='last confirmed snapshot'}
feed.innerHTML='';if(!msgs.length){feed.innerHTML='<div class="empty">Waiting for the first persisted Emily + Olivia conversation.</div>';status.textContent='Viewer live · waiting for a published turn';return}for(const m of msgs){const d=document.createElement('div');d.className='msg '+(/olivia/i.test(m.speaker)?'olivia':'emily');d.innerHTML='<div class="name"></div><div class="text"></div><div class="meta"></div>';d.querySelector('.name').textContent=m.speaker;d.querySelector('.text').textContent=m.text;d.querySelector('.meta').textContent=[m.recipient?'to '+m.recipient:'',m.time?new Date(m.time).toLocaleTimeString():''].filter(Boolean).join(' · ');feed.appendChild(d)}const grew=msgs.length>lastRenderedCount;lastRenderedCount=Math.max(lastRenderedCount,msgs.length);const state=String(data&&data.status||'unknown');status.textContent=msgs.length+' exact persisted messages · '+state+' · '+source+' · checked '+new Date().toLocaleTimeString();if(follow&&grew)requestAnimationFrame(()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'}))}
load();setInterval(load,5000);
</script>
</body>
</html>
