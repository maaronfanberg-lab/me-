name: PocketSpatialNative
options:
  bundleIdPrefix: com.maaronfanberglab
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
targets:
  PocketSpatialNative:
    type: application
    platform: iOS
    sources:
      - PocketSpatialNative
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maaronfanberglab.PocketSpatialNative
        TARGETED_DEVICE_FAMILY: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        CODE_SIGN_STYLE: Automatic
