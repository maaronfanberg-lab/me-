<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>The Room · Live Now</title>
<style>
:root{--b:#08090d;--p:#11141b;--l:#2b3240;--t:#f5f3ee;--m:#969daa;--g:#d7c18a;--live:#98dfc8;--warn:#e0bf79}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(900px 600px at 10% -15%,#1a2130 0,transparent 58%),var(--b)}button,textarea{font:inherit}.app{max-width:900px;margin:auto;min-height:100dvh}.top{position:sticky;top:0;z-index:3;padding:calc(12px + env(safe-area-inset-top)) 14px 11px;background:#08090df2;border-bottom:1px solid var(--l);display:flex;gap:9px;align-items:center;backdrop-filter:blur(16px)}.brand{font-weight:850;font-size:22px;letter-spacing:-.04em}.brand small{display:block;color:var(--g);font:700 9px ui-monospace,monospace;letter-spacing:.15em}.sp{flex:1}.status{border:1px solid var(--l);background:var(--p);color:var(--warn);border-radius:12px;padding:9px 11px;font-size:11px;font-weight:750}.status.live{color:var(--live)}.chat{padding:18px 12px 175px}.empty{padding:22vh 20px;text-align:center;color:var(--m);line-height:1.6}.msg{max-width:94%;margin:0 0 16px;padding:12px 14px 13px;background:var(--p);border:1px solid var(--l);border-radius:18px;line-height:1.5;white-space:pre-wrap}.msg.allen{border-color:#756338;background:#17150f}.who{font:800 9px ui-monospace,monospace;letter-spacing:.14em;color:var(--g);margin-bottom:7px}.when{color:#69717f;font-size:9px;margin-top:8px}.meta{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:5;transform:translateX(-50%);width:min(94%,680px);padding:7px 11px;background:#0d1016ee;border:1px solid var(--l);border-radius:999px;text-align:center;color:var(--m);font-size:9px;backdrop-filter:blur(12px);pointer-events:none}.composer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#08090df8;border-top:1px solid var(--l);padding:8px 10px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.composer-inner{width:min(100%,760px);margin:auto}.talkrow{display:flex;gap:8px;align-items:flex-end}.talkrow textarea{flex:1;min-height:48px;max-height:126px;resize:none;background:#11141b;color:#fff;border:1px solid #394150;border-radius:13px;padding:11px 12px;outline:none}.send{border:1px solid var(--g);background:var(--g);color:#15130d;border-radius:13px;padding:12px 15px;font-weight:850;min-width:70px}.send:disabled{opacity:.5}.sendstate{height:15px;margin:4px 2px 0;color:var(--m);font-size:10px}.sendstate.ok{color:var(--live)}.sendstate.bad{color:var(--warn)}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand">The Room<small>FRESHEST VALID FEED</small></div><div class="sp"></div><button id="status" class="status" type="button">loading</button></header><main id="chat" class="chat"><div class="empty">Loading the current Room…</div></main></div>
<div id="meta" class="meta">Checking live sources…</div>
<div class="composer"><div class="composer-inner"><div class="talkrow"><textarea id="turn" maxlength="700" rows="1" placeholder="Speak as Allen…" aria-label="Speak as Allen"></textarea><button id="send" class="send" type="button">Send</button></div><div id="sendState" class="sendstate"></div></div></div>
<script>
const LOCAL_FEED='feed.json';
const LOCAL_HISTORY='conversation.json';
const RAW_FEED='https://raw.githubusercontent.com/maaronfanberg-lab/me-/main/room/feed.json';
const RAW_HISTORY='https://raw.githubusercontent.com/maaronfanberg-lab/me-/main/room/conversation.json';
const RELAY_FEED='https://room-live-mirror.dfp6k69dw5.workers.dev/api/feed';
const ALLEN_POST='https://room-live-mirror.dfp6k69dw5.workers.dev/api/allen';
const CACHE_KEY='roomLiveNowLastValidFeedV1';
const $=s=>document.querySelector(s);
let feed=null,history=[],rendered='',busy=false,sending=false,source='';
function ts(v){const n=Date.parse(v||'');return Number.isFinite(n)?n:0}
function feedStamp(v){return ts(v?.generated_at||v?.state?.last_run)}
function when(v){try{return new Date(v).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit'})}catch{return''}}
async function getJson(url,timeout=6000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const sep=url.includes('?')?'&':'?';const r=await fetch(url+sep+'fresh='+Date.now()+'-'+Math.random().toString(36).slice(2),{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(timer)}}
function valid(raw){const v=raw?.feed||raw;if(!v?.state||!Array.isArray(v.conversation))throw new Error('bad feed');return v}
function saveValidFeed(v){try{localStorage.setItem(CACHE_KEY,JSON.stringify(v))}catch{}}
function restoreCachedFeed(){try{const raw=localStorage.getItem(CACHE_KEY);if(!raw)return false;const cached=valid(JSON.parse(raw));feed=cached;source='cached last valid';render();status();return true}catch{return false}}
async function freshestFeed(){const specs=[['Pages same-origin',LOCAL_FEED,3500],['GitHub Raw',RAW_FEED,5000],['Cloudflare relay',RELAY_FEED,2500]];const results=await Promise.allSettled(specs.map(async ([name,url,timeout])=>({name,data:valid(await getJson(url,timeout))})));const good=results.filter(r=>r.status==='fulfilled').map(r=>r.value);if(!good.length)throw new Error('all feed sources failed');good.sort((a,b)=>feedStamp(b.data)-feedStamp(a.data));source=good[0].name;return good[0].data}
async function freshestHistory(){const results=await Promise.allSettled([getJson(LOCAL_HISTORY,5000),getJson(RAW_HISTORY,7000)]);const lists=results.filter(r=>r.status==='fulfilled'&&Array.isArray(r.value)).map(r=>r.value);if(!lists.length)return[];lists.sort((a,b)=>ts(b.at(-1)?.at)-ts(a.at(-1)?.at));return lists[0]}
function merged(){const out=[],seen=new Set();for(const list of [history,feed?.conversation||[]])for(const m of list){if(!m)continue;const id=m.id||[m.speaker,m.at,m.text].join('|');if(seen.has(id))continue;seen.add(id);out.push(m)}out.sort((a,b)=>ts(a.at)-ts(b.at)||String(a.id||'').localeCompare(String(b.id||'')));return out}
function render(){const conv=merged(),last=conv.at(-1),sig=(last?.id||'')+':'+conv.length;if(sig===rendered)return;rendered=sig;const f=document.createDocumentFragment();if(!conv.length){const e=document.createElement('div');e.className='empty';e.textContent='Feed loaded but there are no Room messages.';f.appendChild(e)}for(const m of conv.slice(-240)){const d=document.createElement('div');d.className='msg'+(m.speaker==='allen'?' allen':'');const w=document.createElement('div');w.className='who';w.textContent=({sarah:'Sarah',mara:'Mara',owen:'Owen',jules:'Jules',allen:'Allen'})[m.speaker]||m.speaker||'';const t=document.createElement('div');t.textContent=m.text||'';const q=document.createElement('div');q.className='when';q.textContent=when(m.at);d.append(w,t,q);f.appendChild(d)}$('#chat').replaceChildren(f);setTimeout(()=>window.scrollTo({top:document.documentElement.scrollHeight,behavior:'auto'}),20)}
function lifeStatus(){const entries=Object.entries(feed?.room_life?.activities||{}).filter(([,v])=>v?.task);if(entries.length){const brief=entries.slice(0,2).map(([who,v])=>who[0].toUpperCase()+who.slice(1)+' '+v.task.verb+' '+v.task.object+' ('+v.task.progress+'/'+v.task.duration+')');return ' · independent work: '+brief.join(' · ')+(entries.length>2?' · +'+(entries.length-2)+' more':'')}const event=(feed?.room_life?.recent_events||[]).at(-1);return event?.kind==='work_completed'?' · '+event.description:''}
function status(){if(!feed){$('#status').textContent='retry';$('#status').className='status';return}const age=Math.max(0,Math.floor((Date.now()-feedStamp(feed))/1000)),cycle=feed.state?.cycle??'—',last=merged().at(-1);$('#status').textContent='beat '+cycle+' · '+age+'s';$('#status').className='status'+(age<150?' live':'');$('#meta').textContent=(last?('Latest '+when(last.at)+' · '):'')+source+' · auto 2s'+lifeStatus()}
async function refresh(){if(busy)return;busy=true;try{const next=await freshestFeed();feed=next;saveValidFeed(next);render();status()}catch(e){$('#status').textContent=feed?'retrying · showing last':'feed error';$('#status').className='status';if(feed){const last=merged().at(-1);$('#meta').textContent=(last?('Latest '+when(last.at)+' · '):'')+'last valid feed · retrying automatically'}else{$('#chat').innerHTML='<div class="empty">Could not load a Room feed yet. Retrying automatically…</div>';$('#meta').textContent=String(e?.message||e)}}finally{busy=false}}
async function loadHistory(){const next=await freshestHistory();if(next.length)history=next;render();status()}
async function speak(){const text=$('#turn').value.trim();if(!text||sending)return;sending=true;$('#send').disabled=true;$('#sendState').textContent='Sending Allen…';try{const r=await fetch(ALLEN_POST,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||('HTTP '+r.status));$('#turn').value='';$('#sendState').textContent='Allen queued for the next Room beat.';$('#sendState').className='sendstate ok';setTimeout(refresh,800)}catch(e){$('#sendState').textContent=String(e?.message||e||'send failed');$('#sendState').className='sendstate bad'}finally{sending=false;$('#send').disabled=false;$('#turn').focus()}}
$('#status').onclick=refresh;$('#send').onclick=speak;$('#turn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();speak()}});restoreCachedFeed();refresh();loadHistory();setInterval(refresh,2000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});window.addEventListener('pageshow',refresh);
</script>
</body></html>
